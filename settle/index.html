<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settle</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Settle">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png" id="touchIcon">
<link rel="icon" href="icons/icon-192.png" id="favIcon">
<link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch-1170x2532.png">
<script>
/* pick the saved icon before Safari reads it, so "Add to Home Screen" uses your choice */
try { var ui0 = JSON.parse(localStorage.getItem("settle.v1") || "{}").ui || {}; document.documentElement.dataset.card = ui0.card || "glass"; var ic = ui0.icon;
  if (ic && ic !== "mono"){ document.getElementById("touchIcon").href = "icons/" + ic + "-180.png"; document.getElementById("favIcon").href = "icons/" + ic + "-192.png"; } } catch(e){}
</script>
<style>
@font-face{font-family:"Settle Serif";src:url(fonts/instrument-serif.woff2) format("woff2");font-display:swap}
:root{
  --base:#000; --text:#f5f5f7; --text2:#8e8e93; --text3:#545458;
  --sep:rgba(255,255,255,.09); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.14);
  --green:#30d158; --red:#ff453a;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --ease:cubic-bezier(.16,1,.3,1);
  --serif:"Settle Serif","New York","Iowan Old Style",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--base);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg{display:block}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ===== glass ===== */
.gbtn{color:var(--text);background:rgba(255,255,255,.04);
  -webkit-backdrop-filter:blur(6px) saturate(170%) brightness(1.18);backdrop-filter:blur(6px) saturate(170%) brightness(1.18);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 2px 2.5px 1px -1px rgba(255,255,255,.5),inset -2px -2px 1px -1px rgba(255,255,255,.22),
    inset 0 0 10px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.5)}
.card{position:relative;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.16)}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015)),rgba(22,22,26,.84);
  -webkit-backdrop-filter:blur(34px) saturate(190%);backdrop-filter:blur(34px) saturate(190%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14),inset 0 1.5px 0 rgba(255,255,255,.22),0 30px 80px rgba(0,0,0,.6)}

/* ===== layout ===== */
#main{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding:calc(var(--sat) + 8px) 16px calc(var(--sab) + 120px)}
#glow{position:fixed;left:50%;top:-120px;width:520px;height:420px;margin-left:-260px;pointer-events:none;z-index:-1;
  background:radial-gradient(closest-side,rgba(255,255,255,.07),rgba(255,255,255,0))}
.bar{position:fixed;left:0;right:0;top:0;z-index:20;height:calc(var(--sat) + 44px);padding-top:var(--sat);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 .5px 0 var(--sep)}
.bar.on{opacity:1}
.bar b{font:400 22px var(--serif);letter-spacing:.2px}
.top{display:flex;align-items:center;justify-content:space-between;height:64px;margin:4px 2px 6px}
.title{font:400 44px/1 var(--serif);letter-spacing:.2px}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.round svg{width:20px;height:20px}
.ico{width:22px;height:22px}

/* hero */
.hero{padding:22px 22px 18px;margin-bottom:12px}
.lbl{font-size:13px;letter-spacing:.005em;color:var(--text2)}
.big{font:400 54px/1.05 var(--serif);letter-spacing:-.3px;margin:6px 0 2px}
.big small{font:400 24px var(--serif);color:var(--text2);margin-right:6px;letter-spacing:0}
.hero-row{display:flex;gap:10px;margin-top:16px}
.stat{flex:1;border-radius:16px;padding:11px 13px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}
.stat .v{font-size:17px;letter-spacing:-.01em;font-weight:500;margin-top:2px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;border-radius:22px;font-size:17px;letter-spacing:-.01em;font-weight:500}
.pill.white{background:#f5f5f7;color:#000}
.pill.soft{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12)}
.pill.red{color:var(--red);background:rgba(255,69,58,.12)}
.pill:active,.opt:active,.chip:active,.row:active,.key:active,.mrow:active{transform:scale(.97);transition:transform .08s}
.pill,.opt,.chip,.row,.key,.mrow{transition:transform .25s var(--ease),background .2s}
.settle-btn{width:100%;margin-top:14px}

/* check-in banner */
.due{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;margin-bottom:12px}
.due .t{flex:1;min-width:0}
.due .t b{display:block;font-size:17px;letter-spacing:-.01em;font-weight:500}
.due .t span{font-size:13px;letter-spacing:.005em;color:var(--text2)}
.due .pill{height:36px;padding:0 14px;font-size:15px;letter-spacing:-.005em}
.due .skip{font-size:15px;letter-spacing:-.005em;color:var(--text2);padding:8px 4px}

/* charts */
.chart-card{padding:18px 18px 12px;margin-bottom:12px}
.ch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ch-val{font:400 32px/1.1 var(--serif);margin-top:4px}
.ch-sub{font-size:13px;letter-spacing:.005em;color:var(--text2);margin-top:2px;min-height:17px}
.seg{display:flex;background:var(--fill2);border-radius:10px;padding:2px;margin-top:12px}
.seg button{flex:1;height:30px;border-radius:8px;font-size:13px;letter-spacing:.005em;font-weight:500;color:var(--text2)}
.seg button.on{background:rgba(255,255,255,.14);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.chart{position:relative;height:170px;margin:10px -4px 0;touch-action:pan-y}
.chart svg{width:100%;height:100%;overflow:visible}
.chart text{fill:var(--text3);font-size:11px;letter-spacing:.02em;font-weight:500}
.empty-chart{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;letter-spacing:-.005em;color:var(--text2);text-align:center;padding:0 30px}
.mini-btn{font-size:15px;letter-spacing:-.005em;color:var(--text2);padding:6px 2px;font-weight:500}

/* sections */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 10px}
.sec h2{font:400 26px var(--serif);letter-spacing:.2px}
.day{font-size:13px;letter-spacing:.005em;color:var(--text2);margin:16px 6px 8px;font-weight:500}
.list{padding:4px 0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;width:100%;text-align:left;position:relative}
.row + .row::before{content:"";position:absolute;left:64px;right:0;top:0;height:.5px;background:var(--sep)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font:400 19px var(--serif);background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12)}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-weight:500;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{display:block;font-size:13px;letter-spacing:.005em;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none}
.row .r b{display:block;font-weight:500;font-size:17px;letter-spacing:-.01em}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;letter-spacing:.005em;font-weight:500;color:var(--text2)}
.tag.paid{color:var(--green)}
.tag svg{width:12px;height:12px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text2)}
.empty{padding:34px 24px;text-align:center;color:var(--text2);font-size:15px;letter-spacing:-.005em}
.empty b{display:block;color:var(--text);font:400 22px var(--serif);margin-bottom:6px}
.mrow{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left;position:relative}
.mrow + .mrow::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.mrow .m{flex:1}
.mrow .m b{font-weight:500}
.mrow .m span{display:block;font-size:13px;letter-spacing:.005em;color:var(--text2)}
.chev{width:8px;height:14px;color:var(--text3)}
.more{display:block;margin:10px auto 0;font-size:15px;letter-spacing:-.005em;color:var(--text2);padding:8px 16px}

/* + button */
.fab{position:fixed;right:20px;bottom:calc(var(--sab) + 22px);z-index:30;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;transition:transform .3s var(--ease)}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.9)}

/* ===== sheet ===== */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - var(--sat) - 14px);border-radius:32px 32px 0 0;display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .5s var(--ease);will-change:transform}
.sheet.on{transform:none}
.grab{height:22px;flex:none;display:grid;place-items:center;touch-action:none}
.grab i{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
.shead{display:flex;align-items:center;justify-content:space-between;min-height:40px;padding:0 18px;flex:none;touch-action:none}
.shead h3{font-size:17px;letter-spacing:-.01em;font-weight:500;text-align:center;flex:1}
.txt-btn{font-size:17px;letter-spacing:-.01em;color:var(--text2);min-width:64px;text-align:left;padding:8px 0}
.txt-btn.r{text-align:right}
.txt-btn.bold{color:var(--text);font-weight:500}
.sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 18px calc(var(--sab) + 22px);flex:1}

/* add flow */
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);transition:width .35s var(--ease),background .3s}
.steps i.on{width:18px;background:#fff}
.q{font:400 30px/1.15 var(--serif);text-align:center;margin:14px 10px 4px}
.qs{text-align:center;font-size:15px;letter-spacing:-.005em;color:var(--text2);margin-bottom:16px}
.amt{font:400 60px/1.1 var(--serif);text-align:center;margin:18px 0 4px;letter-spacing:-.3px;min-height:70px}
.amt small{font-size:28px;color:var(--text2);margin-right:6px}
.amt.zero{color:var(--text3)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 14px}
.key{height:58px;border-radius:18px;font-size:26px;font-weight:400;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08);display:grid;place-items:center}
.key svg{width:26px;height:26px}
.key.clear{background:none;box-shadow:none}
.again{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px 4px;scrollbar-width:none}
.again::-webkit-scrollbar{display:none}
.again .chip{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0 14px}
.chip{height:44px;padding:0 18px;border-radius:22px;font-size:17px;letter-spacing:-.01em;font-weight:500;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1);display:inline-flex;align-items:center;gap:8px}
.chip.on{background:#f5f5f7;color:#000}
.chip.dashed{background:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);color:var(--text2)}
.chip small{color:var(--text2);font-size:15px;letter-spacing:-.005em}
.field{width:100%;height:52px;border-radius:16px;border:0;outline:0;padding:0 16px;font-size:17px;letter-spacing:-.01em;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.field::placeholder{color:var(--text3)}
.newp{display:flex;gap:8px;margin-bottom:10px}
.newp .pill{flex:none;height:52px;border-radius:16px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.opt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;text-align:left;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.opt .oi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:none}
.opt .oi svg{width:22px;height:22px}
.opt b{display:block;font-size:17px;letter-spacing:-.01em;font-weight:500}
.opt span{display:block;font-size:13px;letter-spacing:.005em;color:var(--text2);margin-top:1px}
.opt.on{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
.notes{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.note{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:20px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.note .nv{flex:1;font:400 26px var(--serif)}
.note .nv small{font-size:15px;letter-spacing:-.005em;color:var(--text2);margin-right:4px;font-family:-apple-system,system-ui,sans-serif}
.step-n{display:flex;align-items:center;gap:6px}
.step-n button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:24px;font-weight:400}
.step-n .c{min-width:34px;text-align:center;font-size:20px;font-weight:500}
.total{display:flex;justify-content:space-between;align-items:center;margin:16px 4px 6px;font-size:15px;letter-spacing:-.005em;color:var(--text2)}
.total b{color:var(--text);font-size:17px;letter-spacing:-.01em}
.total .ok{color:var(--green)}
.next{width:100%;margin-top:14px;height:54px;border-radius:27px;font-size:17px;letter-spacing:-.01em}
.next[aria-disabled="true"]{opacity:.35}

/* review + details */
.group{border-radius:20px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1);margin:12px 0;overflow:hidden}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:12px 16px;position:relative}
.kv + .kv::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.kv span{color:var(--text2);font-size:15px;letter-spacing:-.005em}
.kv b{font-weight:500;text-align:right}
.kv input{background:none;border:0;outline:0;text-align:right;font-size:17px;letter-spacing:-.01em;color:var(--text);min-width:0;flex:1}
.kv input[type="datetime-local"]{color-scheme:dark;-webkit-appearance:none;appearance:none;max-width:60%}
.kv input::placeholder{color:var(--text3)}
.kv.tap{width:100%;text-align:left}
.detail-amt{font:400 56px/1.1 var(--serif);text-align:center;margin-top:10px}
.detail-sub{text-align:center;color:var(--text2);font-size:15px;letter-spacing:-.005em;margin-top:4px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.btns .pill{width:100%;height:52px;border-radius:26px}
.hint{font-size:13px;letter-spacing:.005em;color:var(--text2);line-height:1.45;margin:8px 4px}
.hint.err{color:var(--red)}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0 4px}
.icons button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;letter-spacing:.02em;color:var(--text2)}
.icons img{width:100%;max-width:58px;aspect-ratio:1;border-radius:22.5%;box-shadow:0 0 0 .5px rgba(255,255,255,.15)}
.icons button.on img{box-shadow:0 0 0 2px #000,0 0 0 4px #f5f5f7}
.icons button.on{color:var(--text)}
.slbl{font-size:13px;letter-spacing:.005em;color:var(--text2);margin:22px 4px 0;font-weight:500}
.set-row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:12px 16px;text-align:left;font-size:17px;letter-spacing:-.01em;position:relative}
.set-row + .set-row::before{content:"";position:absolute;left:52px;right:0;top:0;height:.5px;background:var(--sep)}
.set-row svg{width:22px;height:22px;flex:none;color:var(--text2)}
.set-row .s{margin-left:auto;font-size:15px;letter-spacing:-.005em;color:var(--text2)}
.set-row .s.err{color:var(--red)}
.ol{padding-left:20px;font-size:15px;letter-spacing:-.005em;line-height:1.5;color:var(--text2)}
.ol li{margin:8px 0}
.ol b{color:var(--text)}
.ol a{color:var(--text);text-decoration:underline}
.pchips{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.pchips .chip{height:36px;padding:0 8px 0 14px;font-size:15px;letter-spacing:-.005em}
.pchips .chip .x{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:15px;letter-spacing:-.005em;color:var(--text2)}

/* one-screen add */
.prow{display:flex;gap:8px;overflow-x:auto;margin:4px -18px 2px;padding:4px 18px;scrollbar-width:none}
.prow::-webkit-scrollbar{display:none}
.prow .chip{flex:none;height:40px;padding:0 16px;font-size:15px;letter-spacing:-.005em}
.seg2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:0 2px}
.seg2>span{font-size:15px;letter-spacing:-.005em;color:var(--text2);white-space:nowrap;flex:none}
.tg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill2);border-radius:12px;padding:2px}
.tg button{height:34px;padding:0 10px;border-radius:10px;font-size:15px;letter-spacing:-.005em;font-weight:500;color:var(--text2);transition:background .2s,color .2s;white-space:nowrap}
.tg button.on{background:rgba(255,255,255,.16);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.cashrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.nb{height:50px;border-radius:14px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.nb b{font-size:15px;letter-spacing:-.005em;font-weight:500}
.nb i{font-style:normal;font-size:13px;letter-spacing:.005em;color:var(--text3)}
.nb.has{background:rgba(255,255,255,.15)}
.nb.has i{color:var(--text)}
.nb:active{transform:scale(.95)}
.cashsum{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.005em;color:var(--text2);margin:8px 4px 0}
.cashsum b{color:var(--text);margin-left:4px}
.cashsum .ok{color:var(--green)}
.cashsum button{font-size:13px;letter-spacing:.005em;color:var(--text2);padding:4px 0 4px 10px}
.morebtn{display:block;width:100%;text-align:center;margin:14px 0 0;font-size:13px;letter-spacing:.005em;color:var(--text2)}
[data-morebox]{margin-top:10px}
.sheet .amt{margin:4px 0 6px;font-size:54px;min-height:62px}
/* ===== floating card sheets: the + sheet, Settings and Statement. "Settle." and the gear stay visible above ===== */
.sheet.float{left:6px;right:6px;bottom:6px;top:calc(var(--sat) + 84px);height:auto;max-height:none;border-radius:40px;overflow:hidden}
.sheet.float .sbody{padding-bottom:max(16px, calc(var(--sab) - 10px))}
.sheet.add .sbody{padding-bottom:max(10px, calc(var(--sab) - 16px));display:flex;flex-direction:column}
.sheet.add .sbody>*{flex:none}
.sheet.add .amt{margin-top:16px}
.sheet.add .keys{flex:1 1 auto;min-height:192px;max-height:306px;grid-auto-rows:1fr;margin-top:auto;padding-top:16px}
.sheet.add .key{height:auto}
.sheet.add .next{margin-top:12px;opacity:1}
/* Came back and Pay Mom by: separate boxes in straight columns */
.sheet.add .seg2{display:grid;grid-template-columns:104px 1fr;gap:0}
.sheet.add .seg2 .tg{width:100%;grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr));background:none;box-shadow:none;padding:0;gap:6px}
.sheet.add .seg2 .tg button{height:36px;color:var(--text)}
.sheet.add .next.ready{color:#000;background:#f5f5f7;box-shadow:none}

/* ----- Card style: Glass ----- */
html:not([data-card="default"]) .sheet.float{
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),rgba(18,18,22,.52);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16),inset 0 1.5px 0 rgba(255,255,255,.32),inset 1px 0 0 rgba(255,255,255,.08),inset -1px 0 0 rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.55)}
html:not([data-card="default"]) .sheet.float :where(.key,.chip,.tg,.group,.pill.soft,.seg,.sheet.add .seg2 .tg button,.sheet.add .next:not(.ready)){
  background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04));
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.05),0 4px 14px rgba(0,0,0,.18)}
html:not([data-card="default"]) .sheet.float .seg2 .tg{background:none;box-shadow:none}
html:not([data-card="default"]) .sheet.float .key:active{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.1))}
html:not([data-card="default"]) .sheet.float :is(.chip.on,.tg button.on,.seg button.on){color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.16));
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.4),inset 0 1px 0 rgba(255,255,255,.55),0 4px 14px rgba(0,0,0,.22)}

/* ----- Card style: Default (solid, no glass, like Daily's Default) ----- */
html[data-card="default"] .sheet.float{background:#1c1c1f;-webkit-backdrop-filter:none;backdrop-filter:none;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.12),0 30px 80px rgba(0,0,0,.6)}
html[data-card="default"] .sheet.float :where(.key,.chip,.group,.pill.soft,.sheet.add .seg2 .tg button,.sheet.add .next:not(.ready)){background:#2c2c30;box-shadow:none}
html[data-card="default"] .sheet.float :where(.tg:not(.seg2 .tg),.seg){background:#2c2c30;box-shadow:none}
html[data-card="default"] .sheet.float .key:active{background:#3a3a3f}
html[data-card="default"] .sheet.float :is(.chip.on,.tg button.on,.seg button.on){color:#fff;background:#55555b;box-shadow:none}
/* Default: every label and option stays white, nothing goes dark */
html[data-card="default"] .sheet.float{--text2:#f5f5f7}
html[data-card="default"] .sheet.float :is(.tg button,.seg button,.chip,.seg2>span,.slbl,.hint){color:#f5f5f7}
html[data-card="default"] .sheet.float .key.clear{background:none}
.sheet.float .key.clear{background:none!important;box-shadow:none!important}
.sheet.float .chip.dashed{background:none!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)!important}
.sheet.add .next:not(.ready){color:rgba(255,255,255,.45)}
.how{font-size:13px;letter-spacing:.005em;color:var(--text2);margin-top:3px;line-height:1.35}
.sheet .keys{margin:14px 0 4px}
.sheet .key{height:52px}
.stmt{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:12px;padding:12px 2px 2px;border-top:.5px solid var(--sep);font-size:15px;letter-spacing:-.005em;font-weight:500;color:var(--text)}
.balr{display:block;font-size:13px;letter-spacing:.005em;color:var(--text2);margin-top:2px}
.row.ck .av svg{width:16px;height:16px;color:var(--green)}
.row.ck{cursor:pointer}
/* step slide */
.stage{animation:in .42s var(--ease) both}
.stage.back{animation-name:inBack}
@keyframes in{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}

/* toast */
.toast{position:fixed;left:50%;top:calc(var(--sat) + 10px);z-index:60;transform:translate(-50%,-140%);padding:12px 18px;border-radius:22px;font-size:15px;letter-spacing:-.005em;font-weight:500;
  white-space:nowrap;transition:transform .5s var(--ease)}
.toast.on{transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#stmt{display:none}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body>*:not(#stmt){display:none!important}
  #stmt{display:block!important}
}
.shead{position:relative}
.dirsw{display:grid;grid-template-columns:1fr 1fr;width:240px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.dirsw button{padding:0;width:100%}
.av.in{font:400 20px -apple-system,sans-serif;color:var(--green)}
.av.in svg{width:16px;height:16px;display:block}
.inamt{color:var(--green)}
.dates{margin-top:10px}
.dates .kv{padding:8px 4px;min-height:44px}
.dates input{color-scheme:dark}
@media (min-width:600px){ #main{padding-left:calc(50% - 280px);padding-right:calc(50% - 280px)} .sheet{left:calc(50% - 300px);right:calc(50% - 300px)} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div id="glow"></div>
<div class="bar" id="bar"><b>Settle.</b></div>
<main id="main"></main>
<button class="fab gbtn" id="fab" aria-label="New payment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="scrim" id="scrim"></div>
<section class="sheet panel" id="sheet" role="dialog" aria-modal="true">
  <div class="grab" id="grab"><i></i></div>
  <div class="shead" id="shead"></div>
  <div class="sbody" id="sbody"></div>
</section>
<div class="toast panel" id="toast"></div>
<div id="stmt"></div>
<script src="statement.js"></script>

<script>
/* ================= data =================
   Everything lives on this phone (localStorage), with a spare copy each day,
   and optionally a copy in your private GitHub repository (settle-data). */
const KEY = "settle.v1", SPARE = KEY + ".spare";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, "0");
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const toLocalInput = d => `${dayKey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const DEFAULT_PAYEES = ["Gym", "Shop", "Sabin", "Bigyan", "Asim", "Family"];
const NOTES = [1000, 500, 100, 50];

function fresh(){
  const now = Date.now();
  return { v: 1, entries: [], payees: DEFAULT_PAYEES.map((n, i) => ({ id: n.toLowerCase(), name: n, u: now + i })), balances: {}, gone: [], ui: { icon: "mono" } };
}
function load(){
  const read = k => { try { const s = localStorage.getItem(k); if (!s) return null; const d = JSON.parse(s); return d && Array.isArray(d.entries) ? d : null; } catch(e){ return null; } };
  let d = read(KEY);
  if (!d && localStorage.getItem(KEY)){                       // main copy is broken: keep it aside, use the spare
    try { localStorage.setItem(KEY + ".broken-" + Date.now(), localStorage.getItem(KEY)); } catch(e){}
    d = read(SPARE);
  }
  d = d || fresh();
  d.payees = d.payees || []; d.balances = d.balances || {}; d.gone = d.gone || []; d.ui = d.ui || {}; d.ui.icon = d.ui.icon || "mono";
  if (!d.payees.some(p => p.kind === "in")) ["Salary", "Rent", "Family"].forEach((n, i) => d.payees.push({ id: "in:" + n.toLowerCase(), name: n, kind: "in", u: 1 + i }));
  return d;
}
var db = load();
try { if (db.entries.length && localStorage.getItem(SPARE + "Day") !== dayKey(new Date())){ localStorage.setItem(SPARE, JSON.stringify(db)); localStorage.setItem(SPARE + "Day", dayKey(new Date())); } } catch(e){}
function save(){
  stamp();
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){ toast("Couldn't save. Storage is full or blocked."); }
  syncSoon();
}

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmt = n => Math.round(n || 0).toLocaleString("en-IN");
const rs = n => "Rs " + fmt(n);
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const SHORTM = MONTHS.map(m => m.slice(0, 3));
const monthName = mk => { const [y, m] = mk.split("-"); return MONTHS[+m - 1] + " " + y; };
const parseAt = s => new Date(s);
function dayLabel(dk){
  const t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
  if (dk === dayKey(t)) return "Today";
  if (dk === dayKey(y)) return "Yesterday";
  const d = new Date(dk + "T12:00");
  const s = d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  return d.getFullYear() === t.getFullYear() ? s : s + " " + d.getFullYear();
}
const timeLabel = at => parseAt(at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const hapticLabel = (() => { try { const l = document.createElement("label"); l.setAttribute("aria-hidden","true"); l.style.display = "none";
  const i = document.createElement("input"); i.type = "checkbox"; i.setAttribute("switch",""); l.appendChild(i); document.body.appendChild(l); return l; } catch(e){ return null; } })();
function haptic(){ try { if (navigator.vibrate) navigator.vibrate(8); else if (hapticLabel) hapticLabel.click(); } catch(e){} }
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2400); }

const I = {
  gear:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`,
  plus:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  del:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H8.5L3 12l5.5 7H21a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM12 9.5l5 5M17 9.5l-5 5"/></svg>`,
  out:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>`,
  cash:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></svg>`,
  phone:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>`,
  bank:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 4l9 5.5M5 10v7M9.5 10v7M14.5 10v7M19 10v7M3 20h18"/></svg>`,
  hand:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h3l4 2h4a1.5 1.5 0 0 0 0-3h-3M6 14v6M6 18l7 2 7.5-3.5a1.6 1.6 0 0 0-1.5-2.8L14.5 15.5"/><rect x="9" y="4" width="11" height="6" rx="1.2"/></svg>`,
  cloud:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-9 6 6 0 0 1 11.4 1.6A3.8 3.8 0 0 1 17.5 18z"/></svg>`,
  file:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8L12 3.5 16.5 8M5 12v6.5A2 2 0 0 0 7 20.5h10a2 2 0 0 0 2-2V12"/></svg>`,
  restore:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11.5M7.5 11L12 15.5 16.5 11M5 19.5h14"/></svg>`,
  cal:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>`,
  share:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8L12 3.5 16.5 8M5 12v6.5A2 2 0 0 0 7 20.5h10a2 2 0 0 0 2-2V12"/></svg>`,
  chev:`<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5L6.5 7l-5 5.5"/></svg>`,
};

/* ================= model ================= */
const live = () => db.entries.filter(e => !e.del);
const isIn = e => e.dir === "in";
const outs = () => live().filter(e => !isIn(e));                 // money out of Mom's account (what you owe her)
const owed = () => outs().filter(e => !e.paid).reduce((s, e) => s + e.amount, 0);
const paidTotal = () => outs().filter(e => e.paid).reduce((s, e) => s + e.amount, 0);
const paidBy = how => outs().filter(e => e.paid && (e.payback === "cash" ? "cash" : "transfer") === how).reduce((s, e) => s + e.amount, 0);
const inMonth = mk => outs().filter(e => e.at.slice(0, 7) === mk);
const insInMonth = mk => live().filter(e => isIn(e) && e.at.slice(0, 7) === mk);
const spentIn = mk => inMonth(mk).reduce((s, e) => s + e.amount, 0);
const payees = () => db.payees.filter(p => !p.del && p.kind !== "in");
const sources = () => db.payees.filter(p => !p.del && p.kind === "in");
function payeeOrder(){
  const n = {}; outs().forEach(e => n[e.payee] = (n[e.payee] || 0) + 1);
  return payees().slice().sort((a, b) => (n[b.name] || 0) - (n[a.name] || 0) || a.u - b.u);
}
function sourceOrder(){
  const n = {}; live().filter(isIn).forEach(e => n[e.payee] = (n[e.payee] || 0) + 1);
  return sources().slice().sort((a, b) => (n[b.name] || 0) - (n[a.name] || 0) || a.u - b.u);
}
const BACK = { none: "Nothing back", cash: "Cash back", online: "Online back" };
const PAYBACK = { transfer: "Nabil", cash: "Cash", later: "Not decided yet" };
const sortedEntries = () => live().sort((a, b) => b.at < a.at ? -1 : b.at > a.at ? 1 : b.c - a.c);
const ckAt = ([k, b]) => /^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(b.at || "") ? b.at : k + "-13T09:00";
const ckInMonth = mk => { const l = balanceList().filter(x => ckAt(x).slice(0, 7) === mk); return l.length ? l[l.length - 1][1] : null; };
function checkinDue(){
  const d = new Date(); if (d.getDate() < 13) return false;
  if (balanceList().some(x => ckAt(x) >= monthKey(d) + "-13")) return false;
  return !(db.ui.skip && db.ui.skip >= dayKey(d));
}
const balanceList = () => Object.entries(db.balances).filter(([, b]) => !b.del).sort(([a], [b]) => a < b ? -1 : 1);

/* ================= home ================= */
let range = "6M", showAll = false;
function render(){
  const ents = sortedEntries(), o = owed(), mk = monthKey(new Date());
  const groups = []; let cur = null;
  (showAll ? ents : ents.slice(0, 40)).forEach(e => { const dk = e.at.slice(0, 10); if (!cur || cur.dk !== dk){ cur = { dk, items: [] }; groups.push(cur); } cur.items.push(e); });
  const months = [...new Set(outs().map(e => e.at.slice(0, 7)))].sort().reverse();
  const bl = balanceList();
  $("#main").innerHTML = `
    <div class="top"><h1 class="title">Settle.</h1><button class="round gbtn" data-settings aria-label="Settings">${I.gear}</button></div>
    ${checkinDue() ? `<div class="due card"><div class="t"><b>Time to log Mom's balance</b><span>${MONTHS[new Date().getMonth()]} check-in</span></div>
      <button class="skip" data-skip>Skip</button><button class="pill white" data-checkin>Log</button></div>` : ""}
    <div class="hero card">
      <div class="lbl">You owe Mom</div>
      <div class="big num"><small>Rs</small>${fmt(o)}</div>
      <div class="hero-row">
        <div class="stat"><div class="lbl">Paid back</div><div class="v num">${rs(paidTotal())}</div>${paidTotal() ? `<div class="how num">Nabil ${rs(paidBy("transfer"))}<br>Cash ${rs(paidBy("cash"))}</div>` : ""}</div>
        <div class="stat"><div class="lbl">This month</div><div class="v num">${rs(spentIn(mk))}</div></div>
      </div>
      ${o > 0 ? `<button class="pill white settle-btn" data-settleall>Settle all</button>` : ""}
    </div>
    <div class="chart-card card">
      <div class="ch-head"><div><div class="lbl">Spending</div><div class="ch-val num" id="spV"></div><div class="ch-sub" id="spS"></div></div></div>
      <div class="chart" id="spC"></div>
      <div class="seg">${["1M","6M","1Y","All"].map(r => `<button data-range="${r}" class="${r === range ? "on" : ""}">${r}</button>`).join("")}</div>
    </div>
    <div class="chart-card card">
      <div class="ch-head"><div><div class="lbl">Mom's balance now</div><div class="ch-val num" id="blV"></div><div class="ch-sub" id="blS"></div></div></div>
      <div class="chart" id="blC"></div>
      <button class="stmt" data-statement>Statement, PDF and check-in ${I.chev}</button>
    </div>
    ${months.length ? `<div class="sec"><h2>Months</h2></div>
      <div class="card list">${months.slice(0, 12).map(m => `<button class="mrow" data-month="${m}"><div class="m"><b>${monthName(m)}</b><span class="num">${inMonth(m).length} payment${inMonth(m).length === 1 ? "" : "s"}</span></div><b class="num">${rs(spentIn(m))}</b>${I.chev}</button>`).join("")}</div>` : ""}
    <div class="sec"><h2>Journal</h2></div>
    ${groups.length ? groups.map(g => `<div class="day">${dayLabel(g.dk)}</div><div class="card list">${g.items.map(rowHTML).join("")}</div>`).join("")
      : `<div class="card empty"><b>Nothing yet</b>Tap + when you pay from Mom's account.</div>`}
    ${!showAll && ents.length > 40 ? `<button class="more" data-more>Show all ${ents.length}</button>` : ""}
  `;
  drawSpend(); drawBalance();
}
function rowHTML(e){
  if (isIn(e)) return `<button class="row" data-entry="${e.id}"><div class="av in">${I.plus}</div>
    <div class="m"><b>From ${esc(e.payee)}</b><span>${timeLabel(e.at)} · Money in${e.note ? " · " + esc(e.note) : ""}</span></div>
    <div class="r"><b class="num inamt">+${rs(e.amount)}</b><span class="tag">Into Mom's account</span></div></button>`;
  const meta = `${timeLabel(e.at)} · ${BACK[e.back]}`;
  return `<button class="row" data-entry="${e.id}"><div class="av">${esc(e.payee.slice(0, 1).toUpperCase())}</div>
    <div class="m"><b>${esc(e.payee)}</b><span>${meta}</span></div>
    <div class="r"><b class="num">${rs(e.amount)}</b>${e.paid ? `<span class="tag paid">${I.check}Paid</span>` : `<span class="tag"><i class="dot"></i>Owed</span>`}</div></button>`;
}

/* ================= charts ================= */
function smooth(p){
  const n = p.length; if (n < 2) return "";
  if (n === 2) return `M${p[0].x},${p[0].y}L${p[1].x},${p[1].y}`;
  const dx = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++){ dx[i] = p[i+1].x - p[i].x; m[i] = (p[i+1].y - p[i].y) / dx[i]; }
  t[0] = m[0]; t[n-1] = m[n-2];

  for (let i = 0; i < n - 1; i++){ const h = dx[i] / 3; d += `C${p[i].x+h},${p[i].y+t[i]*h} ${p[i+1].x-h},${p[i+1].y-t[i+1]*h} ${p[i+1].x},${p[i+1].y}`; }

    let i = 0, best = 1e9; xy.forEach((p, k) => { const d = Math.abs(p.x - x); if (d < best){ best = d; i = k; } });
    if (i !== lastI){ lastI = i; haptic(); }

function spendData(){

    const out = []; let sum = 0;

      sum += outs().filter(e => e.at.slice(0, 10) === dk).reduce((s, e) => s + e.amount, 0);
      out.push({ v: sum, label: d.getDate() + " " + SHORTM[d.getMonth()], sub: "By " + d.toLocaleDateString("en-GB", { day: "numeric", month: "long" }) }); }
    return { data: outs().length ? out : [], total: sum, what: "in the last 30 days" };
  }
  let n = range === "6M" ? 6 : 12;
  if (range === "All"){ const first = outs().map(e => e.at).sort()[0];
    if (first){ const f = new Date(first); n = Math.max(2, (now.getFullYear() - f.getFullYear()) * 12 + now.getMonth() - f.getMonth() + 1); } }
  const out = [];
  for (let k = n - 1; k >= 0; k--){ const d = new Date(now.getFullYear(), now.getMonth() - k, 1); const mk = monthKey(d);
    out.push({ v: spentIn(mk), label: SHORTM[d.getMonth()] + (n > 12 ? " " + String(d.getFullYear()).slice(2) : ""), sub: "In " + monthName(mk) }); }
  return { data: outs().length ? out : [], total: out.reduce((s, d) => s + d.v, 0), what: range === "All" ? "all time" : `in the last ${n} months` };
}

/* iPhone home-screen apps can't print, so the PDF is built right here: each A4 page is drawn
   to an image (html2canvas) and put into a PDF (jsPDF), then handed to the share sheet. */
const loadScript = src => new Promise((ok, bad) => { if (document.querySelector(`script[src="${src}"]`)) return ok();
  const t = document.createElement("script"); t.src = src; t.onload = ok; t.onerror = bad; document.head.appendChild(t); });
async function makePDF(start, end){
  if (typeof renderStatement !== "function") return toast("Statement isn't ready. Open Settle once with internet.");
  const btn = sbody.querySelector("[data-pdf]"); if (btn){ btn.disabled = true; btn.textContent = "Making your PDF…"; }
  const name = `Settle statement ${dayKey(start)} to ${dayKey(end)}.pdf`;
  const box = $("#stmt");
  try {
    await Promise.all([loadScript("vendor/html2canvas.min.js"), loadScript("vendor/jspdf.umd.min.js")]);
    box.innerHTML = renderStatement(db, start, end, { base: "" });
    box.style.cssText = "display:block;position:fixed;left:-10000px;top:0;width:210mm;background:#fff;z-index:-1";
    try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]); } catch(e){}
    const pages = [...box.querySelectorAll(".s-page")];
    const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4", compress: true });
    for (let i = 0; i < pages.length; i++){
      if (btn) btn.textContent = `Making your PDF… ${i + 1} of ${pages.length}`;
      const c = await html2canvas(pages[i], { scale: 2, backgroundColor: "#ffffff", logging: false, useCORS: true });
      if (i) pdf.addPage("a4", "portrait");
      pdf.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, 210, 297);
    }
    const file = new File([pdf.output("blob")], name, { type: "application/pdf" });
    box.innerHTML = ""; box.style.cssText = "";
    haptic(); pdfReady(file);
  } catch(e){
    box.innerHTML = ""; box.style.cssText = "";
    if (btn){ btn.disabled = false; btn.textContent = "Download statement"; }
    toast(navigator.onLine ? "Couldn't make the PDF. Try again." : "Connect to the internet once, then try again.");
  }
}
function pdfReady(file){
  const btn = sbody.querySelector("[data-pdf]"); if (!btn) return;
  btn.disabled = false; btn.textContent = "Save or share PDF";
  btn.onclick = async () => {   // a fresh tap, so the iPhone allows the share sheet
    try { if (navigator.canShare && navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], title: file.name }); return; } }
    catch(e){ if (e && e.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  };
}

function takeSnap(){ snap = new Map(); db.entries.forEach(e => snap.set("e:" + e.id, sig(e))); db.payees.forEach(p => snap.set("p:" + p.id, sig(p))); Object.entries(db.balances).forEach(([k, b]) => snap.set("b:" + k, sig(b))); }

function stamp(){
  const now = Date.now();
  const look = (k, x) => { const s = sig(x); if (snap.get(k) !== s){ x.u = now; snap.set(k, sig(x)); } };
  db.entries.forEach(e => look("e:" + e.id, e)); db.payees.forEach(p => look("p:" + p.id, p)); Object.entries(db.balances).forEach(([k, b]) => look("b:" + k, b));
}
const byId = (a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
const sortKeys = o => Object.fromEntries(Object.entries(o || {}).sort(([a], [b]) => a < b ? -1 : 1));
const shared = d => ({ v: 1, entries: (d.entries || []).map(sortKeys).sort(byId), payees: (d.payees || []).map(sortKeys).sort(byId),
  balances: sortKeys(Object.fromEntries(Object.entries(d.balances || {}).map(([k, b]) => [k, sortKeys(b)]))) });
const canon = d => JSON.stringify(shared(d));
function mergeDb(a, b){      // newest change wins for each payment, name and balance. Deletes are kept as hidden marks, so nothing comes back by mistake.
  const pick = (xs, ys) => { const m = new Map(); [...(xs || []), ...(ys || [])].forEach(x => { const c = m.get(x.id); if (!c || (x.u || 0) > (c.u || 0)) m.set(x.id, x); }); return [...m.values()]; };
  const bal = { ...(a.balances || {}) };
  Object.entries(b.balances || {}).forEach(([k, x]) => { if (!bal[k] || (x.u || 0) > (bal[k].u || 0)) bal[k] = x; });
  return { entries: pick(a.entries, b.entries), payees: pick(a.payees, b.payees), balances: bal };
}
function applyShared(m){
  db.entries = m.entries; db.payees = m.payees; db.balances = m.balances;
  takeSnap(); try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){}
  if (!sheet.classList.contains("on")) render();
}
const GH = "https://api.github.com/repos/";
const ghHeaders = () => ({ Authorization: "Bearer " + sync.token, Accept: "application/vnd.github+json" });
const toB64 = s => { const b = new TextEncoder().encode(s); let x = ""; for (let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(x); };
const fromB64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));
const ghError = r => Object.assign(new Error(r.status === 401 ? "The key isn't working anymore. Set up the backup again with a new key." : r.status === 403 ? "GitHub said no. Check the key can read and write settle-data." : r.status === 404 ? "Can't find the repository. Check its name and the key." : "GitHub said " + r.status), { status: r.status });
async function ghGet(){
  const h = ghHeaders(); if (sync.etag) h["If-None-Match"] = sync.etag;
  const r = await fetch(GH + sync.repo + "/contents/settle.json", { headers: h, cache: "no-store" });
  if (r.status === 304) return { same: true };
  if (r.status === 404){ const repo = await fetch(GH + sync.repo, { headers: ghHeaders(), cache: "no-store" }); if (!repo.ok) throw ghError(repo); return { data: null, sha: null }; }
  if (!r.ok) throw ghError(r);
  const j = await r.json(); sync.etag = r.headers.get("ETag") || null; sync.sha = j.sha;
  return { data: JSON.parse(fromB64(j.content)), sha: j.sha };
}
async function ghPut(obj, sha){
  const body = { message: "Settle backup", content: toB64(JSON.stringify(obj)) }; if (sha) body.sha = sha;
  const r = await fetch(GH + sync.repo + "/contents/settle.json", { method: "PUT", headers: { ...ghHeaders(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw ghError(r);
  const j = await r.json(); sync.sha = j.content.sha; sync.etag = null;
}
var syncing = false, syncAgain = false, lastCanon = null, syncTimer = null;
function syncSoon(){ if (!sync) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 1200); }
async function syncNow(){
  if (!sync || !sync.token) return;
  if (syncing){ syncAgain = true; return; }
  syncing = true; syncState("Backing up…");
  try {
    for (let i = 0; i < 4; i++){
      const g = await ghGet();
      if (g.same && lastCanon === null){ sync.etag = null; continue; }
      if (!g.same){ lastCanon = g.data ? canon(g.data) : ""; if (g.data){ const m = mergeDb(db, g.data); if (canon(m) !== canon(db)) applyShared(m); } }
      const mine = canon(db);
      if (mine === lastCanon) break;
      try { await ghPut(shared(db), sync.sha); lastCanon = mine; break; }
      catch(e){ if (e.status === 409 || e.status === 422){ sync.etag = null; continue; } throw e; }
    }
    sync.last = Date.now(); sync.err = "";
  } catch(e){ sync.err = navigator.onLine ? (e.message || "Couldn't back up") : "Offline. It backs up when you're online."; }
  saveSync(); syncing = false; syncState();
  if (syncAgain){ syncAgain = false; setTimeout(syncNow, 200); }
}
function syncText(){
  if (!sync) return "";
  if (sync.err) return sync.err;
  if (!sync.last) return "Not backed up yet";
  const s = Math.round((Date.now() - sync.last) / 1000);
  return "Backed up " + (s < 45 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : new Date(sync.last).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
}
function syncState(busy){ document.querySelectorAll("[data-syncstate]").forEach(el => { el.textContent = busy || syncText(); el.classList.toggle("err", !busy && !!(sync && sync.err)); }); }
let syncTimersOn = false;
function startSyncTimers(){ if (syncTimersOn) return; syncTimersOn = true;
  setInterval(() => { if (!document.hidden) syncNow(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) syncNow(); });
  addEventListener("online", () => syncNow()); }
if (sync){ setTimeout(syncNow, 400); startSyncTimers(); }
async function connectSync(repo, token){
  const s = { repo: repo.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\.git$|\/$/g, ""), token: token.trim(), etag: null };
  if (!/^[\w.-]+\/[\w.-]+$/.test(s.repo)) throw new Error("Write it like this: nitpaudel/settle-data");
  if (!s.token) throw new Error("Paste the key first.");
  const r = await fetch(GH + s.repo, { headers: { Authorization: "Bearer " + s.token, Accept: "application/vnd.github+json" }, cache: "no-store" });
  if (r.status === 401) throw new Error("That key didn't work. Copy it again from GitHub.");
  if (r.status === 404) throw new Error("Can't see that repository. Check the name, and that the key was given access to it.");
  if (!r.ok) throw new Error("GitHub said " + r.status);
  const info = await r.json(); if (!info.private) throw new Error("That repository is public. Make it private first, so only you can see Mom's money.");
  sync = s; lastCanon = null; saveSync();
  await syncNow();
  if (sync.err) throw new Error(sync.err);
  startSyncTimers();
}
function openSyncSetup(){
  setSheet(head(`<button class="txt-btn" data-back>Back</button>`, "GitHub backup"), `
    <p class="hint" style="font-size:15px;margin-top:4px">Your payments get copied to a private repository in your own GitHub. Only you can see it. Do this once.</p>
    <ol class="ol">
      <li><b>Make a private repository</b> called settle-data. Tick "Add a README". <a href="https://github.com/new?name=settle-data&visibility=private" target="_blank" rel="noopener">Open GitHub</a></li>
      <li><b>Make a key for Settle.</b> <a href="https://github.com/settings/personal-access-tokens/new?name=Settle%20backup&description=Lets%20Settle%20back%20up%20to%20settle-data&expires_in=none&contents=write" target="_blank" rel="noopener">Open the key page</a>. Under "Repository access" pick "Only select repositories" and choose settle-data. Then tap Generate and copy the key.</li>
      <li><b>Paste it below</b> and tap Connect.</li>
    </ol>
    <input class="field" data-syncrepo value="${esc((sync && sync.repo) || "nitpaudel/settle-data")}" autocomplete="off" autocapitalize="off" spellcheck="false" style="margin-top:8px">
    <input class="field" data-synctoken type="password" autocomplete="off" placeholder="Paste the key (starts with github_pat_)" style="margin-top:10px">
    <button class="pill white next" data-syncgo>Connect</button>
    <p class="hint" data-syncmsg></p>`);
  shead.querySelector("[data-back]").onclick = openSettings;
  const go = sbody.querySelector("[data-syncgo]"), msg = sbody.querySelector("[data-syncmsg]");
  go.onclick = async () => {
    go.disabled = true; go.textContent = "Connecting…"; msg.textContent = ""; msg.classList.remove("err");
    try { await connectSync(sbody.querySelector("[data-syncrepo]").value, sbody.querySelector("[data-synctoken]").value); haptic(); closeSheet(); render(); toast("GitHub backup is on"); }
    catch(e){ msg.textContent = e.message; msg.classList.add("err"); go.disabled = false; go.textContent = "Connect"; }
  };
}

/* ================= wiring ================= */
$("#main").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.entry) return openEntry(d.entry);
  if (d.month) return openMonth(d.month);
  if ("settings" in d) return openSettings();
  if ("settleall" in d) return openSettleAll();
  if ("checkin" in d) return openCheckin();
  if ("statement" in d) return openStatement();
  if ("skip" in d){ db.ui.skip = dayKey(new Date()); try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(_){} haptic(); render(); return toast("Okay, I'll ask again tomorrow"); }
  if ("more" in d){ showAll = true; return render(); }
  if (d.range){ range = d.range; haptic(); document.querySelectorAll("[data-range]").forEach(b => b.classList.toggle("on", b === t)); return drawSpend(); }
});
$("#fab").onclick = () => { haptic(); newFlow(); };
$("#main").addEventListener("scroll", () => $("#bar").classList.toggle("on", $("#main").scrollTop > 46), { passive: true });
let lastDay = dayKey(new Date());
document.addEventListener("visibilitychange", () => { if (!document.hidden && dayKey(new Date()) !== lastDay){ lastDay = dayKey(new Date()); if (!sheet.classList.contains("on")) render(); } });
let rw; addEventListener("resize", () => { clearTimeout(rw); rw = setTimeout(() => { drawSpend(); drawBalance(); }, 150); });
render();
if (document.fonts) document.fonts.ready.then(() => { drawSpend(); drawBalance(); });

if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.type === "settle-updated") toast("Settle was updated. Reopen to see it"); });
}
