<div id="app"></div>

<nav id="tabs"><div class="in">
<button data-a="tab" data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2.5L5.5 13.2h5.3L10 21.5l8.5-10.7h-5.6L13 2.5z"/></svg>Today</button>

<div id="rest"><div class="bar"><i></i></div><div class="in">
<div style="flex:1;min-width:0"><div class="lbl">Rest</div><div class="time num">0:00</div></div>
<button data-a="restAdd" data-v="-15">&#8722;15</button>
<button data-a="restAdd" data-v="15">+15</button>
<button data-a="restSkip">Skip</button>
</div></div>

<div id="sheet"><div class="bg" data-a="closeSheet"></div><div class="pn"><div class="grab"></div><div class="in"></div></div></div>

<div id="toast" class="toast"></div>
