<!DOCTYPE html>
<html lang="en" data-card="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>NitFit</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NitFit">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/nf3-180.png">
<link rel="icon" href="icons/nf3-192.png">
<script>try{var c=localStorage.getItem("nitfit:card");if(c)document.documentElement.dataset.card=c}catch(e){}</script>
<style>
/*CSS*/
</style>
</head>
<body>
<div id="main"></div>

<nav id="tabs">
<button data-a="tab" data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Today</button>
<button data-a="tab" data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg>Workout</button>
<button data-a="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V4.5M4 19.5h16M7.5 15.5l3.8-4.4 3.2 2.7L19.5 8"/></svg>Progress</button>
</nav>

<div id="rest"><div class="bar"><i></i></div><div class="in">
<div style="flex:1;min-width:0"><div class="lbl">Rest</div><div class="time">0:00</div></div>
<button data-a="restAdd" data-v="-15">&#8722;15</button>
<button data-a="restAdd" data-v="15">+15</button>
<button data-a="restSkip">Skip</button>
</div></div>

<div class="scrim" id="scrim" data-a="closeSheet"></div>
<div class="sheet" id="sheet"><div class="grab"><i></i></div><div class="shead"><h3></h3></div><div class="sbody"></div></div>

<div id="toast" class="toast"></div>
<input type="file" id="importIn" accept="application/json,.json" hidden>

<script>
/*JS*/
</script>
</body>
</html>
