<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="icons/launch-1170x2532.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" href="icons/launch-1170x2532-dark.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --base:#f2f2f7; --card:#ffffff; --solid:#ffffff;
  --card-shadow:0 1px 2px rgba(0,0,0,.04);
  --text:#16171a; --text2:#7d8089; --text3:#b2b5bc;
  --sep:rgba(60,60,67,.13); --fill:rgba(118,118,128,.12); --accent:#2a78f5;
  --inbox:#3d8bf7; --today:#f5bf1d; --tomorrow:#ff8a3d; --upcoming:#f2555a; --someday:#c3a26a; --logbook:#40b663;
  --morning:#f2a93b; --afternoon:#e9784a; --evening:#6c8fca;
  --danger:#ff3b30; --check:#c3c6cc; --scrim:rgba(0,0,0,.12);
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){
  :root{ --base:#000000; --card:#1c1c1e; --solid:#1c1c1e; --card-shadow:none;
    --text:#f3f4f7; --text2:#8e8e93; --text3:#4f5056;
    --sep:rgba(255,255,255,.1); --fill:rgba(118,118,128,.24); --check:#5a5c63; --scrim:rgba(0,0,0,.14); --danger:#ff453a; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--base);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg{display:block}

/* liquid glass, modelled on iOS Control Center / Notification Centre.
   Small buttons (like the torch and camera buttons): almost clear, with a thick lit rim.
   Panels (like notification cards): what's behind shows through blurred and dimmed. */
.gbtn{color:var(--text);background:rgba(255,255,255,.18);
  -webkit-backdrop-filter:blur(2px) saturate(170%) brightness(1.08);backdrop-filter:blur(2px) saturate(170%) brightness(1.08);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 2px 2.5px 1px -1px rgba(255,255,255,.95),inset -2px -2px 1px -1px rgba(255,255,255,.55),
    inset 0 0 8px rgba(0,0,0,.06),0 6px 16px rgba(0,0,0,.14)}
@media (prefers-color-scheme: dark){
  .gbtn{background:rgba(255,255,255,.035);
    -webkit-backdrop-filter:blur(2px) saturate(170%) brightness(1.18);backdrop-filter:blur(2px) saturate(170%) brightness(1.18);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 2px 2.5px 1px -1px rgba(255,255,255,.5),inset -2px -2px 1px -1px rgba(255,255,255,.22),
      inset 0 0 10px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.5)}
}
/* Card style "Glass" (new): like Notification Centre cards. Colours and text behind show through, very blurred. */
.gpanel{background:linear-gradient(180deg,rgba(255,255,255,.37),rgba(255,255,255,.27));
  -webkit-backdrop-filter:blur(22px) saturate(200%);backdrop-filter:blur(22px) saturate(200%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.75),inset 0 1.5px 0 rgba(255,255,255,1),inset 1px 0 0 rgba(255,255,255,.45),inset -1px 0 0 rgba(255,255,255,.45),0 24px 60px rgba(0,0,0,.16)}
@media (prefers-color-scheme: dark){
  .gpanel{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015)),rgba(20,20,24,.31);
    -webkit-backdrop-filter:blur(22px) saturate(200%) brightness(1.05);backdrop-filter:blur(22px) saturate(200%) brightness(1.05);
    box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14),inset 0 1.5px 0 rgba(255,255,255,.3),inset 1px 0 0 rgba(255,255,255,.08),inset -1px 0 0 rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.55)}
}
/* Card style "Default" (the one you liked on 7 Nov): mostly solid dark, only a soft glow comes through */
html[data-card="default"] .gpanel{background:rgba(246,246,248,.80);
  -webkit-backdrop-filter:blur(32px) saturate(170%);backdrop-filter:blur(32px) saturate(170%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.7),inset 0 1px 0 rgba(255,255,255,.95),0 24px 60px rgba(0,0,0,.16)}
@media (prefers-color-scheme: dark){
  html[data-card="default"] .gpanel{background:rgba(26,26,30,.78);
    -webkit-backdrop-filter:blur(32px) saturate(160%);backdrop-filter:blur(32px) saturate(160%);
    box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.16),0 30px 80px rgba(0,0,0,.6)}
}
/* cards */
.glass{background:var(--card);box-shadow:var(--card-shadow)}

/* screens */
.screen{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--base);
  padding:calc(var(--sat) + 6px) 0 calc(var(--sab) + 120px);will-change:transform}
#list{padding-top:0;transform:translateX(100%);box-shadow:-10px 0 30px rgba(0,0,0,.08)}
#list.hidden{visibility:hidden}

/* top row */
.top{display:flex;align-items:center;gap:10px;margin:6px 16px 14px}
.search{flex:1;display:flex;align-items:center;gap:8px;border-radius:12px;padding:0 12px;height:40px;color:var(--text2);background:var(--fill)}
.search input{flex:1;border:0;outline:0;background:none;font-size:17px;height:100%;min-width:0}
.search input::placeholder{color:var(--text2)}
.round{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;flex:none}
.round:active{transform:scale(.92)}

/* the Today widget */
.wcard{margin:0 16px 16px;border-radius:22px;overflow:hidden}
.wc-head{display:flex;align-items:center;gap:9px;padding:14px 16px 6px}
.wc-head .ico{width:22px;height:22px}
.wc-title{font-size:17px;font-weight:700;letter-spacing:-.01em;flex:1}
.wc-title small{display:block;font-weight:500;color:var(--text2);font-size:13px;margin-top:1px;letter-spacing:0}
.wl{max-height:176px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:6px;
  -webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.wl.short{-webkit-mask-image:none;mask-image:none}
.wcard .row-main{padding:8px 16px}
.wcard .row-title{font-size:16px}
.wcard{transition:box-shadow .2s}
.wcard.drop{box-shadow:var(--glass-shadow),inset 0 0 0 2px var(--accent)}
.done-line{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.done-line::after{content:"";flex:1;height:.5px;background:var(--sep)}
.miss-line{padding:8px 16px 2px;font-size:12px;font-weight:600;color:var(--danger);text-transform:uppercase;letter-spacing:.05em}
.wc-empty{padding:4px 16px 16px;color:var(--text2);font-size:15px}

/* list cards */
.group{margin:0 16px 14px;border-radius:20px;overflow:hidden}
.nav-row{display:flex;align-items:center;gap:13px;width:100%;min-height:50px;padding:0 16px;text-align:left;position:relative;transition:background .15s}
.nav-row:not(:last-child)::after{content:"";position:absolute;left:51px;right:0;bottom:0;height:.5px;background:var(--sep)}
.nav-row:active,.nav-row.drop{background:var(--fill)}
.nav-row.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.nav-row .label{flex:1;font-weight:500;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-row .count{color:var(--text2);font-size:15px;font-variant-numeric:tabular-nums}
.nav-row .count.hot{color:#fff;background:var(--upcoming);border-radius:10px;padding:0 7px;font-size:13px;font-weight:600;line-height:20px;margin-right:6px}
.ico{width:22px;height:22px;flex:none}
.emo{display:inline-grid;place-items:center;font-size:19px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.big-title .emo{font-size:26px}
.sec .emo{font-size:14px}
.parts .emo{width:auto;height:auto;font-size:14px}
.empty .emo{font-size:38px;width:auto;height:auto;margin-bottom:12px;opacity:.9}
.fold{display:flex;align-items:center;justify-content:space-between;width:calc(100% - 32px);margin:6px 16px 8px;padding:0 4px;font-size:20px;font-weight:700;letter-spacing:-.02em}
.fold svg{width:15px;height:15px;color:var(--text2);transition:transform .35s var(--ease)}
.fold.closed svg{transform:rotate(-90deg)}
.foldbox{overflow:hidden;transition:height .38s var(--ease),opacity .3s}
.new-proj{color:var(--accent)}

/* list screen */
.bar{position:sticky;top:0;z-index:3;height:calc(var(--sat) + 50px);padding:var(--sat) 8px 0;display:flex;align-items:center;justify-content:space-between;
  background:transparent;transition:background .2s}
.bar.scrolled{background:color-mix(in srgb,var(--base) 80%,transparent);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 .5px 0 var(--sep)}
.bar .mini{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;opacity:0;transition:opacity .2s;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar.scrolled .mini{opacity:1}
.back{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;margin-left:6px}
.back:active,.icon-btn:active{transform:scale(.92)}
.icon-btn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;margin-right:6px}
.big-title{display:flex;align-items:center;gap:10px;padding:6px 20px 4px;font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.big-title .ico{width:28px;height:28px}
.big-title > span{overflow:hidden;text-overflow:ellipsis}
.list-sub{margin:2px 20px 14px 58px;color:var(--text2);font-size:15px}
.list-sub .flame{display:inline-flex;align-items:center;gap:3px;color:#f08a24;font-weight:600}
.list-sub .flame svg{width:14px;height:14px}
.sec{padding:16px 22px 8px;display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--text2)}
.sec .ico{width:17px;height:17px}
.sec.dim{opacity:.7}
.grp{margin:0 16px;border-radius:18px;overflow:hidden;position:relative}
.grp + .grp{margin-top:12px}
.grp:empty{min-height:0;box-shadow:none;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.grp.droppable:empty{min-height:12px}

/* rows */
.row{position:relative;overflow:hidden}
.row:not(:last-child)::after{content:"";position:absolute;left:50px;right:0;bottom:0;height:.5px;background:var(--sep);z-index:2}
.row-main{position:relative;z-index:1;display:flex;align-items:flex-start;gap:12px;padding:12px 16px;touch-action:pan-y}
.row-main:active{background:var(--fill)}
.row.sw .row-main,.row.lift .row-main{background:var(--solid)}
.check{flex:none;width:22px;height:22px;border-radius:7px;border:1.6px solid var(--check);display:grid;place-items:center;transition:background .18s var(--ease),border-color .18s,transform .12s;position:relative}
.check::before{content:"";position:absolute;inset:-11px}
.check:active{transform:scale(.86)}
.check svg{opacity:0;transform:scale(.6);transition:opacity .18s,transform .25s var(--ease)}
.row.done .check{background:var(--accent);border-color:var(--accent)}
.row.done .check svg{opacity:1;transform:scale(1)}
.row-text{flex:1;min-width:0}
.row-title{word-wrap:break-word;transition:color .2s}
.row.done .row-title{color:var(--text2)}
.row-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:3px;font-size:13px;color:var(--text2)}
.row-meta:empty{display:none}
.row-meta .m{display:inline-flex;align-items:center;gap:4px}
.row-meta .due{color:var(--danger);font-weight:500}
.row-meta svg{width:13px;height:13px}
.acts{position:absolute;top:0;bottom:0;display:flex}
.row:not(.sw) .acts{visibility:hidden}
.acts.l{left:0}.acts.r{right:0}
.act{width:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;font-size:12px;font-weight:600}
.act svg{width:20px;height:20px}
.act.today{background:var(--today)}
.act.later{background:#8e8e93}
.act.del{background:var(--danger)}
.row.lift{z-index:10;overflow:visible}
.row.lift .row-main{border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.18);transform:scale(1.02)}
.row.shift{transition:transform .22s var(--ease)}
.row.pop .check{animation:pop .4s var(--ease)}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.16)}100%{transform:scale(1)}}
.empty{padding:50px 40px;text-align:center}
.empty .ico{width:40px;height:40px;margin:0 auto 12px;opacity:.55}
.empty p{font-size:15px;color:var(--text2)}

/* drop gap for the + button */
.gap{height:0;transition:height .2s var(--ease);background:color-mix(in srgb,var(--accent) 12%,transparent);position:relative}
.gap.open{height:46px}
.gap::after{content:"";position:absolute;left:16px;right:16px;top:50%;height:2px;margin-top:-1px;border-radius:1px;background:var(--accent);opacity:.5}

/* liquid glass: see-through, blurred, with light catching the edges */
.lg{background:linear-gradient(160deg,rgba(255,255,255,.88),rgba(255,255,255,.66) 45%,rgba(255,255,255,.78));
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:.5px solid rgba(255,255,255,.9);box-shadow:0 18px 50px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,1)}
@media (prefers-color-scheme: dark){
  .lg{background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.05) 45%,rgba(255,255,255,.09));
    border:.5px solid rgba(255,255,255,.16);box-shadow:0 22px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04)}
}
/* month grid shared by Upcoming and the date picker (Apple Calendar style) */
.cal{margin:0 16px 6px;border-radius:30px;padding:16px 10px 12px;overflow:hidden}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:0 10px 12px}
.cal-h b{font-size:20px;font-weight:700;letter-spacing:-.02em}
.cal-h div{display:flex;gap:6px}
.cal-h button{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--accent)}
.cal-h button svg{width:11px;height:18px}
.cal-h button:disabled{opacity:.25}
.cal-h button:active{background:var(--fill)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center}
.cal-g .dn{font-size:12px;font-weight:600;color:var(--text2);padding:0 0 8px;letter-spacing:.02em}
.cd{position:relative;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-variant-numeric:tabular-nums}
.cd span{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;transition:background .2s,color .2s,transform .25s var(--ease)}
.cd:active span{transform:scale(.86)}
.cd.past{color:var(--text3)}
.cd.today span{background:var(--danger);color:#fff;font-weight:600}
.cd.sel span{background:var(--text);color:var(--base);font-weight:600}
.cd.today.sel span{background:var(--danger);color:#fff}
.cd i{position:absolute;bottom:1px;width:5px;height:5px;border-radius:3px;background:var(--text3)}
.cal-g.slide-l{animation:slideL .32s var(--ease)}
.cal-g.slide-r{animation:slideR .32s var(--ease)}
@keyframes slideL{from{transform:translateX(40px);opacity:0}}
@keyframes slideR{from{transform:translateX(-40px);opacity:0}}
/* date picker popover */
#dpScrim{position:fixed;inset:0;z-index:24;display:none}
#dpScrim.on{display:block}
#dp{position:fixed;left:14px;right:14px;z-index:25;border-radius:38px;padding:20px 12px 16px;opacity:0;transform:scale(.88);pointer-events:none;
  transition:opacity .2s,transform .42s cubic-bezier(.34,1.25,.5,1)}
#dp.on{opacity:1;transform:scale(1);pointer-events:auto}
#dp .cal-h{padding:0 10px 14px}
#dp .cal-h b{font-size:21px}
#dp .cal-h b em{font-style:normal;color:var(--accent);margin-left:6px;font-weight:600}
#dp .cal-g .dn{font-size:13px;padding-bottom:10px}
#dp .cd{height:50px;font-size:22px}
#dp .cd span{width:46px;height:46px;border-radius:23px}
.dp-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 10px 0}
.dp-reset{height:38px;padding:0 18px;border-radius:19px;font-size:16px;font-weight:500}
.dp-ok{width:42px;height:42px;border-radius:21px;display:grid;place-items:center}
.dp-ok svg{width:22px;height:22px}
.dp-reset:active,.dp-ok:active{transform:scale(.93)}
/* Done list: 7 days / 30 days / all time */
.seg{display:flex;margin:0 16px 4px;padding:3px;border-radius:10px;background:var(--fill)}
.seg button{flex:1;height:32px;border-radius:8px;font-size:14px;font-weight:500;transition:background .2s,box-shadow .2s}
.seg button.on{background:var(--solid);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}
.done-sum{margin:12px 22px 0;font-size:15px;color:var(--text2)}
.done-sum b{color:var(--text);font-size:28px;font-weight:700;letter-spacing:-.02em;margin-right:6px}
/* simple add screen */
.quick{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 6px;border-top:.5px solid var(--sep)}
.more-btn{display:flex;align-items:center;gap:6px;margin-top:14px;color:var(--accent);font-size:15px;font-weight:500;height:34px}
.more-btn svg{width:14px;height:14px;transition:transform .3s var(--ease)}
.more-btn.open svg{transform:rotate(180deg)}

/* + button */
#fab{position:fixed;z-index:15;width:58px;height:58px;border-radius:29px;display:grid;place-items:center;touch-action:none;
  transition:opacity .2s,scale .25s var(--ease),box-shadow .25s;will-change:transform}
#fab svg{width:24px;height:24px}
#fab.c-br{right:20px;bottom:calc(var(--sab) + 20px)}
#fab.c-bl{left:20px;bottom:calc(var(--sab) + 20px)}
#fab.c-tr{right:20px;top:calc(var(--sat) + 64px)}
#fab.c-tl{left:20px;top:calc(var(--sat) + 64px)}
#fab:active{scale:.93}
#fab.drag{scale:1.1}
#fab.gone{scale:.4;opacity:0;pointer-events:none}
.zone{position:fixed;z-index:14;width:210px;height:210px;margin:-105px 0 0 -105px;border-radius:50%;pointer-events:none;
  background:rgba(255,255,255,.04);-webkit-backdrop-filter:blur(3px) saturate(170%) brightness(1.12);backdrop-filter:blur(3px) saturate(170%) brightness(1.12);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 3px 3px 2px -2px rgba(255,255,255,.45),inset 0 0 30px rgba(255,255,255,.05);
  transform:scale(0);transition:transform .45s cubic-bezier(.34,1.35,.5,1),background .25s}
.zone.near{transform:scale(.55)}
.zone.hot{transform:scale(1);background:rgba(255,255,255,.08)}
.ripple{position:fixed;z-index:14;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:2px solid var(--accent);pointer-events:none;animation:ripple .5s var(--ease) forwards}
@keyframes ripple{from{transform:scale(.6);opacity:.5}to{transform:scale(2);opacity:0}}

/* sheet */
#scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;z-index:20}
#sheet{position:fixed;left:6px;right:6px;top:calc(var(--sat) + 12px);bottom:6px;z-index:21;border-radius:40px;overflow:hidden;
  transform:translateY(110%);display:flex;flex-direction:column;visibility:hidden;
  }
.grab{flex:none;padding:8px 0 2px;touch-action:none}
.grab i{display:block;width:36px;height:5px;border-radius:3px;background:var(--text3);margin:0 auto}
.sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 12px;height:46px;touch-action:none}
.sheet-head h3{font-size:17px;font-weight:600}
.sheet-body{flex:1;overflow-y:auto;padding:4px 20px calc(var(--sab) + var(--kb,0px) + 40px);overscroll-behavior:contain}
.txt-btn{color:var(--accent);font-size:17px;padding:0 10px;height:44px}
.txt-btn.strong{font-weight:600}
.txt-btn:active{opacity:.4}
.t-title{width:100%;border:0;outline:0;background:none;font-size:22px;font-weight:600;letter-spacing:-.015em;padding:8px 0 4px}
.t-title::placeholder,.t-notes::placeholder{color:var(--text3)}
.t-notes{width:100%;border:0;outline:0;background:none;resize:none;font-size:16px;color:var(--text);min-height:56px;padding:6px 0 10px;line-height:1.4}
.parsed{display:none;margin:2px 0 8px;font-size:13px;color:var(--accent);align-items:center;gap:6px}
.parsed.on{display:flex}
.parsed button{color:var(--text2);font-size:13px;text-decoration:underline}
.field{border-top:.5px solid var(--sep);padding:14px 0 12px}
.field-label{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:17px;background:var(--fill);box-shadow:inset 0 .5px 0 rgba(255,255,255,.18);font-size:15px;font-weight:500;overflow:hidden;transition:background .18s,color .18s}
.chip svg{width:16px;height:16px}
.chip.on{background:var(--accent);color:#fff}
.chip.on.c-today{background:var(--today);color:#1c1c1e}
.chip.on.c-tmrw{background:var(--tomorrow)}
.chip.on.c-some{background:var(--someday)}
.chip.on.c-due{background:var(--danger)}
.chip:active{transform:scale(.95)}
.chip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.parts{display:flex;gap:6px;margin-top:10px;padding:3px;border-radius:12px;background:var(--fill)}
.parts button{flex:1;height:32px;border-radius:9px;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:5px;transition:background .2s,box-shadow .2s}
.parts button svg{width:14px;height:14px}
.parts button.on{background:var(--solid);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}
.days{display:flex;gap:7px;margin-top:12px}
.dayb{width:38px;height:38px;border-radius:19px;background:var(--fill);font-size:14px;font-weight:600}
.dayb.on{background:var(--accent);color:#fff}
.select{width:100%;height:42px;border-radius:12px;background:var(--fill);border:0;padding:0 12px;font-size:16px;-webkit-appearance:none;appearance:none}
.danger-btn{width:100%;height:46px;border-radius:14px;background:var(--fill);color:var(--danger);font-weight:600;margin-top:18px}
.danger-btn:active{opacity:.7}
.plain-input{width:100%;height:46px;border-radius:14px;background:var(--fill);border:0;outline:0;padding:0 14px;font-size:17px}
.note{font-size:14px;color:var(--text2);line-height:1.45;margin-top:10px}
.set-row{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;text-align:left;border-bottom:.5px solid var(--sep)}
.set-row .ico{color:var(--accent)}
.set-row:active{opacity:.5}

/* ring */
.tring{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--text2);letter-spacing:0;margin-left:auto}
.tring svg{width:26px;height:26px;transform:rotate(-90deg)}
.big-title .tring svg{width:30px;height:30px}
.tring .bar{transition:stroke-dashoffset .6s var(--ease),stroke .3s}
.tring.full{color:var(--logbook)}
.tring.full .bar{stroke:var(--logbook)}
.tring.cele{animation:pop .5s var(--ease)}

/* morning plan */
.greet{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px}
.plan-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:.5px solid var(--sep);transition:opacity .22s,transform .22s}
.plan-item.gone{opacity:0;transform:translateX(40px)}
.pt{flex:1;min-width:0;word-wrap:break-word}
.pt small{display:block;color:var(--text2);font-size:13px;margin-top:2px}
.pb{display:flex;gap:6px;flex:none}
.pb button{height:32px;padding:0 12px;border-radius:16px;background:var(--fill);font-size:14px;font-weight:600}
.pb .ptoday{background:var(--today);color:#1c1c1e}
.pb button:active{transform:scale(.94)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translate(-50%,20px);opacity:0;z-index:30;color:#fff;background:rgba(40,40,44,.94);
  padding:10px 16px;border-radius:20px;font-size:15px;font-weight:500;pointer-events:none;transition:opacity .2s,transform .3s var(--ease);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){ .check svg,.chip,#fab,.foldbox,.gap{transition:none} }

/* ===== Done: days as glass notifications, older months stack like the Lock Screen ===== */
.hcal svg{width:21px;height:21px}
.dz{padding:2px 12px 140px}
.dcard{--g:#141417;border-radius:24px;margin-bottom:9px;position:relative;transform-origin:50% 100%;
  background:var(--g);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.13),inset 0 1px 0 rgba(255,255,255,.16),0 10px 30px rgba(0,0,0,.22)}
@media (prefers-color-scheme: light){
  .dcard{--g:#f8f8fb;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.75),inset 0 1px 0 rgba(255,255,255,.95),0 10px 30px rgba(40,40,80,.10)}
}
.dc-head{display:flex;align-items:flex-start;gap:12px;padding:13px 15px 13px 13px;cursor:pointer}
.dc-tile{position:relative;flex:none;width:40px;height:40px;border-radius:10px;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.dc-tile em{font-style:normal;font-size:8.5px;font-weight:700;letter-spacing:.06em;color:#ff3b30;margin-bottom:2px}
.dc-tile b{font-size:19px;font-weight:600;letter-spacing:-.02em}
.dc-tile .ok{position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:9px;background:var(--logbook);display:grid;place-items:center;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.dc-tile .ok svg{width:11px;height:11px}
.dc-main{flex:1;min-width:0}
.dc-top{display:flex;align-items:baseline;gap:8px}
.dc-top b{flex:1;min-width:0;font-size:15.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-when{font-size:13px;color:var(--text2);flex:none}
.dc-line{font-size:15px;margin-top:2px;letter-spacing:-.01em}
.dc-line .nf{color:var(--text2)}
.dc-prev{font-size:14px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s}
.dc-more{font-size:13px;color:var(--text2);margin-top:3px}
.dcard.open .dc-prev{opacity:0;height:0;margin:0}
.dc-mini{display:none}
.dc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.9,.25,1)}
.dcard.open .dc-body{grid-template-rows:1fr}
.dc-body > div{overflow:hidden;min-height:0}
.dc-sec{padding:11px 16px 3px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);border-top:.5px solid var(--sep)}
.dcard .grp{margin:0;border-radius:0;box-shadow:none;background:none}
.dcard .grp + .grp{margin-top:0}
.dcard .row-main:active{background:rgba(127,127,127,.12)}
.dcard.flash{animation:dflash 1.2s ease}
@keyframes dflash{0%,100%{box-shadow:inset 0 0 0 .5px rgba(255,255,255,.13),0 10px 30px rgba(0,0,0,.22)}25%{box-shadow:inset 0 0 0 2px var(--accent),0 10px 30px rgba(0,0,0,.22)}}
.dstack,.ds-cards{transform-origin:50% 100%}
.ds-h{display:flex;align-items:center;justify-content:space-between;padding:20px 6px 10px;min-height:32px}
.ds-h span{font-size:20px;font-weight:700;letter-spacing:-.02em}
.ds-h small{font-size:14px;font-weight:500;color:var(--text2);letter-spacing:0;margin-left:7px}
.ds-less{font-size:14px;font-weight:600;color:var(--text);border-radius:16px;padding:6px 13px;background:rgba(127,127,127,.22)}
.dstack:not(.open) .ds-less,.dstack.open .dc-more{display:none}
.ds-cards{position:relative;z-index:0}
/* the stack: top day in full, the next two tucked under it as slim cards */
.dstack:not(.open) .ds-cards{cursor:pointer}
.dstack:not(.open) .dcard{margin-bottom:0}
.dstack:not(.open) .dc-body{grid-template-rows:0fr}
.dstack:not(.open) .dcard:nth-child(n+2){transform-origin:50% 0;pointer-events:none}
.dstack:not(.open) .dcard:nth-child(n+2) .dc-head{display:none}
.dstack:not(.open) .dcard:nth-child(n+2) .dc-mini{display:flex;align-items:center;gap:8px;padding:14px 16px 7px;font-size:13.5px;color:var(--text2);white-space:nowrap;overflow:hidden}
.dc-mini .t{width:18px;height:18px;border-radius:5px;background:#fff;color:#111;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
.dc-mini b{color:var(--text);font-weight:600;opacity:.85}
.dc-mini span{overflow:hidden;text-overflow:ellipsis}
.dstack:not(.open) .dcard:nth-child(2){margin-top:-10px;transform:scale(.95);z-index:-1;opacity:.92}
.dstack:not(.open) .dcard:nth-child(3){margin-top:-24px;transform:scale(.9);z-index:-2;opacity:.7}
.dstack:not(.open) .dcard:nth-child(3) > *{opacity:0}
.dstack:not(.open) .dcard:nth-child(n+4){display:none}

</style>
</head>
<body>
<section class="screen" id="home"></section>
<section class="screen hidden" id="list"></section>
<button id="fab" class="c-br gbtn" aria-label="New to-do"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="zone" data-z="tl" style="left:0;top:0"></div><div class="zone" data-z="tr" style="left:100%;top:0"></div>
<div class="zone" data-z="bl" style="left:0;top:100%"></div><div class="zone" data-z="br" style="left:100%;top:100%"></div>
<div id="scrim"></div>
<div id="sheet" class="gpanel" role="dialog"><div class="grab"><i></i></div><div class="sheet-head"></div><div class="sheet-body"></div></div>
<div id="toast"></div>

<script>
(() => {
"use strict";
/* ================= storage ================= */
const KEY = "nit.daily.v1";
let db;
const SPARE = KEY + ".spare";   // a second copy of your to-dos, refreshed once a day
function load(){
  const read = k => { try { const s = localStorage.getItem(k); if (!s) return null; const d = JSON.parse(s); return d && Array.isArray(d.tasks) ? d : null; } catch(e){ return null; } };
  const main = read(KEY); if (main) return main;
  // the main copy is missing or can't be read: keep whatever is there safe, then use the spare
  try { const raw = localStorage.getItem(KEY); if (raw) localStorage.setItem(KEY + ".broken-" + Date.now(), raw); } catch(e){}
  return read(SPARE) || { v:2, tasks:[], projects:[], seeded:false };
}
db = load();
try { if (db.tasks.length && localStorage.getItem(SPARE + "Day") !== new Date().toDateString()){ localStorage.setItem(SPARE, JSON.stringify(db)); localStorage.setItem(SPARE + "Day", new Date().toDateString()); } } catch(e){}
// older versions used "evening: true"; now every task can be morning, afternoon or evening
db.tasks.forEach(t => { if (t.part === undefined){ t.part = t.evening ? "evening" : null; } delete t.evening; });
db.ui = db.ui || { projOpen: true }; db.ui.fabCorner = db.ui.fabCorner || "br"; db.ui.doneRange = db.ui.doneRange || "7"; db.ui.card = db.ui.card || "glass";
document.documentElement.dataset.card = db.ui.card;
function save(){
  try { logDay(); } catch(e){}
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){ toast("Couldn't save. Storage is full or blocked."); }
}
if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch(e){} }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ================= dates ================= */
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const T = () => ymd(new Date());
const TM = () => addDays(T(), 1);
const addDays = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const dayDiff = (a,b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DOWS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function shortDay(s){
  const diff = dayDiff(T(), s), d = parseYmd(s);
  if (diff === 0) return "Today"; if (diff === 1) return "Tomorrow"; if (diff === -1) return "Yesterday";
  if (diff > 1 && diff < 7) return DOWS[d.getDay()];
  return `${d.getDate()} ${MON[d.getMonth()]}`;
}
function longDay(s){
  const diff = dayDiff(T(), s), d = parseYmd(s);
  if (diff === 0) return "Today"; if (diff === 1) return "Tomorrow"; if (diff === -1) return "Yesterday";
  if (diff > 1 && diff < 7) return DOW[d.getDay()];
  return `${DOWS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
}

/* ================= icons ================= */
const I = {
  inbox:`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="var(--inbox)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 13l2.6-7.2A2 2 0 0 1 7.5 4.5h9a2 2 0 0 1 1.9 1.3L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></svg>`,
  today:`<svg class="ico" viewBox="0 0 24 24"><path fill="var(--today)" d="M12 2.8l2.75 5.6 6.15.9-4.45 4.33 1.05 6.12L12 16.86 6.5 19.75l1.05-6.12L3.1 9.3l6.15-.9z"/></svg>`,
  tomorrow:`<svg class="ico" viewBox="0 0 24 24"><path fill="var(--tomorrow)" d="M12 8.5a6.5 6.5 0 0 1 6.5 6.5h-13A6.5 6.5 0 0 1 12 8.5z"/><path d="M3 18.5h18M12 3.5v2M5.2 6.2l1.4 1.4M18.8 6.2l-1.4 1.4" stroke="var(--tomorrow)" stroke-width="2" stroke-linecap="round"/></svg>`,
  upcoming:`<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3.2" fill="var(--upcoming)"/><rect x="3" y="4.5" width="18" height="5" rx="2" fill="#000" opacity=".13"/><path d="M7.5 13h2M11 13h2M14.5 13h2M7.5 16.5h2M11 16.5h2" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  someday:`<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1.6" fill="var(--someday)"/><path d="M4.5 10h15v8a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2z" fill="var(--someday)" opacity=".7"/><path d="M10 13.5h4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  logbook:`<svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5" fill="var(--logbook)"/><path d="M8 12.3l2.7 2.7L16.2 9.4" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  morning:`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="var(--morning)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="var(--morning)"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>`,
  afternoon:`<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" fill="var(--afternoon)"/></svg>`,
  evening:`<svg class="ico" viewBox="0 0 24 24"><path fill="var(--evening)" d="M20.3 14.6A8.5 8.5 0 0 1 9.4 3.7a8.5 8.5 0 1 0 10.9 10.9z"/></svg>`,
  check:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  back:`<svg width="12" height="20" viewBox="0 0 13 21" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 2L2.5 10.5l8 8.5"/></svg>`,
  search:`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.6-4.6"/></svg>`,
  gear:`<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>`,
  more:`<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg>`,
  chev:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`,
  flag:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 21V4.5h10.2l.6 2H20v9h-6.6l-.6-2H7V21z"/></svg>`,
  notes:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>`,
  cal:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>`,
  star:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.75 5.6 6.15.9-4.45 4.33 1.05 6.12L12 16.86 6.5 19.75l1.05-6.12L3.1 9.3l6.15-.9z"/></svg>`,
  sunrise:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8.5a6.5 6.5 0 0 1 6.5 6.5h-13A6.5 6.5 0 0 1 12 8.5z"/><path d="M3 18.5h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
  box:`<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="18" height="5" rx="1.6"/><path d="M4.5 10h15v8a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2z" opacity=".75"/></svg>`,
  clock:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`,
  trash:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>`,
  repeat:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l3 3-3 3M20 6H8a4 4 0 0 0-4 4v1M7 21l-3-3 3-3M4 18h12a4 4 0 0 0 4-4v-1"/></svg>`,
  flame:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c-4.2 0-7-2.9-7-6.8 0-3.1 1.9-5.3 3.6-7.2.3 1.6 1.1 2.8 2.4 3.4-.3-3.6 1.3-6.7 4-8.4-.3 2.6.7 4.4 2.3 6.2 1.4 1.6 2.7 3.4 2.7 6 0 4-2.8 6.8-8 6.8z"/></svg>`,
  plusSmall:`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>`,
  export:`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8L12 3.5 16.5 8M5 12v6.5A2 2 0 0 0 7 20.5h10a2 2 0 0 0 2-2V12"/></svg>`,
  import:`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5V15M7.5 10.5L12 15l4.5-4.5M5 15v3.5A2 2 0 0 0 7 20.5h10a2 2 0 0 0 2-2V15"/></svg>`,
};
// list icons are real emoji, so on an iPhone they are Apple's own emoji
const emo = (e) => `<span class="ico emo">${e}</span>`;
Object.assign(I, { today: emo("⭐️"), tomorrow: emo("🌅"), upcoming: emo("📅"), someday: emo("🗃️"), logbook: emo("✅"), inbox: emo("📥"),
  morning: emo("☀️"), afternoon: emo("🌤️"), evening: emo("🌙") });
const small = (svg, color) => svg.replace("<svg", `<svg style="color:${color}"`);
function pie(frac, color="var(--accent)"){

/* ================= quick dates (only at the END of a title) ================= */
const DAYMAP = {sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,weds:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
function parseWhen(title){
  const m = title.match(/\s+(today|tonight|this morning|this afternoon|this evening|tmrw|tmr|tomorrow|next week|someday|(?:on\s+)?(?:sun|sunday|mon|monday|tue|tues|tuesday|wed|weds|wednesday|thu|thur|thurs|thursday|fri|friday|sat|saturday))\s*$/i);
  if (!m) return null;
  const word = m[1].toLowerCase().replace(/^on\s+/,""), t = T();
  let when, part = null, label;
  if (word === "today"){ when = t; label = "Today"; }
  else if (word === "tonight" || word === "this evening"){ when = t; part = "evening"; label = "This Evening"; }
  else if (word === "this morning"){ when = t; part = "morning"; label = "This Morning"; }
  else if (word === "this afternoon"){ when = t; part = "afternoon"; label = "This Afternoon"; }
  else if (["tmrw","tmr","tomorrow"].includes(word)){ when = TM(); label = "Tomorrow"; }
  else if (word === "next week"){ const d = parseYmd(t).getDay(); when = addDays(t, 7 - d); label = "Next week (" + shortDay(when) + ")"; }
  else if (word === "someday"){ when = "someday"; label = "Someday"; }
  else { const n = (DAYMAP[word] - parseYmd(t).getDay() + 7) % 7; when = addDays(t, n); label = longDay(when); }
  return { when, part, label, clean: title.slice(0, m.index).trim() };
}

/* ================= motion helpers ================= */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function spring({from, to, velocity=0, response=.38, damping=1, onUpdate, onDone}){
  if (reduceMotion){ onUpdate(to); onDone && onDone(); return { stop(){} }; }
  const k = Math.pow(2*Math.PI/response, 2), c = 4*Math.PI*damping/response;
  let x = from, v = velocity, last = performance.now(), id, stopped = false;
  const step = now => {
    if (stopped) return;
    const dt = Math.min(.064, (now - last)/1000); last = now;
    const n = Math.max(1, Math.ceil(dt/.004)), h = dt/n;
    for (let i=0;i<n;i++){ const a = -k*(x-to) - c*v; v += a*h; x += v*h; }
    if (Math.abs(x-to) < .4 && Math.abs(v) < 12){ x = to; onUpdate(to); onDone && onDone(); return; }
    onUpdate(x); id = requestAnimationFrame(step);
  };
  id = requestAnimationFrame(step);
  return { stop(){ stopped = true; cancelAnimationFrame(id); } };
}
const project = (v, d=.998) => (v/1000) * d / (1-d);
const rubber = (over, dim, c=.55) => (over*dim*c) / (dim + c*Math.abs(over));
function tracker(){ const pts = []; return { add(x,y){ const t = performance.now(); pts.push({x,y,t}); while (pts.length && t - pts[0].t > 90) pts.shift(); },
  vel(){ if (pts.length < 2) return {x:0,y:0}; const a = pts[0], b = pts[pts.length-1], dt = (b.t-a.t)/1000 || .016; return { x:(b.x-a.x)/dt, y:(b.y-a.y)/dt }; } }; }
const hapticLabel = (() => { try { const l = document.createElement("label"); l.setAttribute("aria-hidden","true"); l.style.display = "none";
  const i = document.createElement("input"); i.type = "checkbox"; i.setAttribute("switch",""); l.appendChild(i); document.body.appendChild(l); return l; } catch(e){ return null; } })();
function haptic(){ try { if (navigator.vibrate) navigator.vibrate(8); else if (hapticLabel) hapticLabel.click(); } catch(e){} }

/* ================= repeat ================= */
function nextRepeat(r, from){
  if (r.freq === "days"){ for (let i=1;i<=7;i++){ const d = addDays(from,i); if (r.days.includes(parseYmd(d).getDay())) return d; } return addDays(from,1); }
  if (r.freq === "week") return addDays(from,7);
  const d = parseYmd(from), day = d.getDate(), n = new Date(d.getFullYear(), d.getMonth()+1, 1);
  n.setDate(Math.min(day, new Date(n.getFullYear(), n.getMonth()+1, 0).getDate())); return ymd(n);
}
function firstRepeat(r){ const t = T(); return (r.freq === "days" && !r.days.includes(parseYmd(t).getDay())) ? nextRepeat(r, t) : t; }
function repeatLabel(r){
  if (!r) return "";
  if (r.freq === "days"){ const d = r.days.slice().sort((a,b)=>a-b); if (d.length === 7) return "Every day";
    if (d.join() === "1,2,3,4,5") return "Weekdays";
    if (d.length === 6) return "Every day but " + DOWS[[0,1,2,3,4,5,6].find(i => !d.includes(i))];
    return d.map(i => DOWS[i]).join(" "); }
  return r.freq === "week" ? "Every week" : "Every month";
}
function spawnNext(t){
  const base = isDate(t.when) ? t.when : T();
  let next = nextRepeat(t.repeat, t.repeat.freq === "days" && T() > base ? T() : base);
  while (next <= T()) next = nextRepeat(t.repeat, next);
  const n = { ...t, id: uid(), when: next, done:false, doneAt:null, createdAt: Date.now(), spawnedId:null, deadline:null };
  db.tasks.push(n); t.spawnedId = n.id; return n;
}

/* ================= today progress + streak ================= */
function todayStats(){
  const t = T();
  const open = db.tasks.filter(x => !x.done && inToday(x)).length;
  const done = doneToday().length;
  return { open, done, total: open + done };
}
function doneToday(){ const t = T(); return db.tasks.filter(x => x.done && x.doneAt && ymd(new Date(x.doneAt)) === t).sort((a,b) => (a.doneAt||0) - (b.doneAt||0)); }
const missed = t => !t.done && t.deadline && t.deadline < T();
// deadlines in plain words
function finishText(t){
  if (!t.deadline) return null;
  const d = dayDiff(T(), t.deadline);
  if (d < 0) return { txt: (-d === 1 ? "1 day late" : -d + " days late"), cls:"due" };
  if (d === 0) return { txt: "Finish today", cls:"due" };
  if (d === 1) return { txt: "Finish by tomorrow", cls:"" };
  if (d < 7) return { txt: "Finish by " + DOW[parseYmd(t.deadline).getDay()], cls:"" };
  return { txt: "Finish by " + parseYmd(t.deadline).getDate() + " " + MON[parseYmd(t.deadline).getMonth()], cls:"" };
}
function logDay(){ const s = todayStats(); db.dayLog = db.dayLog || {}; db.dayLog[T()] = { t: s.total, d: s.done };
  // remember what was planned for today, so the Done page still knows if it gets moved later
  const ids = db.tasks.filter(t => !t.done && t.when === T()).map(t => t.id);
  if (ids.length){ db.planLog = db.planLog || {}; const set = new Set(db.planLog[T()] || []); ids.forEach(i => set.add(i)); db.planLog[T()] = [...set]; }
}
function streak(){
  const log = db.dayLog || {}; let n = 0, gap = 0;
  const today = log[T()]; if (today && today.t > 0 && today.d >= today.t) n++;
  for (let i = 1; i < 500; i++){
    const e = log[addDays(T(), -i)];
    if (!e || e.t === 0){ if (++gap >= 2) break; continue; }
    gap = 0; if (e.d >= e.t) n++; else break;
  }
  return n;
}
function ringHTML(){
  const s = todayStats(); if (!s.total) return "";
  const C = 2 * Math.PI * 12, frac = s.done / s.total, full = s.open === 0;
  return `<span class="tring${full?" full":""}"><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="none" stroke="var(--fill)" stroke-width="3.4"/><circle class="bar" cx="15" cy="15" r="12" fill="none" stroke="var(--accent)" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-frac)).toFixed(2)}"/></svg>${s.done}/${s.total}</span>`;
}
function updateRing(celebrate, root){
  const r = root.querySelector(".tring"); if (!r) return;
  const tmp = document.createElement("div"); tmp.innerHTML = ringHTML(); const nr = tmp.firstElementChild; if (!nr){ r.remove(); return; }

/* ================= rows ================= */
function rowHTML(t, o={}){
  const meta = [];
  if (o.note) meta.push(`<span class="m">${o.note}</span>`);
  if (o.showWhen){
    if (t.when === "someday") meta.push(`<span class="m">${I.box}Someday</span>`);
    else if (isDate(t.when) && t.when <= T() && !o.inToday) meta.push(`<span class="m" style="color:var(--today)">${I.star}${t.part ? PARTSHORT[t.part] : ""}</span>`);
    else if (t.when === TM() && !o.inTomorrow) meta.push(`<span class="m" style="color:var(--tomorrow)">${I.sunrise}Tomorrow</span>`);
    else if (isDate(t.when) && t.when > TM()) meta.push(`<span class="m">${I.cal}${shortDay(t.when)}</span>`);
  }
  if (o.showProject && t.projectId && proj(t.projectId)) meta.push(`<span class="m">${esc(proj(t.projectId).name)}</span>`);
  const ft = finishText(t); if (ft && !t.done) meta.push(`<span class="m${ft.cls?" "+ft.cls:""}">${I.flag}${ft.txt}</span>`);
  if (t.repeat) meta.push(`<span class="m">${I.repeat}${o.inToday || o.compact ? "" : repeatLabel(t.repeat)}</span>`);
  if (t.notes && t.notes.trim() && !o.compact) meta.push(`<span class="m">${I.notes}</span>`);
  return `<div class="row${t.done?" done":""}" data-id="${t.id}">
    <div class="acts l"><div class="act today">${I.star}Today</div></div>
    <div class="acts r"><div class="act later">${I.clock}Later</div><div class="act del">${I.trash}Delete</div></div>
    <div class="row-main"><button class="check" data-toggle aria-label="Complete">${I.check}</button>
      <div class="row-text"><div class="row-title">${esc(t.title)}</div><div class="row-meta">${meta.join("")}</div></div></div></div>`;
}
// a group of rows; ctx says where a new to-do dropped into it belongs
function grp(rows, ctx={}, droppable=true){
  const attrs = Object.entries(ctx).filter(([,v]) => v != null).map(([k,v]) => ` data-${k}="${esc(v)}"`).join("");
  return `<div class="grp${rows ? " glass" : ""}${droppable ? " droppable" : ""}"${attrs}>${rows}</div>`;
}
function sec(title, icon, dim){ return `<div class="sec${dim?" dim":""}">${icon||""}<span>${title}</span></div>`; }
function empty(icon, text){ return `<div class="empty">${I[icon]}<p>${text}</p></div>`; }
// Today / Tomorrow split into no-time, morning, afternoon, evening
function partsBody(items, when, o){
  let h = grp(items.filter(t => !t.part).map(t => rowHTML(t, o)).join(""), { when, part:"" });
  PARTS.forEach(([p, label]) => {
    const ts = items.filter(t => t.part === p);
    if (ts.length || showAllParts) h += sec(label, I[p]) + grp(ts.map(t => rowHTML(t, o)).join(""), { when, part:p });
  });
  return h;
}

let draft = null, draftIsNew = false, parsedHint = null, keepText = false;

  else if (current.key === "today") d.when = T();

}

    body: `<div class="field-label" style="margin-top:6px">Card style</div>
      <div class="seg" style="margin:0 0 12px">${[["glass","Glass"],["default","Default"]].map(([v,l]) => `<button class="${db.ui.card===v?"on":""}" data-cardstyle="${v}">${l}</button>`).join("")}</div>
      <button class="set-row" data-export>${I.export}<span>Back up my to-dos</span></button>
      <label class="set-row" style="cursor:pointer">${I.import}<span>Restore from a backup</span><input type="file" accept="application/json,.json" data-import hidden></label>
      <p class="note">Everything lives only on this phone. Back up every week or so and keep the file in iCloud Drive or Files.</p>
      <p class="note">${open} open, ${done} done, ${db.projects.length} project${db.projects.length===1?"":"s"}.</p>
      <p class="note">${speedLine()}</p>`,
  });
  sheetHead.querySelector("[data-x]").onclick = () => closeSheet();
  sheetBody.querySelector("[data-export]").onclick = exportData;
  sheetBody.querySelectorAll("[data-cardstyle]").forEach(b => b.onclick = () => {
    db.ui.card = b.dataset.cardstyle; document.documentElement.dataset.card = db.ui.card; save();
    sheetBody.querySelectorAll("[data-cardstyle]").forEach(x => x.classList.toggle("on", x === b)); haptic();
  });
  sheetBody.querySelector("[data-import]").onchange = importData;
}
async function exportData(){
  const name = `daily-backup-${T()}.json`;
  const blob = new Blob([JSON.stringify(db, null, 2)], { type:"application/json" });
  try { const file = new File([blob], name, { type:"application/json" });
    if (navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file] }); return; } } catch(e){ if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importData(e){
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { const d = JSON.parse(r.result); if (!d || !Array.isArray(d.tasks) || !Array.isArray(d.projects)) throw 0;
      d.tasks.forEach(t => { if (t.part === undefined) t.part = t.evening ? "evening" : null; delete t.evening; });
      db = { ...d, v:2, seeded:true, ui: d.ui || { projOpen:true } }; save(); closeSheet(); if (current) pop(); renderAll(); toast(`Restored ${d.tasks.length} to-dos`);
    } catch(_){ toast("That file isn't a Daily backup"); }
  };
  r.readAsText(f);
}

/* ================= toast ================= */
let toastTimer;
function toast(msg, actionLabel, action){
  const el = $("#toast");
  el.innerHTML = esc(msg) + (actionLabel ? ` <button style="color:#7fb0ff;font-weight:600;margin-left:10px;pointer-events:auto">${esc(actionLabel)}</button>` : "");
  el.style.pointerEvents = actionLabel ? "auto" : "none";
  if (actionLabel) el.querySelector("button").onclick = () => { action(); el.classList.remove("on"); };
  el.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.classList.remove("on"); el.style.pointerEvents = "none"; }, actionLabel ? 4000 : 1800);
}

/* ================= the + button: tap to add, or drag it to where the to-do should go ================= */
let fabDrag = false;
function setCorner(c){ fab.classList.remove("c-br","c-bl","c-tr","c-tl"); fab.classList.add("c-" + c); }
(() => {
  let s = null, fx = 0, fy = 0, anim = null, gap = null, slot = null, dropEl = null, suppressClick = false;
  setCorner(db.ui.fabCorner);
  const setFab = (x, y) => { fx = x; fy = y; fab.style.translate = (x || y) ? `${x}px ${y}px` : ""; };   // "translate", not "transform", so the lift-up scale doesn't stretch the path
  const canDropHere = () => !current || current.key !== "logbook";
  function clearTargets(){ if (dropEl){ dropEl.classList.remove("drop"); dropEl = null; } if (gap){ const g = gap; g.classList.remove("open"); setTimeout(() => g.remove(), 200); gap = null; } slot = null; }
  // list screens: every place between rows (and every empty section) is a drop slot
  function slotsNow(){
    const out = [];
    list.querySelectorAll(".grp.droppable").forEach(g => {
      const rows = [...g.querySelectorAll(":scope > .row")], r = g.getBoundingClientRect();
      if (!rows.length){ out.push({ g, before:null, y: r.top + 6 }); return; }
      rows.forEach(row => out.push({ g, before: row, y: row.getBoundingClientRect().top }));
      out.push({ g, before:null, y: rows[rows.length-1].getBoundingClientRect().bottom });
    });
    return out;
  }
  // near a screen corner = "move the + here", not "add a to-do here"
  // corner circles: only the corner you're heading for shows, and only once you're close
  const zones = [...document.querySelectorAll(".zone")];
  const cornerPt = c => ({ x: c[1] === "l" ? 0 : innerWidth, y: c[0] === "t" ? 0 : innerHeight });
  const cornerAt = (cx, cy, r = 100) => { for (const z of zones){ const c = z.dataset.z; if (c === db.ui.fabCorner) continue; const p = cornerPt(c); if (Math.hypot(cx - p.x, cy - p.y) < r) return c; } return null; };
  let hotZone = null;
  function showZones(){ zones.forEach(z => z.className = "zone"); hotZone = null; }
  function setHot(cx, cy){
    const near = cornerAt(cx, cy, 150), hot = cornerAt(cx, cy, 100);
    zones.forEach(z => { z.classList.toggle("near", z.dataset.z === near && !hot); z.classList.toggle("hot", z.dataset.z === hot); });
    if (hot && hot !== hotZone) haptic(); hotZone = hot;
  }
  function updateTargets(cx, cy){
    setHot(cx, cy);
    if (hotZone){ if (dropEl || gap) clearTargets(); return; }
    if (current){
      const all = slotsNow(); if (!all.length) return;
      let best = all[0], bd = Infinity; all.forEach(sl => { const d = Math.abs(sl.y - cy); if (d < bd){ bd = d; best = sl; } });
      if (slot && slot.g === best.g && slot.before === best.before) return;
      if (gap){ const g = gap; g.classList.remove("open"); setTimeout(() => g.remove(), 200); }
      gap = document.createElement("div"); gap.className = "gap";
      best.g.insertBefore(gap, best.before); if (!best.g.classList.contains("glass")) best.g.classList.add("glass");
      requestAnimationFrame(() => gap && gap.classList.add("open"));
      slot = best; haptic();
    } else {
      fab.style.visibility = "hidden"; const el = document.elementFromPoint(cx, cy); fab.style.visibility = "";
      const t = el && el.closest("[data-drop]");
      if (t !== dropEl){ if (dropEl) dropEl.classList.remove("drop"); dropEl = t; if (t){ t.classList.add("drop"); haptic(); } }
    }
  }
  function ripple(x, y){ const r = document.createElement("div"); r.className = "ripple"; r.style.left = x + "px"; r.style.top = y + "px"; document.body.appendChild(r); setTimeout(() => r.remove(), 600); }
  function createAtTarget(){
    if (current && slot){
      const g = slot.g, ds = g.dataset, over = {};
      if (ds.when !== undefined) over.when = ds.when || null;
      if (ds.part !== undefined) over.part = ds.part || null;
      if (ds.proj) over.projectId = ds.proj;
      const prev = slot.before ? slot.before.previousElementSibling : [...g.querySelectorAll(":scope > .row")].pop();
      const po = prev && prev.classList.contains("row") ? getTask(prev.dataset.id)?.order : null, no = slot.before ? getTask(slot.before.dataset.id)?.order : null;
      over.order = po != null && no != null ? (po + no) / 2 : po != null ? po + 1 : no != null ? no - 1 : Date.now();
      return over;
    }
    if (!current && dropEl){
      const k = dropEl.dataset.drop;
      if (k === "today") return { when: T() };
      if (k === "tomorrow") return { when: TM() };
      if (k === "upcoming") return { when: addDays(T(), 2) };
      if (k === "someday") return { when: "someday" };
      if (k === "inbox" || k === "logbook") return { when: null };
      if (k.startsWith("proj:")) return { when: null, projectId: k.slice(5) };
    }
    return null;
  }
  fab.addEventListener("pointerdown", e => {
    anim && anim.stop();
    s = { id: e.pointerId, x0: e.clientX - fx, y0: e.clientY - fy, sx: e.clientX, sy: e.clientY, tr: tracker(), drag:false };
    s.tr.add(e.clientX, e.clientY); try { fab.setPointerCapture(e.pointerId); } catch(_){}
  });
  fab.addEventListener("pointermove", e => {
    if (!s || e.pointerId !== s.id) return;
    s.tr.add(e.clientX, e.clientY);
    if (!s.drag && Math.hypot(e.clientX - s.sx, e.clientY - s.sy) > 8 && canDropHere()){
      s.drag = true; fabDrag = true; fab.classList.add("drag"); haptic(); closeOpenRow();
      if (current && (current.key === "today" || current.key === "tomorrow")){ showAllParts = true; renderList(); }
    }
    if (!s.drag) return;
    setFab(e.clientX - s.x0, e.clientY - s.y0);
    const r = fab.getBoundingClientRect(); updateTargets(r.left + r.width/2, r.top + r.height/2);
    if (current){ if (e.clientY > innerHeight - 90) list.scrollTop += 7; else if (e.clientY < 130) list.scrollTop -= 7; }
  });
  const end = e => {
    if (!s || e.pointerId !== s.id) return;
    const wasDrag = s.drag, v = s.tr.vel(); s = null;
    if (!wasDrag){ if (e.type === "pointerup") openEditor(null); return; }
    suppressClick = true; setTimeout(() => suppressClick = false, 60);
    fabDrag = false; fab.classList.remove("drag");
    const r = fab.getBoundingClientRect(), zone = cornerAt(r.left + r.width/2, r.top + r.height/2);
    const thrown = Math.hypot(v.x, v.y) > 900;   // a fast flick never adds anything; the + flies to the corner you threw it at
    const over = zone || thrown ? null : createAtTarget();
    showZones();
    if (over) ripple(r.left + r.width/2, r.top + r.height/2);
    clearTargets();
    if (showAllParts){ showAllParts = false; if (!over) renderList(); }
    if (!over){
      // dropped in (or thrown into) another corner: the + lives there now. Dropped on nothing: it just goes home.
      // dragged into a corner circle, or flicked toward a corner: the + settles there
      let corner = zone;
      if (!corner && thrown){ const px = r.left + r.width/2 + project(v.x, .995), py = r.top + r.height/2 + project(v.y, .995);
        corner = (py < innerHeight/2 ? "t" : "b") + (px < innerWidth/2 ? "l" : "r"); }
      if (corner && corner !== db.ui.fabCorner){
        const c0 = { x: r.left + r.width/2, y: r.top + r.height/2 };
        setCorner(corner);
        const r1 = fab.getBoundingClientRect();
        setFab(fx + c0.x - (r1.left + r1.width/2), fy + c0.y - (r1.top + r1.height/2));
        db.ui.fabCorner = corner; save(); haptic();
      }
    }
    // spring into its corner, carrying the throw speed
    let x = fx, y = fy; const ax = spring({ from: fx, to: 0, velocity: v.x, response: .45, damping: .72, onUpdate: X => { x = X; setFab(x, y); } });
    const ay = spring({ from: fy, to: 0, velocity: v.y, response: .45, damping: .72, onUpdate: Y => { y = Y; setFab(x, y); } });
    anim = { stop(){ ax.stop(); ay.stop(); } };
    if (over) openEditor(null, over);
  };
  fab.addEventListener("pointerup", end); fab.addEventListener("pointercancel", end);
  fab.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); });
})();

/* ================= morning plan ================= */
function leftovers(){ return db.tasks.filter(t => !t.done && isDate(t.when) && t.when < T()).sort((a,b) => a.when < b.when ? -1 : 1); }
function maybePlan(){
  if (db.planDay === T()) return;
  if (!leftovers().length){ db.planDay = T(); save(); return; }
  if (!sheetOpen) openPlan();
}
function openPlan(){
  const h = new Date().getHours(), greet = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
  const items = leftovers(), todayCount = db.tasks.filter(t => !t.done && t.when === T()).length;
  const row = t => `<div class="plan-item" data-id="${t.id}"><div class="pt">${esc(t.title)}<small>From ${longDay(t.when)}${t.repeat ? " · " + repeatLabel(t.repeat) : ""}</small></div>
    <div class="pb"><button class="ptoday" data-p="today">Today</button><button data-p="later">Later</button><button data-p="${t.repeat ? "skip" : "del"}">${t.repeat ? "Skip" : "Delete"}</button></div></div>`;
  openSheet({
    head: `<span style="width:60px"></span><h3>Plan your day</h3><button class="txt-btn strong" data-x>Done</button>`,
    body: `<div class="greet">${greet}, Nit</div>
      <p class="note" style="margin:0 0 8px">${items.length === 1 ? "1 thing" : items.length + " things"} didn't get done. Where should ${items.length === 1 ? "it" : "they"} go?</p>
      <div>${items.map(row).join("")}</div>
      <p class="note">${todayCount ? `You already have ${todayCount} planned for today. ` : ""}Anything you leave here moves to Today.</p>`,
    onClose(){ db.tasks.forEach(t => { if (!t.done && isDate(t.when) && t.when < T()) t.when = T(); }); db.planDay = T(); save(); renderAll(); },
  });
  sheetHead.querySelector("[data-x]").onclick = () => closeSheet();
  sheetBody.querySelectorAll(".plan-item button").forEach(b => b.onclick = () => {
    const item = b.closest(".plan-item"), t = getTask(item.dataset.id), what = b.dataset.p; if (!t) return;
    if (what === "today") t.when = T(); else if (what === "later") t.when = TM();
    else if (what === "skip") t.when = nextRepeat(t.repeat, T()); else db.tasks = db.tasks.filter(x => x.id !== t.id);
    save(); haptic(); item.classList.add("gone");
    setTimeout(() => { item.remove(); if (!sheetBody.querySelector(".plan-item")) closeSheet(); }, 230);
  });
}

/* ================= start ================= */
let lastDay = T();
document.addEventListener("visibilitychange", () => { if (!document.hidden && T() !== lastDay){ lastDay = T(); renderAll(); maybePlan(); } });
renderAll();
// speed check: remember how long the last few opens took (shown in Settings)
requestAnimationFrame(() => { try {
  const k = KEY + ".speed", a = JSON.parse(localStorage.getItem(k) || "[]");
  a.unshift({ ms: Math.round(performance.now()), off: !!(navigator.serviceWorker && navigator.serviceWorker.controller) });
  localStorage.setItem(k, JSON.stringify(a.slice(0, 8)));
} catch(e){} });

setTimeout(maybePlan, 250);
if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
  // a newer Daily was downloaded in the background: it shows next time you open the app (or tap Reload now)
  navigator.serviceWorker.addEventListener("message", e => {
    if (!e.data || e.data.type !== "daily-updated") return;
    toast("Daily was updated", "Reload", () => location.reload());
  });
}
})();
</script>
</body>
</html>
