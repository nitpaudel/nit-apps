:root,html[data-theme="dark"]{
  --bg:#181818; --top:#212121; --card:#252525; --card2:#2f2f2f; --chip:#333333; --line:#333336; --hair:rgba(255,255,255,.08);
  --text:#f2f2f2; --text2:#a1a1a6; --text3:#6b6b70; --inv:#ffffff; --invtext:#111111;
  --blue:#3b7bff; --blue2:#2a5fd6; --red:#e8453c; --gold:#e3b53b; --goldtext:#4a3600; --orange:#f0884a; --teal:#4cc3c9; --green:#5dbb73; --purple:#9b8cff;
  --skin:#3a3a3c; --off:#505054;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --ease:cubic-bezier(.2,.9,.25,1);
  --title:"NF Title",system-ui,sans-serif; --sans:"NF Sans",-apple-system,system-ui,sans-serif;
}
html[data-theme="light"]{
  --bg:#f4f4f1; --top:#fbfbf9; --card:#ffffff; --card2:#f0f0ed; --chip:#ececea; --line:#e4e4e0; --hair:rgba(0,0,0,.07);
  --text:#1d2033; --text2:#77798a; --text3:#a7a9b3; --inv:#111111; --invtext:#ffffff;
  --goldtext:#4a3600; --skin:#d9d9de; --off:#c3c3ca;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font:16px/1.35 var(--sans);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg{display:block}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.press{transition:transform .2s var(--ease),opacity .2s}
.press:active{transform:scale(.97);opacity:.85}

/* ===== screens ===== */
.scr{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;background:var(--bg)}
#main{padding-bottom:calc(var(--sab) + 110px)}
#page{z-index:30;transform:translateX(100%);transition:transform .38s var(--ease);box-shadow:-10px 0 30px rgba(0,0,0,.25)}
#page.on{transform:none}
.head{background:var(--top);padding:calc(var(--sat) + 18px) 20px 18px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--text2);text-transform:uppercase;font-weight:500;margin-bottom:6px}
.title{font:800 27px/1.05 var(--title);text-transform:uppercase;letter-spacing:.01em;display:inline-block;transform:scaleX(1.12);transform-origin:left center;white-space:nowrap}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.icons{display:flex;gap:10px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--text)}
.ib svg{width:20px;height:20px}
.body-pad{padding:6px 16px 0}
h2{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:26px 4px 12px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 12px}
.sec h2{margin:0}
.ul{font-size:15px;color:var(--text);text-decoration:underline;text-underline-offset:3px;font-weight:500}
.card{background:var(--card);border-radius:18px;overflow:hidden}
.card+.card{margin-top:12px}
.sub{font-size:14px;color:var(--text2)}
.small{font-size:13px;color:var(--text2);line-height:1.4}

/* chips (muscle tags) */
.tags{display:flex;flex-wrap:nowrap;gap:6px;overflow:hidden;margin-top:9px;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.tag{flex:none;height:28px;padding:0 10px;border-radius:7px;background:var(--chip);font-size:14px;display:inline-flex;align-items:center;color:var(--text)}

/* week strip */
.week{display:flex;justify-content:space-between;margin-top:18px}
.day{width:42px;height:70px;border-radius:21px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;
  box-shadow:inset 0 0 0 1.5px var(--line);font-size:15px;font-weight:500}
.day span{font-size:12px;color:var(--text2);font-weight:500}
.day.done{box-shadow:inset 0 0 0 2px var(--orange)}
.day.today::after{content:"";position:absolute;bottom:8px;width:4px;height:4px;border-radius:50%;background:var(--text)}

/* program card */
.prog-h{display:flex;align-items:center;gap:14px;padding:16px;width:100%}
.picon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--blue);color:#fff;flex:none}
.picon svg{width:26px;height:26px}
.prog-h .m{flex:1;min-width:0}
.prog-h b{display:block;font-weight:500;font-size:17px}
.prog-h .cv{width:20px;height:20px;color:var(--text);transition:transform .25s}
.prog-h .cv.closed{transform:rotate(180deg)}
.wrow{display:flex;gap:12px;align-items:flex-start;padding:16px;width:100%;position:relative;border-top:1px solid var(--line)}
.wrow .m{flex:1;min-width:0}
.wrow b{display:block;font-weight:500;font-size:17px}
.wrow .ex{font-size:14px;color:var(--text2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.wrow .dlbl{font-size:12px;color:var(--text2);font-weight:500;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.wrow.today .dlbl{color:var(--blue)}
.cb{width:24px;height:24px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 2px var(--text2);display:grid;place-items:center;margin-top:2px}
.cb svg{width:16px;height:16px;opacity:0}
.cb.on{background:var(--text);box-shadow:none;color:var(--bg)}
.cb.on svg{opacity:1}
.mrow{display:flex;align-items:center;gap:14px;padding:15px 16px;width:100%;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .mi{width:22px;height:22px;flex:none;color:var(--text)}
.mrow .m{flex:1;min-width:0}
.mrow b{display:block;font-weight:500}
.mrow span{display:block;font-size:13px;color:var(--text2)}
.mrow .r{font-size:15px;color:var(--text2)}
.chev{width:9px;height:15px;color:var(--text3);flex:none}

/* ===== preview page ===== */
.nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 8px) 10px 8px}
.nav h3{font-size:17px;font-weight:600;position:absolute;left:60px;right:60px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.back{width:44px;height:44px;display:grid;place-items:center;color:var(--text)}
.back svg{width:22px;height:22px}
.tm{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none}
.tm::-webkit-scrollbar{display:none}
.tmc{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line)}
.tmc .thumb{width:64px;height:64px;border-radius:10px}
.tmc b{display:block;font-size:16px;font-weight:500}
.tmc span{display:block;font-size:13px;color:var(--text2)}
.thumb{background:var(--card2);border-radius:10px;overflow:hidden;flex:none;display:grid;place-items:center}
.thumb svg{width:100%;height:100%}
.exr{display:flex;gap:12px;padding:16px 0;border-top:1px solid var(--line);position:relative}
.exlist .exr:first-child{border-top:0}
.exr .thumb{width:64px;height:64px;margin-top:24px}
.exr .m{flex:1;min-width:0}
.exr b{display:block;font-size:17px;font-weight:500;line-height:1.25;padding-right:34px}
.exr .kebab{position:absolute;right:-8px;top:10px;width:40px;height:40px;display:grid;place-items:center;color:var(--text2)}
.exr .kebab svg{width:20px;height:20px}
.srow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:15px;color:var(--text2)}
.srow .sn{width:24px;height:24px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:13px;color:var(--text);font-weight:500;flex:none}
.srow .rir{margin-left:auto}
.ssl{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--blue);text-transform:uppercase;margin-bottom:3px}
.rir{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;background:var(--gold);color:var(--goldtext)}
.rir.r0,.rir.r1{background:var(--red);color:#fff}
.rir.r4,.rir.r5,.rir.r6{background:var(--green);color:#fff}
.bottom{position:sticky;bottom:0;padding:14px 16px calc(var(--sab) + 12px);background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.big{width:100%;height:56px;border-radius:14px;background:var(--inv);color:var(--invtext);font-size:17px;font-weight:600;display:grid;place-items:center;text-align:center}
.big.soft{background:var(--chip);color:var(--text)}
.big.red{background:none;color:var(--red)}

/* ===== logging screen ===== */
.lg-top{position:sticky;top:0;z-index:6;background:var(--bg);padding:calc(var(--sat) + 6px) 12px 0;box-shadow:0 1px 0 var(--line)}
.lg-bar{display:flex;align-items:center;gap:6px;height:44px}
.lg-bar .clock{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;flex:1;margin-left:2px}
.restpill{height:34px;padding:0 12px;border-radius:17px;background:var(--chip);display:flex;align-items:center;gap:6px;font-weight:600;font-variant-numeric:tabular-nums}
.restpill svg{width:16px;height:16px}
.restpill.on{background:var(--blue);color:#fff}
.restpill.done{background:var(--green);color:#fff}
.strip{display:flex;gap:8px;overflow-x:auto;padding:8px 4px 0;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.st{flex:none;width:60px;position:relative;padding-bottom:9px}
.st .thumb{width:60px;height:60px;border-radius:10px}
.st .thumb.word{font-size:11px;font-weight:600;color:var(--text2);text-align:center;line-height:1.15;padding:4px}
.st.on::after{content:"";position:absolute;left:6px;right:6px;bottom:0;height:3px;border-radius:2px;background:var(--text)}
.st.done .thumb{opacity:.5}
.st .ck{position:absolute;top:18px;left:18px;width:24px;height:24px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.st .ck svg{width:14px;height:14px}
.st .ssd{position:absolute;top:4px;right:4px;font-size:10px;font-weight:700;background:var(--blue);color:#fff;border-radius:5px;padding:1px 4px}
.st.add .thumb{color:var(--text2);background:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.st.add svg{width:22px;height:22px}
.lg-body{padding:18px 16px 0}
.lg-name{font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.lg-sub{font-size:15px;color:var(--text2);margin-top:2px}
.pills{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:0 16px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pl{flex:none;height:38px;padding:0 14px;border-radius:19px;background:var(--chip);display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:500;white-space:nowrap}
.pl svg{width:16px;height:16px}
.pl.wand{width:38px;padding:0;justify-content:center;position:relative}
.pl.wand i{position:absolute;right:4px;bottom:5px;width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px var(--chip)}
.pl .cnt{width:18px;height:18px;border-radius:50%;background:var(--text);color:var(--bg);font-size:11px;font-weight:700;display:grid;place-items:center}
.pl.on{background:var(--text);color:var(--bg)}
.pl.on .cnt{background:var(--bg);color:var(--text)}
.tbl{margin-top:18px}
.th,.tr{display:grid;grid-template-columns:38px 1fr 72px 72px 30px;align-items:center;gap:8px}
.th{font-size:14px;color:var(--text2);height:28px}
.th span:nth-child(3),.th span:nth-child(4){text-align:center}
.tr{min-height:64px}
.sb{width:32px;height:32px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:14px;font-weight:600}
.auto{font-size:14px;color:var(--text2);line-height:1.3;font-variant-numeric:tabular-nums}
.auto.adj{color:var(--blue)}
.cell{position:relative}
.cell input{width:100%;height:44px;border-radius:10px;border:0;outline:0;background:var(--chip);text-align:center;font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.cell input::placeholder{color:var(--text2);opacity:.85}
.cell input:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.cell .rir{position:absolute;right:-7px;bottom:-7px;width:22px;height:22px;box-shadow:0 0 0 2.5px var(--bg)}
.cell .bw{height:44px;display:grid;place-items:center;font-size:13px;color:var(--text2);border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--line)}
.tr .cb{margin:0}
.tr.done{opacity:.55}
.tr.warm .sb{background:none;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--text2)}
.addset{width:32px;height:32px;border-radius:50%;background:var(--chip);display:grid;place-items:center;margin:4px 3px}
.addset svg{width:16px;height:16px}
.qrow{display:flex;gap:6px;margin:-4px 0 6px 46px}
.qrow button{height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;background:var(--chip);color:var(--text2)}
.qrow button.on.clean{background:rgba(93,187,115,.2);color:var(--green)}
.qrow button.on.cheated{background:rgba(232,69,60,.16);color:var(--red)}
.cue{margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--card);font-size:14px;color:var(--text2);line-height:1.45}
.cue b{color:var(--text);font-weight:500}
.lg-next{display:flex;gap:10px;padding:20px 0 calc(var(--sab) + 24px)}
.lg-next .big{flex:1}
.fixrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%}
.fixrow .m{flex:1}
.fixrow b{display:block;font-weight:500}
.fixrow span{display:block;font-size:13px;color:var(--text2);line-height:1.35;margin-top:2px}
.fixrow.done b{color:var(--text2);text-decoration:line-through}

/* ===== dashboard ===== */
.rings{display:flex;align-items:flex-start;justify-content:space-between;margin-top:6px;padding:0 2px}
.ring{display:flex;flex-direction:column;align-items:center;text-align:center}
.ring .rv{position:relative;display:grid;place-items:center}
.ring .rv div{position:absolute;text-align:center}
.ring .rv b{display:block;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.ring .rv small{font-size:11px;color:var(--text2)}
.ring.bigr .rv b{font-size:26px}
.ring .rl{margin-top:8px;font-size:15px;font-weight:500}
.ring .rt{font-size:12px;color:var(--text2)}
.seg{display:flex;justify-content:center;gap:2px;margin:18px auto 0;padding:3px;border-radius:20px;width:max-content;background:var(--chip)}
.seg button{height:30px;padding:0 14px;border-radius:15px;font-size:13px;font-weight:500;color:var(--text2)}
.seg button.on{background:var(--inv);color:var(--invtext)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ic{background:var(--card);border-radius:16px;padding:14px 14px 16px;min-height:156px;display:flex;flex-direction:column;position:relative;width:100%}
.ic b{font-weight:500;font-size:16px}
.ic .p{font-size:12px;color:var(--text2)}
.ic .viz{flex:1;display:flex;align-items:center;justify-content:center;min-height:56px}
.ic .v{font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.ic .v small{font-size:12px;color:var(--text2);font-weight:400;margin-left:3px}
.ic .chev{position:absolute;right:12px;bottom:20px}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:100%;padding:8px 0}
.dots i{aspect-ratio:1;border-radius:3px;background:var(--chip)}
.dots i.g{background:var(--green)} .dots i.o{background:var(--orange)}
.see{display:block;margin:12px 4px 0 auto;width:max-content}
.prompt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--card);margin-top:16px}
.prompt .m{flex:1}
.prompt b{display:block;font-weight:500}
.prompt input{width:96px;height:42px;border-radius:10px;border:0;outline:0;background:var(--chip);text-align:center;font-size:18px;font-weight:500}
.banner{margin-top:14px;padding:12px 16px;border-radius:14px;background:rgba(232,69,60,.12);color:var(--red);font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px}
.banner button{margin-left:auto;color:var(--text);text-decoration:underline}

/* ===== levels ===== */
.bodywrap{position:relative;display:flex;justify-content:center;padding:4px 0 0}
.bodywrap svg.body{height:400px;width:auto}
.rot{position:absolute;right:0;bottom:6px}
.legend{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;margin-top:10px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--blue)}
.legend button{text-decoration:underline;text-underline-offset:3px}
.lvrow{display:flex;align-items:center;gap:14px;padding:12px 14px;width:100%;border-top:1px solid var(--line)}
.lvrow:first-child{border-top:0}
.lvrow .thumb{width:58px;height:58px}
.lvrow .m{flex:1}
.lvrow b{display:block;font-weight:500;font-size:17px}
.lvrow span{font-size:14px;color:var(--text2)}

/* ===== tab bar ===== */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:8px 6px calc(var(--sab) + 6px);
  background:var(--top);box-shadow:0 -1px 0 var(--line)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--text3);text-align:center}
#tabs button svg{width:25px;height:25px}
#tabs button.on{color:var(--text)}
#tabs .plus{width:52px;height:52px;border-radius:50%;background:var(--inv);color:var(--invtext);display:grid;place-items:center;margin:0 auto}
#tabs .plus svg{width:24px;height:24px}

/* ===== sheets ===== */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:calc(100% - var(--sat) - 40px);background:var(--top);border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .42s var(--ease)}
.sheet.on{transform:none}
.sheet.tall{height:calc(100% - var(--sat) - 40px)}
.grab{height:20px;display:grid;place-items:center;flex:none;touch-action:none}
.grab i{width:40px;height:5px;border-radius:3px;background:var(--text3);opacity:.5}
.shd{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 10px 12px;border-bottom:1px solid var(--line);flex:none;touch-action:none}
.shd .x{width:44px;height:44px;display:grid;place-items:center}
.shd .x svg{width:20px;height:20px}
.shd h3{text-align:center;font-size:20px;font-weight:600;line-height:1.2}
.shd p{text-align:center;font-size:14px;color:var(--text2);margin-top:2px}
.sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(var(--sab) + 20px);flex:1}
.opt{display:flex;align-items:center;gap:16px;padding:14px 4px;width:100%;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt .oi{width:24px;height:24px;flex:none;color:var(--text)}
.opt .m{flex:1}
.opt b{display:block;font-weight:500;font-size:17px}
.opt span{display:block;font-size:14px;color:var(--text2)}
.opt .pillbtn{height:32px;padding:0 14px;border-radius:16px;background:var(--chip);font-size:14px;font-weight:500;display:grid;place-items:center}
.opt.red b{color:var(--red)}
.opt.red .oi,.opt.o-red .oi{color:var(--red)}
.field{width:100%;height:50px;border-radius:12px;border:0;outline:0;padding:0 14px;background:var(--chip);font-size:16px}
.field::placeholder{color:var(--text3)}
.info{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:rgba(59,123,255,.13);margin-top:12px;font-size:15px;line-height:1.4}
.info svg{width:22px;height:22px;flex:none;color:var(--blue);margin-top:1px}
.elog{margin-top:22px}
.elog h4{font-size:19px;font-weight:600;margin-bottom:4px}
.ev{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:flex-start}
.ev .t{color:var(--text2);width:66px;flex:none}
.ev .m{flex:1;line-height:1.4}
.rirpick{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}
.rirpick button{height:52px;border-radius:12px;background:var(--chip);font-size:18px;font-weight:600;text-align:center}
.rirpick button.on{background:var(--inv);color:var(--invtext)}
.hist-d{font-size:13px;color:var(--text2);font-weight:600;margin:16px 2px 6px}
.hist-s{display:flex;gap:8px;flex-wrap:wrap}
.hist-s span{font-size:15px;font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:9px;background:var(--chip);display:inline-flex;align-items:center;gap:6px}
.hist-s .rir{width:18px;height:18px;font-size:10px}
.chart{height:150px;margin-top:10px}
.chart svg{width:100%;height:100%;overflow:visible}
.chart text{fill:var(--text3);font-size:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:15px}
.kv span{color:var(--text2)}
.tg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:12px;padding:3px;margin-top:10px}
.tg button{height:36px;border-radius:9px;font-size:15px;font-weight:500;color:var(--text2);text-align:center}
.tg button.on{background:var(--inv);color:var(--invtext)}
.ol{padding-left:20px;font-size:15px;line-height:1.5;color:var(--text2)}
.ol li{margin:6px 0}
.ol b{color:var(--text)}
.ol a{color:var(--text)}
.hint{font-size:13px;color:var(--text2);margin:8px 2px;line-height:1.45}
.hint.err{color:var(--red)}
.sl{font-size:13px;color:var(--text2);font-weight:600;margin:20px 2px 4px;text-transform:uppercase;letter-spacing:.05em}
.dotc{width:10px;height:10px;border-radius:50%;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px}
.cal div{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:15px;box-shadow:inset 0 0 0 1.5px var(--line)}
.cal div.done{box-shadow:inset 0 0 0 2px var(--orange)}
.cal div.out{box-shadow:none;color:var(--text3)}
.cal div.today{font-weight:700}
.calh{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px;font-size:12px;color:var(--text2);text-align:center}

  white-space:nowrap;transition:transform .45s var(--ease);background:var(--inv);color:var(--invtext);box-shadow:0 10px 30px rgba(0,0,0,.35)}

@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
.shd .tt{flex:1;min-width:0;text-align:center}

/* ===== v3.1: closer match ===== */
.ib.plain{background:none}

.navr{display:flex;gap:4px;width:44px;justify-content:flex-end}

/* dashboard */
.head .hh{margin:18px 0 10px}
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -20px}

.pdots{display:flex;justify-content:center;gap:6px;margin-top:16px}

.ring .rv b{font-size:22px}
.ring.bigr .rv b{font-size:28px}
.recs{display:flex;flex-direction:column;gap:2px;min-height:230px}

.rec{display:flex;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);text-align:left}

.mthumb{width:62px;height:62px}

/* workout tab */
.day.past{opacity:.75}
.calx{margin-top:16px}
.cxr{display:flex;justify-content:space-between;margin-bottom:10px}

.cxm{display:grid;grid-template-columns:repeat(7,1fr);margin:-6px 0 4px}

.wrow .chev{align-self:center}
.exhead{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 6px}

.thumb.word{font-size:12px;font-weight:600;color:var(--text2);text-align:center;line-height:1.2;width:64px;height:64px}

/* logging */
.lg-bar{gap:10px}
.clock.paused{color:var(--gold)}
.restw{display:flex;align-items:center;gap:6px;font-weight:600;font-variant-numeric:tabular-nums;height:36px}

.restw .rbar b{display:block;height:100%;width:0;background:var(--blue);transition:width .25s linear}
.restw.done .rbar b{background:var(--green)}
.restw.on{color:var(--blue)}
.st{width:56px}
.st .thumb{width:56px;height:74px;border-radius:8px}
.st .thumb.word{width:56px;height:74px}
.st .ck{top:25px;left:16px}
.lg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.lg-rng{flex:none;min-width:74px;height:44px;border-radius:22px;box-shadow:inset 0 0 0 1.5px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12px;margin-top:4px}
.lg-rng b{font-size:15px;font-weight:600;line-height:1.1}
.lg-rng span{font-size:11px;color:var(--text2)}
.pl.wand.lit{background:var(--blue);color:#fff}
.th .cb{width:24px;height:24px;margin:0}
.th span svg{width:14px;height:14px;display:inline-block;vertical-align:-2px}

/* targets */
.tgh,.tgr{display:grid;grid-template-columns:40px 1fr 1fr 40px;gap:10px;align-items:center}
.tgh{font-size:14px;color:var(--text2);margin:6px 0 8px}
.tgh span:nth-child(2){grid-column:2/4;text-align:center}
.tgh span:last-child{text-align:center}
.tgr{margin-bottom:10px}
.tgr .sb{width:32px;height:32px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:14px;font-weight:600}
.tin{height:44px;border-radius:10px;border:0;background:var(--chip);text-align:center;font-size:17px;width:100%;outline:none}
.tin.bad{background:rgba(232,69,60,.25);box-shadow:inset 0 0 0 1.5px var(--red)}
.tgr .rir{justify-self:center;position:static}
.err{color:var(--red);font-size:14px;margin:4px 0 8px}
.trest{display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--line);margin-top:14px}
.trest .m{flex:1}
.trest b{display:block;font-weight:500;font-size:17px}
.trest span{display:block;font-size:14px;color:var(--text2)}

/* tabs, charts, stats */
.ptabs{display:flex;position:sticky;top:calc(var(--sat) + 60px);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:1 0 auto;height:44px;padding:0 14px;font-size:15px;font-weight:500;color:var(--text2);text-align:center;position:relative;white-space:nowrap}
.ptabs button.on{color:var(--text)}
.ptabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--text)}
.sheet-tabs{position:static;margin:-6px -16px 6px}
.stath{display:flex;gap:34px;margin-top:16px}
.stath span{display:block;font-size:13px;color:var(--text2)}
.stath b{font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stath small{font-size:14px;color:var(--text2);font-weight:400;margin-left:4px}
.stdate{margin-top:2px}
.chart.lg{margin-top:16px;height:auto}
.chart.lg svg{width:100%;height:auto;display:block}
.chart svg text{font-size:11px;fill:var(--text2)}
.rng{display:flex;align-items:center;gap:4px;margin-top:12px}
.rng button{flex:1;height:34px;border-radius:17px;font-size:14px;font-weight:500;color:var(--text2);text-align:center}
.rng button.on{background:var(--inv);color:var(--invtext)}
.rng .avg{flex:none;padding:0 12px;background:var(--chip);color:var(--text);display:flex;align-items:center;gap:4px}
.dn{width:12px;height:12px;display:inline-block}
.lgd{display:flex;justify-content:center;gap:22px;margin-top:14px;padding:12px;border-radius:14px;background:var(--card);font-size:14px}
.lgd span{display:flex;align-items:center;gap:8px}
.lgd i{display:block;flex:none}
.lgd i.bar{width:10px;height:12px;border-radius:2px;background:var(--c)}
.lgd i.line{width:16px;height:3px;border-radius:2px;background:var(--c)}
.lgd i.dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.lgd i.ring{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--c)}
.tipc{margin-top:14px;padding:14px 16px;border-radius:14px;background:#3a2f6b;color:#fff}
html[data-theme="light"] .tipc{background:#e9e4ff;color:#2b2250}
.tipc b{display:flex;gap:8px;align-items:center;font-weight:600}
.tipc b svg{width:18px;height:18px}
.tipc p{font-size:14px;line-height:1.45;margin-top:6px;opacity:.88}
.tipc button{margin-top:10px;height:32px;padding:0 14px;border-radius:16px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
.wch{padding:14px 16px}
.wch>b{font-weight:600;display:block;margin-bottom:6px}
.wcr{display:grid;grid-template-columns:70px 1fr auto;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.wcr span{color:var(--text2)}
.wcr b{font-weight:500;font-variant-numeric:tabular-nums}
.wcr em{font-style:normal;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--text2)}
.wcr em::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--purple)}
.wcr em.up::before{background:var(--orange)}.wcr em.dn::before{background:var(--teal)}.wcr em.st::before{background:var(--green)}
.ibox{display:flex;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
.ibox:first-child{border-top:0}
.ibox .bx{width:86px;height:86px;flex:none;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ibox .bx b{font-size:22px;font-weight:500}
.ibox .bx span{font-size:11px;color:var(--text2);line-height:1.2;padding:0 4px}
.ibox>div:last-child b{font-weight:500;font-size:16px}
.ibox p{font-size:13px;color:var(--text2);line-height:1.4;margin-top:3px}

/* habit calendar */
.hcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:6px}
.hcalh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:18px;font-size:12px;color:var(--text2);text-align:center}
.hcal button{aspect-ratio:1;width:100%;min-width:0;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);font-size:15px;font-weight:500;display:grid;place-items:center;position:relative}
.hcal button.out{box-shadow:none;color:var(--text3)}
.hcal button.tg{box-shadow:inset 0 0 0 2px var(--green)}
.hcal button.to{box-shadow:inset 0 0 0 2px var(--orange)}

.hnav{display:flex;align-items:center;gap:8px;margin-top:14px}
.hnav .hm{flex:1;text-align:center;font-weight:600}
.yr{padding:14px}

.yg i{aspect-ratio:1;border-radius:1.5px;background:var(--chip)}
.yg i.n{background:none}.yg i.g{background:var(--green)}.yg i.o{background:var(--orange)}
.ym{display:grid;grid-template-columns:repeat(12,1fr);margin-top:6px;font-size:10px;color:var(--text2);text-align:center}

/* shortcuts */
.sc4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 14px}
.sc4 button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;text-align:center}

/* entry sheet */
.dpick{position:relative;display:inline-flex;align-items:center;gap:4px}

.ef{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:6px}

/* levels */
.lvempty{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:200px;text-align:center;font-size:17px;font-weight:500;color:var(--text);text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none}
.legend button{display:inline-flex;align-items:center;gap:3px}

.prof span{font-size:14px;color:var(--text2)}

.th-p.dark{background:#181818;color:#f2f2f2}

/* mini player */
#mini{position:fixed;left:10px;right:10px;bottom:calc(var(--sab) + 76px);z-index:19;height:58px;border-radius:16px;background:var(--card2);display:flex;align-items:center;gap:6px;padding:6px 8px 6px 14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}

/* dialog */

.dlg.on .dc{transform:none}
.dlg .dh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dlg h3{font-size:22px;font-weight:600}
.dlg .x{width:32px;height:32px;display:grid;place-items:center}
.dlg .x svg{width:20px;height:20px}
.dlg p{color:var(--text2);font-size:15px;line-height:1.5;margin:10px 0 16px}
.dlg .big+.big{margin-top:10px}

/* ===== v3.2: app keypad, status bar cover, countdown ===== */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:var(--sat);background:var(--top);z-index:40;pointer-events:none}
body.pageon::before{background:var(--bg)}
html,body{height:100%;min-height:-webkit-fill-available}
.cellb{width:100%;height:46px;border-radius:10px;background:var(--chip);font-size:18px;font-weight:500;text-align:center;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:1px;color:var(--text)}
.cellb.ph{color:var(--text2)}
.cellb.act{box-shadow:inset 0 0 0 2px var(--blue);background:var(--card)}

.tr.done .cellb{background:transparent;color:var(--text2)}
em.pp{font-style:normal;font-size:13px;color:var(--teal);margin-left:1px}
.cell{position:relative}
.cell .rir{position:absolute;right:-6px;bottom:-6px}
body.kpon #page{padding-bottom:360px}

.kp-top{min-height:44px;display:flex;align-items:center;justify-content:center;padding:0 4px 8px}

.rir.rq{background:var(--chip);color:var(--text)}
.kp-grid{display:grid;grid-template-columns:1fr 1fr 1fr 0.9fr;gap:7px}

.kp-grid .kk svg{width:26px;height:26px}
.kp-grid .ks{height:52px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:16px;font-weight:600;text-align:center}

.kp-grid .ks.go{background:var(--inv);color:var(--invtext)}
/* countdown: long bar like the real thing */
.lg-bar > span[style]{display:none}
.restw{flex:1;justify-content:flex-end;margin-left:auto;max-width:60%}
.restw .rbar{flex:1;max-width:none;height:26px;border-radius:8px}
.restw .rbar b{background:var(--text)}
.restw.on{color:var(--text)}
.restw.done .rbar b{background:var(--green)}
/* dashboard cards: divider above the number */
.ic .v{border-top:1px solid var(--line);padding-top:10px;margin-top:8px}

/* ===== v3.3 ===== */
body::before{display:none}
.gfield{font:inherit;color:var(--text)}
.gfield.act{box-shadow:inset 0 0 0 2px var(--blue)!important}
.fin.gfield{width:100%;justify-content:space-between;text-align:left}
.fin .gv{font-size:18px}
.fin .gv.ph{color:var(--text3)}
.kv .fin.gfield{width:120px;height:42px}
.wbox{width:110px;height:48px;border-radius:12px;background:var(--chip);font-size:20px;font-weight:500;color:var(--text);display:grid;place-items:center;flex:none}
.wbox.act{background:var(--card)}
.tin.gfield{display:grid;place-items:center}
.kp.gp{z-index:58}
body.gpon .sheet .sbody{padding-bottom:350px}
body.gpon #main{padding-bottom:420px}
.kp-info b{color:var(--text);font-weight:600}

/* ===== v3.4 ===== */
/* hidden panels sit fully off screen and are invisible (no peeking at the bottom) */
.dlg .dc{transform:translateY(calc(100% + var(--sab) + 80px))}
.dlg:not(.on) .dc{visibility:hidden;transition:transform .35s var(--ease),visibility 0s .35s}
.kp{transform:translateY(calc(100% + 60px))}
.kp:not(.on){visibility:hidden;transition:transform .28s var(--ease),visibility 0s .28s}
.sheet{transform:translateY(calc(100% + 60px))}
.sheet:not(.on){visibility:hidden;transition:transform .42s var(--ease),visibility 0s .42s}
/* header same colour as the status bar: no second band at the top */
.head{background:var(--bg)}
/* tab bar sits lower, like the real app */
#tabs{padding:6px 6px max(6px, calc(var(--sab) - 16px))}
#mini{bottom:calc(max(6px, var(--sab) - 16px) + 74px)}
#main{padding-bottom:calc(var(--sab) + 100px)}
#page .body-pad{padding-bottom:calc(var(--sab) + 40px)}
/* ticks centred in every box */
.fixrow .cb,.wrow .cb,span.cb{display:grid!important;place-items:center;margin-top:0;padding:0}
.cb svg{display:block}
.fixrow .cb{width:26px;height:26px}
.st.done .thumb.word{color:transparent}
.auto{white-space:nowrap}

/* ===== v3.5: roomy keypad, closed panels removed completely ===== */
.kp{padding:12px 10px calc(var(--sab) + 10px)}
.kp-top{min-height:48px;padding:0 6px 10px}
.kp-grid{grid-template-columns:repeat(3,1fr) 1.15fr;gap:8px}
.kp-grid .kk{height:56px;border-radius:12px;background:var(--card2);font-size:26px}
.kp-grid .kk:active{background:var(--chip)}
.kp-grid span.kk{background:transparent}
.kp-grid .kk.zero{grid-column:span 2}
.kp-grid .ks{height:56px;border-radius:12px}
.kp-grid .ks.del svg{width:28px;height:28px}
.kp-grid .ks.fp button{font-size:14px}
.kp-rir .rir{width:38px;height:38px;font-size:16px}
html[data-theme="light"] .kp-grid .kk{background:#ececf0}
body.kpon #page{padding-bottom:420px}
/* a closed pop-up is not drawn at all, so nothing can peek at the bottom */
.dlg:not(.on){display:none}
.dlg.on .dc{animation:dcIn .32s var(--ease)}
@keyframes dcIn{from{transform:translateY(110%)}to{transform:none}}
.kp:not(.on){display:none}
.kp.on{animation:kpIn .26s var(--ease)}
@keyframes kpIn{from{transform:translateY(100%)}to{transform:none}}

/* ===== v3.6: floating glass bars like Apple Music ===== */
:root{--glass:rgba(40,40,42,.72);--glassline:rgba(255,255,255,.09);--barb:max(10px, calc(var(--sab) - 8px))}
html[data-theme="light"]{--glass:rgba(250,250,250,.78);--glassline:rgba(0,0,0,.08)}
#tabs{display:flex;justify-content:space-around;align-items:center;left:12px;right:12px;bottom:var(--barb);height:64px;padding:0 6px;border-radius:32px;
  background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  box-shadow:inset 0 0 0 1px var(--glassline),0 8px 30px rgba(0,0,0,.35);transition:left .38s var(--ease),right .38s var(--ease),background .3s,box-shadow .3s}
#tabs button{flex:1;height:56px;justify-content:center;border-radius:28px;transition:flex .38s var(--ease),opacity .2s,background .3s}
#tabs button.on:not(.plus){background:rgba(255,255,255,.07)}
html[data-theme="light"] #tabs button.on:not(.plus){background:rgba(0,0,0,.05)}
#tabs .plus{flex:none;width:48px;height:48px;margin:0 4px}
#mini{left:12px;right:12px;bottom:calc(var(--barb) + 72px);height:56px;border-radius:28px;padding:6px 6px 6px 18px;
  background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  box-shadow:inset 0 0 0 1px var(--glassline),0 8px 30px rgba(0,0,0,.35);transition:left .38s var(--ease),right .38s var(--ease),bottom .38s var(--ease)}
#mini .mb{width:44px;height:44px;background:transparent}
#mini .thumb{width:30px;height:38px}
#main{padding-bottom:calc(var(--barb) + 96px)}
body.hasmini #main{padding-bottom:calc(var(--barb) + 170px)}

/* ===== v3.7: Apple Music fold, transforms only ===== */
:root{--barb:max(8px, calc(var(--sab) - 14px));--fold:.46s cubic-bezier(.32,.72,0,1)}
#tabs{background:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;left:12px;right:12px;transition:none}
#tabs .tbg{position:absolute;inset:0;border-radius:32px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  box-shadow:inset 0 0 0 1px var(--glassline),0 8px 30px rgba(0,0,0,.35);clip-path:inset(0 0 0 0 round 32px);transition:clip-path var(--fold);pointer-events:none;will-change:clip-path}
#tabs > button{position:relative;z-index:1;transition:transform var(--fold),opacity .24s ease,background .3s;will-change:transform}
#tabs > button span.lb,#tabs > button{font-size:11px}
#mini{transition:transform var(--fold),left var(--fold),right var(--fold);will-change:transform}
#mini .mth{transition:opacity .2s}
/* folded */
body.compact #tabs .tbg{clip-path:inset(0 var(--cw, 300px) 0 0 round 32px)}
body.compact #tabs > button:not(.on):not(.plus){opacity:0;transform:scale(.85);pointer-events:none}
body.compact #tabs > button.on:not(.plus){transform:translateX(var(--dxl,0px));background:transparent;color:transparent}
body.compact #tabs > button.on:not(.plus) svg{color:var(--text);transform:translateY(7px);transition:transform var(--fold)}
body.compact #tabs > .plus{transform:translateX(var(--dxr,0px)) scale(1.08)}
body.compact #mini{left:80px;right:80px;transform:translateY(68px)}
body.compact #mini .mth{opacity:0}
#tabs > button.on:not(.plus) svg{transition:transform var(--fold)}
/* All Workouts switch slides, rings fade */
.seg.slide{position:relative}
.seg.slide .thumbx{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--inv);transition:transform .34s cubic-bezier(.32,.72,0,1)}
.seg.slide.right .thumbx{transform:translateX(100%)}
.seg.slide button{position:relative;z-index:1;background:transparent!important;flex:1;transition:color .25s}
.seg.slide button.on{color:var(--invtext)}
#rings{transition:opacity .16s ease}
#rings.swap{opacity:0}
.seg.slide{display:grid;grid-template-columns:1fr 1fr;padding:3px}
.seg.slide button{min-width:134px}
.seg.slide .thumbx{top:3px;bottom:3px;left:3px;width:calc(50% - 3px)}
.seg.slide button{text-align:center;justify-content:center;display:flex;align-items:center}

</style>
</head>
<body>
<div id="main" class="scr"></div>
<div id="page" class="scr"></div>

<div id="mini" hidden></div>
<nav id="tabs"><div class="tbg"></div>
<button data-a="tab" data-tab="dashboard" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="9" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="5" rx="1.2"/><rect x="4" y="15.5" width="6.5" height="4.5" rx="1.2"/><rect x="13.5" y="11.5" width="6.5" height="8.5" rx="1.2"/></svg>Dashboard</button>
<button data-a="tab" data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.3 14.6l3.1 3.1M14.6 6.3l3.1 3.1M9.4 14.6l5.2-5.2M4.1 16.8l3.1 3.1M16.8 4.1l3.1 3.1M5.2 12.5l6.3 6.3M12.5 5.2l6.3 6.3"/></svg>Workout</button>
<button data-a="plusMenu" class="plus" aria-label="Quick add"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
<button data-a="tab" data-tab="levels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 2.2 4.5 5.6 4.3 10.2L14.5 16h-5l-1.8-2.8C7.5 8.6 9 5.2 12 3z"/><circle cx="12" cy="9.5" r="1.6"/><path d="M8 13.5l-2.5 2.2.7 3.3 2.8-2M16 13.5l2.5 2.2-.7 3.3-2.8-2"/></svg>Levels</button>
<button data-a="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="8.3" cy="12" r=".7" fill="currentColor"/><circle cx="12" cy="12" r=".7" fill="currentColor"/><circle cx="15.7" cy="12" r=".7" fill="currentColor"/></svg>More</button>

<div class="kp" id="kp"></div>

<div class="dlg" id="dlg"><div class="dbg" data-a="closeDialog"></div><div class="dc"><div class="dh"><h3></h3><button class="x" data-a="closeDialog" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="db"></div></div></div>
<div id="toast" class="toast"></div>

<script>
// ---------------------------------------------------------------------------
// Everything NitFit knows before Nit touches it: his gym's exercises, his
// week, the back fix, the cool downs and his day. Locked 20 Nov 2026.
// Smallest jump on anything in his gym is 2.5 kg.
// ---------------------------------------------------------------------------

// id, n name, m main muscle, eq kit, kind c compound / i isolation / core,
// r default rep range, rest seconds, cue one line on how to do it well.
// bw = bodyweight, t = timed in seconds.
const EXERCISES = [
  // ----- legs -----
  { id: "squat", n: "Back squat", m: "Quads", eq: "bb", kind: "c", r: [6, 8], rest: 180, cue: "Brace hard before you go down. Knees follow the toes, chest up. Start light." },
  { id: "smith_squat", n: "Smith squat", m: "Quads", eq: "smith", kind: "c", r: [8, 12], rest: 150, cue: "Feet a step in front of the bar. Easier on the lower back than a free squat." },
  { id: "leg_press", n: "Leg press", m: "Quads", eq: "machine", kind: "c", r: [10, 12], rest: 150, cue: "Feet in the middle. Never let your lower back peel off the pad at the bottom." },
  { id: "leg_press_high", n: "Leg press, feet high and wide", m: "Glutes", eq: "machine", kind: "c", r: [10, 12], rest: 150, cue: "Feet high and wide on the plate. Push through the heels. Hits glutes and hamstrings." },
  { id: "bulgarian", n: "Dumbbell Bulgarian split squat", m: "Quads", eq: "db", kind: "c", r: [8, 10], rest: 120, each: 1, cue: "Back foot on the bench. Go straight down. Weight is per dumbbell, reps per leg." },
  { id: "leg_ext", n: "Leg extension", m: "Quads", eq: "machine", kind: "i", r: [12, 15], rest: 75, cue: "Pause and squeeze at the top for a second. Lower slowly." },
  { id: "leg_curl", n: "Leg curl", m: "Hamstrings", eq: "machine", kind: "i", r: [10, 12], rest: 75, cue: "Hips stay down on the pad. Slow on the way back." },
  { id: "rdl", n: "Romanian deadlift", m: "Hamstrings", eq: "bb", kind: "c", r: [8, 10], rest: 150, cue: "Push your hips back, bar close to your legs. Stop when your back wants to round." },
  { id: "good_morning", n: "Seated good morning", m: "Lower back", eq: "bb", kind: "i", r: [12, 12], rest: 75, cue: "Sit on the bench end, light bar on your back. Lean forward with a flat back, then sit tall. Keep it light." },
  { id: "hip_thrust", n: "Hip thrust (machine)", m: "Glutes", eq: "machine", kind: "c", r: [8, 12], rest: 120, cue: "Chin tucked, ribs down. Squeeze hard at the top for a second." },
  { id: "abductor", n: "Hip abductor", m: "Glutes", eq: "machine", kind: "i", r: [15, 20], rest: 60, cue: "Lean forward a little. Slow on the way back in." },
  { id: "calf_standing", n: "Standing calf raise", m: "Calves", eq: "machine", kind: "i", r: [10, 15], rest: 75, cue: "Full stretch at the bottom, 2 second hold at the top. No bouncing." },
  { id: "calf_seated", n: "Seated calf raise", m: "Calves", eq: "machine", kind: "i", r: [12, 20], rest: 60, cue: "Hits the lower calf. Slow, and all the way down on every rep." },
  { id: "back_ext", n: "Hyperextension", m: "Lower back", eq: "bw", kind: "i", r: [12, 15], rest: 75, cue: "Rise until your body is straight, not past it. Slow and controlled." },
  { id: "lunge", n: "Dumbbell walking lunge", m: "Quads", eq: "db", kind: "c", r: [10, 12], rest: 120, each: 1, cue: "Long steps, upright chest. Reps per leg." },

  // ----- neck -----
  { id: "neck_flex", n: "Neck flexion", m: "Neck", eq: "plate", kind: "i", r: [15, 15], rest: 60, cue: "Face up on a bench, head off the end, light plate on your forehead over a towel. Slow, small range." },
  { id: "neck_side", n: "Side neck raise", m: "Neck", eq: "plate", kind: "i", r: [15, 15], rest: 60, each: 1, cue: "Lie on your side, head off the bench, light plate on the side of your head. Each side." },

  // ----- chest -----
  { id: "inc_smith_press", n: "Incline Smith press", m: "Chest", eq: "smith", kind: "c", r: [6, 10], rest: 150, cue: "Bench at 30 degrees. Touch just below the collarbone. No bouncing." },
  { id: "inc_db_press", n: "Incline dumbbell press", m: "Chest", eq: "db", kind: "c", r: [6, 10], rest: 150, cue: "Bench at 30 degrees. Elbows about 45 degrees from your body. Weight is per dumbbell." },
  { id: "flat_db_press", n: "Flat dumbbell press", m: "Chest", eq: "db", kind: "c", r: [8, 12], rest: 150, cue: "Shoulder blades pulled back and down into the bench the whole set." },
  { id: "mach_inc_press", n: "Machine incline press", m: "Chest", eq: "machine", kind: "c", r: [8, 12], rest: 120, cue: "Seat so the handles start at upper chest height. Control the way back." },
  { id: "mach_inc_fly", n: "Machine incline fly", m: "Chest", eq: "machine", kind: "i", r: [12, 15], rest: 75, cue: "Soft elbows. Squeeze for a second where the hands meet." },
  { id: "cable_fly_low", n: "Low-to-high cable fly", m: "Chest", eq: "cable", kind: "i", r: [12, 15], rest: 75, cue: "Pulleys at the bottom, hands finish at chin height. This is the upper chest." },
  { id: "pec_deck", n: "Pec deck", m: "Chest", eq: "machine", kind: "i", r: [12, 15], rest: 75, cue: "Squeeze for a full second in the middle. Do not slam the pads." },
  { id: "flat_smith", n: "Flat Smith press", m: "Chest", eq: "smith", kind: "c", r: [6, 10], rest: 150, cue: "Bar to the nipple line. Shoulder blades squeezed back." },
  { id: "dip", n: "Dips", m: "Chest", eq: "bw", kind: "c", r: [6, 12], rest: 150, cue: "Lean forward for chest. Stop when the upper arm is level." },
  { id: "pushup", n: "Push-ups", m: "Chest", eq: "bw", kind: "c", r: [12, 30], rest: 90, cue: "Body in one straight line. Hips do not sag." },

  // ----- arms -----
  { id: "preacher_curl", n: "Preacher curl", m: "Biceps", eq: "db", kind: "i", r: [10, 14], rest: 75, cue: "Armpits on the top of the pad. Don't fully lock out at the bottom." },
  { id: "incline_curl", n: "Incline dumbbell curl", m: "Biceps", eq: "db", kind: "i", r: [10, 15], rest: 75, cue: "Bench at 45, arms hanging behind you. The biggest stretch of any curl." },
  { id: "db_curl", n: "Dumbbell curl", m: "Biceps", eq: "db", kind: "i", r: [10, 14], rest: 75, cue: "Elbows still at your sides. Lower slowly, that half builds the arm." },
  { id: "rope_hammer", n: "Rope hammer curl", m: "Biceps", eq: "cable", kind: "i", r: [12, 15], rest: 75, cue: "Rope on the low pulley, thumbs up the whole way. Builds arm thickness." },
  { id: "cable_curl", n: "Cable curl", m: "Biceps", eq: "cable", kind: "i", r: [12, 15], rest: 75, cue: "Tension never drops. Stop just short of the top." },
  { id: "hammer_curl", n: "Hammer curl", m: "Biceps", eq: "db", kind: "i", r: [10, 14], rest: 75, cue: "Thumbs up the whole way." },
  { id: "tri_overhead", n: "Overhead cable triceps extension", m: "Triceps", eq: "cable", kind: "i", r: [10, 14], rest: 75, cue: "Face away from the cable. Get a full stretch behind your head." },
  { id: "tri_pushdown", n: "Cable pushdown", m: "Triceps", eq: "cable", kind: "i", r: [10, 15], rest: 75, cue: "Elbows pinned to your sides. Only the forearm moves." },
  { id: "rope_pushdown", n: "Rope pushdown", m: "Triceps", eq: "cable", kind: "i", r: [12, 15], rest: 75, cue: "Spread the rope apart at the bottom. Elbows stay pinned." },
  { id: "skullcrusher", n: "Dumbbell skullcrusher", m: "Triceps", eq: "db", kind: "i", r: [10, 14], rest: 75, cue: "Lower behind your head, not to your face. Elbows point up." },
  { id: "reverse_curl", n: "Reverse curl", m: "Forearms", eq: "db", kind: "i", r: [12, 15], rest: 60, cue: "Palms down. Go lighter than you think." },
  { id: "wrist_curl", n: "Wrist curl", m: "Forearms", eq: "db", kind: "i", r: [15, 20], rest: 60, cue: "Forearms on your thighs. Small movement." },

  // ----- back -----
  { id: "pullup", n: "Pull-ups", m: "Lats", eq: "bw", kind: "c", r: [6, 12], rest: 180, cue: "Dead hang at the bottom, chin clearly over the bar. Tag a set Cheated if you kipped." },
  { id: "chinup", n: "Chin-ups", m: "Lats", eq: "bw", kind: "c", r: [6, 12], rest: 180, cue: "Palms facing you. Dead hang at the bottom." },
  { id: "pulldown", n: "Lat pulldown", m: "Lats", eq: "cable", kind: "c", r: [6, 10], rest: 120, cue: "Bar to the top of your chest. Drive the elbows down, not back." },
  { id: "pulldown_close", n: "Close grip pulldown", m: "Lats", eq: "cable", kind: "c", r: [8, 12], rest: 120, cue: "Neutral grip. Lean back a touch, pull to the bottom of your chest." },
  { id: "rope_pullover", n: "Rope pullover", m: "Lats", eq: "cable", kind: "i", r: [10, 15], rest: 75, cue: "High pulley, arms almost straight. Sweep the rope to your thighs with control. Not heavy." },
  { id: "chest_sup_row", n: "Chest-supported row", m: "Upper back", eq: "db", kind: "c", r: [8, 12], rest: 120, cue: "Face down on the incline bench. Zero strain on your lower back." },
  { id: "cable_row", n: "Seated cable row, neutral grip", m: "Upper back", eq: "cable", kind: "c", r: [8, 12], rest: 120, cue: "Chest up, pull to your belly button. No rocking." },
  { id: "db_row", n: "One-arm dumbbell row", m: "Upper back", eq: "db", kind: "c", r: [8, 12], rest: 120, cue: "Knee and hand on the bench, flat back, pull to your hip." },
  { id: "straight_arm", n: "Straight-arm pulldown", m: "Lats", eq: "cable", kind: "i", r: [12, 15], rest: 75, cue: "Arms almost locked. Sweep the bar to your thighs." },
  { id: "y_raise", n: "Y-raise", m: "Upper back", eq: "db", kind: "i", r: [12, 15], rest: 60, cue: "Face down on the incline bench, light dumbbells, raise in a Y shape. Feel the middle back." },
  { id: "shrug", n: "Dumbbell shrug", m: "Traps", eq: "db", kind: "i", r: [10, 15], rest: 75, cue: "Straight up and down. No rolling." },

  // ----- shoulders -----
  { id: "cable_ohp_1arm", n: "One-arm cable shoulder press", m: "Shoulders", eq: "cable", kind: "c", r: [8, 12], rest: 90, each: 1, cue: "Low pulley, handle at your shoulder, press straight up. Each arm." },
  { id: "bb_ohp", n: "Barbell overhead press", m: "Shoulders", eq: "bb", kind: "c", r: [6, 10], rest: 150, cue: "Squeeze your bum and keep your ribs down so your lower back doesn't arch." },
  { id: "db_ohp", n: "Seated dumbbell shoulder press", m: "Shoulders", eq: "db", kind: "c", r: [8, 10], rest: 120, cue: "Back flat on the bench. Weight is per dumbbell." },
  { id: "cable_lat_raise", n: "Cable lateral raise (cuff)", m: "Side delts", eq: "cable", kind: "i", r: [12, 15], rest: 60, each: 1, cue: "Cuff on the wrist, cable behind you. Lead with the elbow. Each arm." },
  { id: "db_lat_raise", n: "Dumbbell lateral raise", m: "Side delts", eq: "db", kind: "i", r: [12, 20], rest: 60, cue: "Lead with the elbow, stop at shoulder height. No swinging." },
  { id: "rev_pec_deck", n: "Reverse pec deck", m: "Rear delts", eq: "machine", kind: "i", r: [12, 20], rest: 60, cue: "Face the pad. Push out with the back of the shoulder, not by squeezing the shoulder blades." },
  { id: "face_pull", n: "Face pull", m: "Rear delts", eq: "cable", kind: "i", r: [15, 20], rest: 60, cue: "Rope to your forehead, knuckles to the ceiling. This keeps your shoulders back." },

  // ----- core -----
  { id: "plank", n: "Plank", m: "Core", eq: "bw", kind: "core", t: 1, r: [30, 60], rest: 60, cue: "Squeeze the glutes, ribs tucked." },
  { id: "hang_leg_raise", n: "Hanging leg raise", m: "Core", eq: "bw", kind: "core", r: [8, 15], rest: 75, cue: "Curl the hips up, don't just swing the legs." },
  { id: "cable_crunch", n: "Cable crunch", m: "Core", eq: "cable", kind: "core", r: [12, 18], rest: 75, cue: "Round your spine down. Hips don't move." },
];

// level: 0..1 for each muscle (0 = untrained). opts: {side, crop, only: [muscles] , theme}
function bodySvg(side, level, opts) {
  opts = opts || {};
  const dark = document.documentElement.dataset.theme !== "light";
  const skin = dark ? "#3a3a3c" : "#d9d9de", off = dark ? "#505054" : "#c3c3ca", line = dark ? "#1c1c1e" : "#f7f7f5";
  const blue = v => { const t = Math.max(0, Math.min(1, v)); const a = [37, 72, 160], b = [79, 140, 255]; return "rgb(" + a.map((x, i) => Math.round(x + (b[i] - x) * t)).join(",") + ")"; };
  const fill = m => { if (opts.only) return opts.only.includes(m) ? "#3b7bff" : off; const v = level ? level[m] || 0 : 0; return v > 0 ? blue(v) : off; };
  const parts = BODY[side].map(p => '<path d="' + p.d + '" fill="' + fill(p.m === "Tibialis" || p.m === "Serratus" ? "-" : p.m) + '" stroke="' + line + '" stroke-width="1.6" stroke-linejoin="round"/>').join("");
  const half = '<path d="' + BODY.base[side] + '" fill="' + skin + '"/>' + parts;
  const head = '<ellipse cx="100" cy="30" rx="16" ry="22" fill="' + skin + '"/>';
  const vb = opts.crop ? CROP[opts.crop] : CROP.full;

const kgTxt = k => (Math.round(k * 100) / 100).toString();
function snap(kg, step, dir) {
  if (!step) return Math.max(0, Math.round(kg * 2) / 2);
  const f = dir < 0 ? Math.floor : dir > 0 ? Math.ceil : Math.round;
  return Math.max(step, f(kg / step + (dir ? 0 : 1e-9)) * step);
}

const fill = (n, v) => Array.from({ length: n }, () => v);

  const t = coachCore(ex, hist, ctx);
  if (ctx.light && t.kg != null) t.reason = "Light pump. Stop 2 to 3 reps short of failure. " + t.reason;
  if (ctx.easy && t.tag !== "new") t.reason = "Easy week: keep 3 to 4 reps in the tank. " + t.reason;
  if (ctx.easy && t.tag === "new") t.reason = t.reason.replace("with 2 left in the tank", "with 3 to 4 left in the tank");

}
function coachCore(ex, hist, ctx) {
  const lo = ex.r[0], hi = ex.r[1], step = ex.step || 0, n = ctx.sets || 3, u = unit(ex);

      : "First time. Pick a weight you can lift about " + Math.round((lo + hi) / 2) + " times with 2 left in the tank. Log what you really did." };
  }
  const last = hist[hist.length - 1];
  const kg = last.sets[0].kg || 0;
  let r = last.sets.map(s => s.reps);
  while (r.length < n) r.push(r[r.length - 1]);
  r = r.slice(0, n);

  const bw = !kg;
  const down = pct => { if (bw) return kg; let nk = snap(kg * (1 - pct), step, 0); if (nk >= kg) nk = kg - step; return Math.max(step || 0, nk); };

  if (ctx.deload) {
    return { kg, reps: fill(Math.ceil(n / 2), lo), sets: Math.ceil(n / 2), tag: "easy", reason: "Easy week. Half the sets, same weight. Stop 3 reps before failure. This is how you come back stronger." };
  }

    return { kg: down(0.2), reps: fill(s, bw ? Math.max(1, Math.round(r[0] * 0.8)) : lo), sets: s, tag: "back", reason: "You were away " + ctx.gap + " days. 20% lighter and fewer sets this week. Build back." };
  }

  }
  if (ctx.flags >= 2) {
    const s = Math.max(1, n - 1);
    return { kg, reps: r.slice(0, s), sets: s, tag: "hold", reason: "Bad sleep and low energy. One set less, same weight, no records today. " + lastTxt };
  }

// ----- charts -----
function lineChart(pts) {
  const W = 340, H = 140, pl = 4, pr = 34, pt = 8, pb = 20;
  let vs = pts.map(p => p.v).concat(pts.filter(p => p.raw != null).map(p => p.raw)), lo = Math.min(...vs), hi = Math.max(...vs);
  if (hi - lo < 1) { lo -= 0.5; hi += 0.5; } const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
  const t0 = dayNum(pts[0].d), t1 = Math.max(t0 + 1, dayNum(pts[pts.length - 1].d));
  const X = d => pl + (dayNum(d) - t0) / (t1 - t0) * (W - pl - pr), Y = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  const P = pts.map(p => [X(p.d), Y(p.v)]);
  let d = "M" + P[0][0].toFixed(1) + " " + P[0][1].toFixed(1);
  for (let i = 1; i < P.length; i++) { const a = P[i - 2] || P[i - 1], b = P[i - 1], c = P[i], e = P[i + 1] || c; d += " C" + (b[0] + (c[0] - a[0]) / 6).toFixed(1) + " " + (b[1] + (c[1] - a[1]) / 6).toFixed(1) + " " + (c[0] - (e[0] - b[0]) / 6).toFixed(1) + " " + (c[1] - (e[1] - b[1]) / 6).toFixed(1) + " " + c[0].toFixed(1) + " " + c[1].toFixed(1); }
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">';
  [hi - pad, lo + pad].forEach(v => { s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="var(--line)" stroke-dasharray="2 4"/><text x="' + (W - pr + 6) + '" y="' + (Y(v) + 4).toFixed(1) + '">' + Math.round(v * 10) / 10 + "</text>"; });
  pts.forEach(p => { if (p.raw != null) s += '<circle cx="' + X(p.d).toFixed(1) + '" cy="' + Y(p.raw).toFixed(1) + '" r="2" fill="var(--text3)"/>'; });
  s += '<path d="' + d + '" fill="none" stroke="var(--blue)" stroke-width="2.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
  s += '<text x="' + pl + '" y="' + (H - 3) + '">' + niceDate(pts[0].d) + '</text><text x="' + (W - pr) + '" y="' + (H - 3) + '" text-anchor="end">' + niceDate(pts[pts.length - 1].d) + "</text>";
  return s + "</svg>";
}

  let h = nav("Workouts") + ptabs(key, ["Sets", "Volume"]) + '<div class="body-pad">';
  h += statHead(["Average " + tab, used ? fmtNum(tot / used) : "--", tab === "Sets" ? "sets" : "kg"], ["Total " + tab, fmtNum(tot), tab === "Sets" ? "sets" : "kg"], fmtRange(R.from, R.to));

  h += "<h2>Recent Workouts</h2>" + (sessionsSorted().filter(x => x.endTs).length ? '<div class="card">' + sessionsSorted().filter(x => x.endTs).reverse().slice(0, 10).map(x => '<button class="opt" data-a="viewSession" data-id="' + x.id + '"><div class="m"><b>' + esc(x.name) + "</b><span>" + niceDate(x.d) + " · " + sessionSets(x.id).length + " sets</span></div>" + I.chev + "</button>").join("") + "</div>" : '<p class="hint">No workouts yet.</p>');

const fmtNum = v => v >= 1000 ? Math.round(v).toLocaleString() : (Math.round(v * 10) / 10).toString();

function vExercise(id) {

function vExList() {

}

// weight
function slopePerWeek(tr) { const l = tr.slice(-21); if (l.length < 2) return null; const span = daysBetween(l[0].d, l[l.length - 1].d) || 1; return (l[l.length - 1].trend - l[0].trend) / span * 7; }
function vWTrend() {
  const key = "wtrend", wl = weightList(), tr = trendSeries(wl), R = rangeOf(key, (wl[0] || {}).d, "1M"), inR = tr.filter(x => x.d >= R.from && x.d <= R.to);

  const cur = tr.length ? tr[tr.length - 1] : null, wk = slopePerWeek(tr);
  h += '<h2>Insights &amp; Data</h2><div class="card"><div class="wch"><b>Weight Changes</b>' + [3, 7, 14, 30, 90].map(n => { const old = tr.find(x => x.d >= addDays(today(), -n)); const ok = cur && tr.length && tr[0].d <= addDays(today(), -n) && old; const dv = ok ? cur.trend - old.trend : null; return '<div class="wcr"><span>' + n + '-day</span><b>' + (ok ? sgn(dv) + " kg" : "-- kg") + '</b><em class="' + (ok ? (Math.abs(dv) < 0.15 ? "st" : dv > 0 ? "up" : "dn") : "wt") + '">' + (ok ? (Math.abs(dv) < 0.15 ? "Steady" : dv > 0 ? "Gaining" : "Losing") : "Waiting") + "</em></div>"; }).join("") + "</div></div>";
  const box = (v, u, t, p) => '<div class="ibox"><div class="bx"><b>' + v + "</b><span>" + u + "</span></div><div><b>" + t + "</b><p>" + p + "</p></div></div>";
  h += '<div class="card" style="margin-top:12px">' + box(cur ? cur.trend.toFixed(1) : "--", "kg", "Current Weight", "Your true weight right now, with the daily ups and downs taken out.")
    + box(wk == null ? "--" : sgn(wk), "kg per week", "Weekly Weight Change", "How fast your trend moved over the last three weeks.")
    + box(wk == null ? "--" : Math.round(wk * 7700 / 7), "kcal per day", "Energy Balance", "Roughly how many calories above (plus) or below (minus) what you burn, worked out from your weight.")
    + box(cur && wk != null ? (cur.trend + wk * 30 / 7).toFixed(1) : "--", "kg", "30-Day Projection", "Where your weight lands in 30 days if this pace holds. Goal: 68 kg.") + "</div>";
  h += '<h2>Data Sources</h2><div class="card">' + optRow(I.scale, "Scale Weight", "Manage data", "openPage", ' data-k="scale"', "chev") + "</div>";
  return h + "</div>";
}
const sgn = v => (v > 0 ? "+" : "") + v.toFixed(2).replace(/0$/, "");
function vScale(store) {
  const w = store === "weights", key = store, list = Object.values(S[store]).sort((a, b) => a.d < b.d ? -1 : 1), val = x => w ? x.kg : x.inch, unit = w ? "kg" : "in";
  const R = rangeOf(key, (list[0] || {}).d, "1M"), inR = list.filter(x => x.d >= R.from && x.d <= R.to);
  let h = nav(w ? "Scale Weight" : "Waist", '<span class="navr"><button class="ib plain" data-a="weightSheet" aria-label="Add">' + I.plus + "</button></span>") + '<div class="body-pad">';
  h += statHead(["Average", inR.length ? (inR.reduce((a, x) => a + val(x), 0) / inR.length).toFixed(1) : "--", unit], ["Difference", inR.length > 1 ? sgn(val(inR[inR.length - 1]) - val(inR[0])) : "0.0", unit], fmtRange(R.from, R.to));
  h += '<div class="chart lg">' + (inR.length > 1 ? lineChart(inR.map(x => ({ d: x.d, v: val(x) }))) : emptyLine(R.from, R.to)) + "</div>" + rangeRow(key, "1M") + legend([[w ? "Scale Weight" : "Waist", "var(--green)", "line"]]);
  h += w ? tip("scale", "Same time, same way", "Weigh yourself right after waking and peeing, before food and water. Same scale, same spot on the floor.") : tip("waist", "Measuring your waist", "Saturday mornings, tape level at the belly button, breathe out normally and don't suck in.");
  const by = {}; list.slice().reverse().forEach(x => (by[x.d.slice(0, 7)] = by[x.d.slice(0, 7)] || []).push(x));

function vHabit(kind) {

  if (w) { let x = S.weights[d] ? d : addDays(d, -1); while (S.weights[x]) { streak++; x = addDays(x, -1); } }
  else { let x = weekSun(d); if (![0, 1, 2, 3, 4, 5, 6].some(i => doneOn(addDays(x, i)))) x = addDays(x, -7); while ([0, 1, 2, 3, 4, 5, 6].some(i => doneOn(addDays(x, i)))) { streak++; x = addDays(x, -7); } }

  h += '</div><div class="ym">' + MONTHS_LONG.map(x => "<span>" + x.slice(0, 1) + "</span>").join("") + "</div></div>";

ACT.hMonth = el => { CALM2[el.dataset.k] = el.dataset.v; renderPage(true); };
ACT.habitDay = el => {
  const x = el.dataset.d;
  if (el.dataset.k === "weights") return entrySheet(x);
  const s2 = sessionsSorted().filter(q => q.d === x && q.endTs); if (s2.length) return ACT.viewSession({ dataset: { id: s2[s2.length - 1].id } });
  const dk = dayKeyFor(x); toast(dk ? DAYS[dk].name + (x > today() ? " is planned" : " was not logged") : "Rest day");
};

// iOS 26 bug: after the iPhone keyboard closes, a home-screen app can stay shrunk with a dead band at the bottom.
// Hiding and showing the full-height screens for one frame makes iOS measure the screen again.
let MAXH = window.innerHeight;
window.addEventListener("resize", () => { MAXH = Math.max(MAXH, window.innerHeight); });
function healViewport(force) {
  const a = document.activeElement; if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) return;
  window.scrollTo(0, 0);
  if (!force && window.innerHeight >= MAXH - 4) return;
  const els = [$("#main"), $("#page")], ys = els.map(e => e.scrollTop);
  els.forEach(e => { e.style.display = "none"; }); void document.body.offsetHeight;
  els.forEach((e, i) => { e.style.display = ""; e.scrollTop = ys[i]; });
}
document.addEventListener("focusout", e => { if (e.target && e.target.tagName === "INPUT") { setTimeout(healViewport, 150); setTimeout(healViewport, 600); } });
if (window.visualViewport) visualViewport.addEventListener("resize", () => setTimeout(healViewport, 120));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") setTimeout(() => healViewport(true), 200); });
// Apple Music style: scroll down and the tab bar folds into one round button with the workout player beside it.
// Everything moves with transforms only, so it stays smooth, and it needs a real swipe (not a jitter) to switch.
let LASTY = 0, ACC = 0, FOLDLOCK = 0;
function measureTabs() {
  const t = $("#tabs"); if (!t) return; const W = t.clientWidth, R = t.getBoundingClientRect();
  t.style.setProperty("--cw", Math.max(0, W - 64) + "px");
  $$("#tabs > button").forEach(b => { const r = b.getBoundingClientRect(), c = r.left - R.left + r.width / 2; b.style.setProperty("--dxl", (32 - c) + "px"); b.style.setProperty("--dxr", (W - 32 - c) + "px"); });
}
function setFold(on) {
  if (document.body.classList.contains("compact") === on) return;
  if (on) measureTabs(); document.body.classList.toggle("compact", on); FOLDLOCK = Date.now() + 420;
}
function bindCompact() {
  const m = $("#main");
  m.addEventListener("scroll", () => {
    const y = m.scrollTop, dy = y - LASTY; LASTY = y;
    if (y < 40) { ACC = 0; return setFold(false); }
    ACC = (ACC > 0) === (dy > 0) ? ACC + dy : dy;
    if (Date.now() < FOLDLOCK) return;
    if (ACC > 36) setFold(true); else if (ACC < -48) setFold(false);
  }, { passive: true });
  window.addEventListener("resize", () => { if (document.body.classList.contains("compact")) measureTabs(); });
}
ACT.expandTabs = () => setFold(false);
// ----- boot -----
async function boot() {
  try { await coreBoot(); } catch (e) { $("#main").innerHTML = '<div class="head"><div class="title">NitFit</div></div><p class="hint" style="padding:20px">NitFit could not open its storage. Close it and open it again.</p>'; return; }
  applyTheme(); render(); bindCompact();
  try { const r = JSON.parse(localStorage.getItem("nitfit:rest") || "null"); if (r && r.end > Date.now()) { REST = r; restIv = setInterval(paintRest, 250); } } catch (_) {}
  if (activeSession()) { PAGE = { kind: "log" }; renderPage(); }
  try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (S.settings.theme === "system") { applyTheme(); render(); } }); } catch (_) {}
  if (KV.token) syncNow(true);
  if ("serviceWorker" in navigator && isStandalone()) navigator.serviceWorker.register("sw.js").catch(() => {});
  setInterval(() => { const s = activeSession(); if (!s) return; const P = pauseOf(s), t = P.at ? "Paused" : fmtClock(elapsed(s)); ["#clock", "#mclock"].forEach(q => { const el = $(q); if (el) el.textContent = t; }); }, 1000);
  let lastDay = today();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState !== "visible") return; if (today() !== lastDay) { lastDay = today(); render(); } if (KV.token) syncNow(); if (REST) paintRest(); });
}
boot();
