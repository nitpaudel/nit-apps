<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>NitFit</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NitFit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch-1170x2532.png">
<style>
:root{--bg:#000;--card:#111113;--card2:#1b1b1f;--line:#27272c;--txt:#f5f5f7;--mut:#8e8e96;--dim:#5b5b63;--acc:#d6ff3f;--accd:#2a3305;--ink:#0c0d02;--red:#ff453a;--amber:#ffb020;--green:#34d55f;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(var(--sat) + 10px) 16px calc(var(--sab) + 96px)}
h1{font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:6px 0 2px}
h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:26px 2px 10px}
.sub{color:var(--mut);font-size:15px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);padding:8px 0 6px 10px;max-width:55%;text-align:right;line-height:1.2}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--dim)}.dot.green{background:var(--green)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card.tight{padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);min-height:52px}.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}.row .t{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .s{color:var(--mut);font-size:13px;margin-top:1px}
.row .r{color:var(--mut);font-size:15px;text-align:right;flex:none}
.chev{color:var(--dim);font-size:20px;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:15px;background:var(--acc);color:var(--ink);font-weight:800;font-size:17px;letter-spacing:-.01em}
.btn:active{transform:scale(.985);opacity:.9}.btn.ghost{background:var(--card2);color:var(--txt);font-weight:700}.btn.small{min-height:44px;font-size:15px;border-radius:12px;width:auto;padding:0 16px}.btn.red{background:#2a0f0d;color:var(--red)}
.btn[disabled]{opacity:.4}
.btns{display:flex;gap:10px}.btns>*{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 15px;border-radius:12px;background:var(--card2);color:var(--txt);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent}
.chip.on{background:var(--accd);color:var(--acc);border-color:var(--acc)}
.coach{border-left:3px solid var(--acc);padding:2px 0 2px 12px;margin:2px 0 16px}.coach p{margin:0 0 6px;font-weight:650;font-size:16px;line-height:1.3}.coach p:last-child{margin:0}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.mut{color:var(--mut)}.acc{color:var(--acc)}.red{color:var(--red)}.amber{color:var(--amber)}.green{color:var(--green)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--card2);color:var(--mut);vertical-align:2px}
.tag.acc{background:var(--accd);color:var(--acc)}.tag.amber{background:#33240a;color:var(--amber)}
.field{display:flex;align-items:center;gap:10px}
.inp{height:48px;border-radius:12px;background:var(--card2);border:1px solid var(--line);padding:0 12px;font-size:18px;font-weight:700;width:100%;min-width:0;outline:none}
.inp:focus{border-color:var(--acc)}
textarea.inp{height:88px;padding:10px 12px;font-size:15px;font-weight:500;resize:none}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:3px;margin-bottom:14px}
.seg button{flex:1;min-height:38px;border-radius:10px;text-align:center;font-weight:700;font-size:14px;color:var(--mut)}.seg button.on{background:var(--card2);color:var(--txt)}
/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;background:#08080a;border-top:1px solid var(--line);padding-bottom:var(--sab);z-index:20}
#tabs .in{max-width:520px;margin:0 auto;display:flex}
#tabs button{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.02em}
#tabs button.on{color:var(--acc)}#tabs svg{width:24px;height:24px}
/* today */
.plan-li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}.plan-li:last-child{border:0}
.plan-li .n{font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plan-li .v{color:var(--mut);flex:none}
/* workout */
#wk{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
#wk.on{display:flex}
#wk .head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(var(--sat) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
#wk .head .ttl{font-weight:800;font-size:19px;letter-spacing:-.02em}#wk .head .clock{color:var(--mut);font-size:13px}
#wk .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(var(--sab) + 150px)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
.ex .hd{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 8px}
.ex .hd .nm{font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1.15}.ex .hd .tg{font-size:14px;color:var(--acc);font-weight:700;margin-top:4px}
.ex .hd .more{flex:none;width:40px;height:40px;border-radius:11px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:20px;font-weight:800;margin-left:auto}
.ex .why{font-size:13px;color:var(--mut);padding:0 14px 8px;line-height:1.35}
.ex .note{font-size:13px;color:var(--amber);padding:0 14px 8px}
.ex.done{opacity:.62}.ex.done .hd .tg{color:var(--mut)}
.sets{padding:0 10px 10px}
.sr{display:grid;grid-template-columns:26px 1fr 78px 64px 54px;gap:6px;align-items:center;padding:4px 0}
.sr.h{font-size:10.5px;font-weight:800;letter-spacing:.07em;color:var(--dim);text-transform:uppercase;padding:2px 0 0}.sr.h div{text-align:center}.sr.h div:nth-child(2){text-align:left;padding-left:4px}
.sr .i{font-weight:800;color:var(--mut);text-align:center;font-size:15px}
.sr .prev{font-size:14px;color:var(--mut);padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr input{height:46px;border-radius:11px;background:var(--card2);border:1px solid var(--line);text-align:center;font-size:19px;font-weight:800;width:100%;padding:0;outline:none}
.sr input:focus{border-color:var(--acc)}
.sr .tick{height:46px;border-radius:11px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.sr .tick svg{width:22px;height:22px}
.sr.ok input{background:transparent;border-color:transparent;color:var(--txt)}
.sr.ok .tick{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.sr .pr{grid-column:2 / 6;font-size:12px;font-weight:800;color:var(--acc);letter-spacing:.05em;text-transform:uppercase;padding:0 4px 2px}
.exf{display:flex;gap:8px;padding:0 10px 12px}.exf button{flex:1;min-height:38px;border-radius:10px;background:var(--card2);color:var(--mut);font-weight:700;font-size:13px;text-align:center}
.rir{padding:2px 14px 14px}.rir .q{font-size:14px;font-weight:700;margin-bottom:8px}
.wu{font-size:13px;color:var(--mut);padding:0 14px 10px}.wu b{color:var(--txt)}
#rest{position:fixed;left:0;right:0;bottom:0;z-index:35;background:#0b0b0d;border-top:1px solid var(--line);padding:12px 16px calc(var(--sab) + 12px);display:none}
#rest.on{display:block}#rest .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
#rest .time{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;min-width:118px}
#rest .lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
#rest .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:10px;max-width:520px;margin-left:auto;margin-right:auto}#rest .bar i{display:block;height:100%;background:var(--acc);width:0}
#rest button{height:46px;min-width:54px;padding:0 12px;border-radius:12px;background:var(--card2);font-weight:800;font-size:15px;text-align:center}
#rest.go{background:var(--acc)}#rest.go .time,#rest.go .lbl{color:var(--ink)}#rest.go button{background:rgba(0,0,0,.16);color:var(--ink)}#rest.go .bar{visibility:hidden}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}#sheet.on{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.66)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#0e0e10;border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 16px calc(var(--sab) + 20px);max-width:520px;margin:0 auto}
#sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
#sheet h3{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 6px}
#sheet p{color:var(--mut);font-size:15px;margin:0 0 12px}
.err{color:var(--red);font-size:14px;font-weight:600;min-height:20px;margin:8px 0}
ol.steps{margin:0 0 14px;padding-left:22px;color:var(--txt);font-size:15px}ol.steps li{margin-bottom:9px}ol.steps a,a.lnk{color:var(--acc);font-weight:700;text-decoration:none}
/* bars and charts */
.meter{height:10px;border-radius:5px;background:var(--card2);overflow:hidden;margin:8px 0 4px}.meter i{display:block;height:100%;background:var(--acc);border-radius:5px}.meter.over i{background:var(--amber)}
.chart{width:100%;display:block}
.mrow{display:grid;grid-template-columns:92px 1fr 44px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.mbar{position:relative;height:12px;border-radius:6px;background:var(--card2)}.mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--acc)}.mbar b{position:absolute;top:-3px;bottom:-3px;border-left:2px solid var(--dim);border-right:2px solid var(--dim);background:rgba(255,255,255,.05)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-height:62px}.fb:active{background:var(--card2)}
.fb .n{font-weight:700;font-size:15px;line-height:1.2}.fb .v{font-size:12.5px;color:var(--mut);margin-top:3px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pgrid .ph{aspect-ratio:3/4;border-radius:12px;background:var(--card2);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;font-weight:700;text-align:center;position:relative}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}.pgrid .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);font-size:10.5px;color:#fff;padding:3px 0}
.cmp{position:relative;width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:#000;touch-action:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cmp .topw{position:absolute;inset:0;overflow:hidden}
.cmp .hnd{position:absolute;top:0;bottom:0;width:3px;background:var(--acc);margin-left:-1.5px}.cmp .hnd:after{content:"";position:absolute;top:50%;left:50%;width:36px;height:36px;margin:-18px;border-radius:50%;background:var(--acc)}
.cmp .lab{position:absolute;top:10px;font-size:12px;font-weight:800;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:8px}
table.ft{width:100%;border-collapse:collapse;font-size:15px}table.ft th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);text-align:right;padding:6px 4px;font-weight:800}table.ft th:first-child,table.ft td:first-child{text-align:left}table.ft td{padding:10px 4px;border-top:1px solid var(--line);text-align:right;font-weight:600}table.ft td.mid{color:var(--acc);font-weight:800}
.banner{background:#2a0f0d;border:1px solid #5a1d18;color:#ffb4ae;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}.banner button{color:#fff;font-weight:800;flex:none;text-decoration:underline}
.center{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 84px);background:var(--txt);color:#000;font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:86%;text-align:center}.toast.on{opacity:1}
.stepper{display:flex;align-items:center;gap:6px}.stepper button{width:40px;height:40px;border-radius:10px;background:var(--card2);font-size:20px;font-weight:800;text-align:center}.stepper span{min-width:26px;text-align:center;font-weight:800}
.spark{width:84px;height:30px;flex:none}

</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs"><div class="in">
<button data-a="tab" data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 13.5h6L10 21l9-11.5h-6.5L13 3z"/></svg>Today</button>
<button data-a="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l3.5-4 3 2.5L19 8"/></svg>Progress</button>
<button data-a="tab" data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 01-16 0zM9 7c0-1.5 1-1.5 1-3M13.5 7c0-1.5 1-1.5 1-3"/></svg>Food</button>
<button data-a="tab" data-tab="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.2"/><path d="M5.5 9.5h13l-3.8 5.5V21M9.3 15V21M9.3 15L5.5 9.5"/></svg>Body</button>
<button data-a="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 12h3M11 12h9M4 17h12M20 17h0"/><circle cx="16" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg>Settings</button>
</div></nav>
<div id="wk"><div class="head"></div><div class="body"></div></div>
<div id="rest"><div class="bar"><i></i></div><div class="in"><div style="flex:1"><div class="lbl">Rest</div><div class="time num">0:00</div></div><button data-a="restAdd" data-v="-15">-15</button><button data-a="restAdd" data-v="15">+15</button><button data-a="restSkip">Skip</button></div></div>
<div id="sheet"><div class="bg" data-a="closeSheet"></div><div class="pn"><div class="grab"></div><div class="in"></div></div></div>
<div id="toast" class="toast"></div>
<input type="file" id="photoIn" accept="image/*" hidden>
<input type="file" id="importIn" accept="application/json,.json" hidden>
<script>
// ---------- NitFit data: exercises, starter plan, foods ----------
// eq: db dumbbell, bb barbell, smith, cable, machine, bw bodyweight
// kind: c big lift, i small lift, core
const STEP_BY_EQ = { db: 2.5, bb: 5, smith: 5, cable: 5, machine: 5, bw: 0 };
const X = (id, n, m, s, eq, kind, lo, hi, rest, cue, extra) => Object.assign({ id, n, m, s: s || [], eq, kind, r: [lo, hi], rest, cue: cue || "" }, extra || {});
const EXERCISES = [
  // chest
  X("incline_db_press", "Incline dumbbell press", "Chest", ["Triceps", "Shoulders"], "db", "c", 8, 12, 150, "Bench at 30 degrees. Lower slow to the upper chest. Elbows a bit tucked."),
  X("flat_db_press", "Flat dumbbell press", "Chest", ["Triceps"], "db", "c", 8, 12, 150, "Shoulder blades pinned back. Lower until the dumbbells reach chest level."),
  X("smith_incline_press", "Smith incline press", "Chest", ["Triceps", "Shoulders"], "smith", "c", 6, 10, 180, "Bar to the upper chest. Pause for a moment at the bottom."),
  X("bench_press", "Barbell bench press", "Chest", ["Triceps", "Shoulders"], "bb", "c", 6, 10, 180, "Feet planted. Bar to mid chest. Do not bounce."),
  X("smith_bench", "Smith bench press", "Chest", ["Triceps"], "smith", "c", 6, 10, 180, "Bar to mid chest. Control the way down."),
  X("pec_deck", "Pec deck", "Chest", [], "machine", "i", 12, 15, 90, "Slow stretch at the back. Squeeze for a second at the front."),
  X("cable_fly_low_high", "Low to high cable fly", "Chest", [], "cable", "i", 12, 15, 90, "Hands start by the hips and finish at face height. This hits the upper chest."),
  X("dips", "Dips", "Chest", ["Triceps"], "bw", "c", 6, 12, 150, "Lean forward a little. Go down until the shoulders are just below the elbows."),
  X("push_up", "Push-up", "Chest", ["Triceps"], "bw", "i", 10, 25, 90, "Body in one straight line. Chest to the floor."),
  // shoulders
  X("db_shoulder_press", "Dumbbell shoulder press", "Shoulders", ["Triceps"], "db", "c", 8, 12, 150, "Seated, back supported. Lower to ear height."),
  X("smith_shoulder_press", "Smith shoulder press", "Shoulders", ["Triceps"], "smith", "c", 6, 10, 150, "Bar comes down in front of the face to chin height."),
  X("cable_lateral_raise", "Cable lateral raise", "Shoulders", [], "cable", "i", 12, 20, 75, "Cable behind the body. Lead with the elbow. Stop at shoulder height."),
  X("db_lateral_raise", "Dumbbell lateral raise", "Shoulders", [], "db", "i", 12, 20, 75, "Lean forward a little. No swinging. Slow on the way down."),
  // rear delts
  X("reverse_pec_deck", "Reverse pec deck", "Rear delts", [], "machine", "i", 12, 20, 75, "Arms almost straight. Pull wide, not back."),
  X("face_pull", "Face pull", "Rear delts", ["Back"], "cable", "i", 15, 20, 75, "Rope to the forehead. Elbows high. Great for posture."),
  X("cable_rear_fly", "Cable rear delt fly", "Rear delts", [], "cable", "i", 12, 20, 75, "Cross the cables. Pull apart with straight arms."),
  // back
  X("pull_up", "Pull-up", "Back", ["Biceps"], "bw", "c", 5, 12, 180, "Full hang at the bottom. Chin over the bar. No kicking."),
  X("chin_up", "Chin-up", "Back", ["Biceps"], "bw", "c", 5, 12, 180, "Palms face you. Full hang at the bottom."),
  X("lat_pulldown", "Lat pulldown", "Back", ["Biceps"], "machine", "c", 8, 12, 150, "Pull the bar to the upper chest. Elbows drive down, not back."),
  X("neutral_pulldown", "Close grip pulldown", "Back", ["Biceps"], "machine", "c", 8, 12, 150, "Palms face each other. Big stretch at the top."),
  X("chest_supported_row", "Chest supported dumbbell row", "Back", ["Biceps", "Rear delts"], "db", "c", 8, 12, 150, "Lie face down on an incline bench. Pull the elbows to the hips."),
  X("one_arm_db_row", "One arm dumbbell row", "Back", ["Biceps", "Rear delts"], "db", "c", 8, 12, 120, "Flat back. Pull to the hip, not the chest."),

// ---------- NitFit coach: pure rules, no screen code ----------
const kgTxt = k => (Math.round(k * 100) / 100).toString();
function snap(kg, step, dir) {
  if (!step) return Math.max(0, Math.round(kg * 2) / 2);
  const f = dir < 0 ? Math.floor : dir > 0 ? Math.ceil : Math.round;
  return Math.max(step, f(kg / step + (dir ? 0 : 1e-9)) * step);
}
const e1rm = (kg, reps) => kg > 0 ? kg * (1 + Math.min(reps, 30) / 30) : reps;
const fill = (n, v) => Array.from({ length: n }, () => v);
const unit = ex => ex.t ? " s" : "";

// hist: past sessions for this exercise, oldest first: [{d, sets:[{kg,reps,rir}]}], working sets only
// ctx: {sets, flags (0,1,2), deload (bool), gap (days since any last workout)}
function coachTarget(ex, hist, ctx) {
  const lo = ex.r[0], hi = ex.r[1], step = ex.step || 0, n = ctx.sets || 3, u = unit(ex);
  if (!hist.length) {
    return { kg: null, reps: fill(n, null), sets: n, tag: "new", reason: ex.eq === "bw"
      ? "First time. Do as many clean ones as you can, and stop 1 or 2 before failure."
      : "First time. Pick a weight you can lift about " + Math.round((lo + hi) / 2) + " times with 2 left in the tank. Log what you really did." };
  }
  const last = hist[hist.length - 1];
  const kg = last.sets[0].kg || 0;
  let r = last.sets.map(s => s.reps);
  while (r.length < n) r.push(r[r.length - 1]);
  r = r.slice(0, n);
  const lastTxt = "Last time " + (kg ? kgTxt(kg) + " kg x " : "") + last.sets.map(s => s.reps).join(", ") + u + ".";
  const bw = !kg;
  const down = pct => { if (bw) return kg; let nk = snap(kg * (1 - pct), step, 0); if (nk >= kg) nk = kg - step; return Math.max(step || 0, nk); };

  if (ctx.deload) {
    return { kg, reps: fill(Math.ceil(n / 2), lo), sets: Math.ceil(n / 2), tag: "easy", reason: "Easy week. Half the sets, same weight. Stop 3 reps before failure. This is how you come back stronger." };
  }
  if (ctx.gap >= 14) {
    const s = Math.max(1, Math.ceil(n * 2 / 3));
    return { kg: down(0.2), reps: fill(s, bw ? Math.max(1, Math.round(r[0] * 0.8)) : lo), sets: s, tag: "back", reason: "You were away " + ctx.gap + " days. 20% lighter and fewer sets this week. Build back." };
  }
  if (ctx.gap >= 7) {
    return { kg: down(0.1), reps: fill(n, bw ? Math.max(1, r[0] - 1) : lo), sets: n, tag: "back", reason: "You were away " + ctx.gap + " days. 10% lighter today. Back to normal next time." };
  }
  if (ctx.flags >= 2) {
    const s = Math.max(1, n - 1);
    return { kg, reps: r.slice(0, s), sets: s, tag: "hold", reason: "Bad sleep and low energy. One set less, same weight, no records today. " + lastTxt };
  }
  if (ctx.flags === 1) {
    return { kg, reps: r, sets: n, tag: "hold", reason: "Rough night or low energy. Hold the weight and match last time. " + lastTxt };
  }
  // stuck 3 sessions in a row at the same weight
  if (hist.length >= 3 && !bw) {
    const h3 = hist.slice(-3), tot = h => h.sets.reduce((a, s) => a + s.reps, 0);
    if (h3.every(h => (h.sets[0].kg || 0) === kg) && tot(h3[2]) <= tot(h3[1]) && tot(h3[1]) <= tot(h3[0]) && !r.every(x => x >= hi)) {
      return { kg: down(0.1), reps: fill(n, Math.min(hi, lo + 2)), sets: n, tag: "reset", reason: "Stuck for 3 sessions at " + kgTxt(kg) + " kg. Drop 10% and build back up. Check your sleep and food." };
    }
  }
  if (!bw && r[0] <= lo - 3) {
    const nk = down(0.04 * (lo - r[0]));
    return { kg: nk, reps: fill(n, lo), sets: n, tag: "down", reason: "Too heavy. " + lastTxt + " That is " + (lo - r[0]) + " under the range. Go to " + kgTxt(nk) + " kg." };
  }
  if (!bw && last.sets[0].rir === 0 && r[0] < lo) {
    const nk = down(0);
    return { kg: nk, reps: fill(n, lo), sets: n, tag: "down", reason: "You hit failure early. " + lastTxt + " One step lighter." };
  }
  if (!bw && r[0] >= hi + 3 && !ex.t) {
    const nk = snap(Math.max(kg * (1 + 0.04 * (r[0] - hi)), kg + step), step, 0);
    return { kg: nk, reps: fill(n, lo), sets: n, tag: "up", reason: "Too light. " + lastTxt + " Go up to " + kgTxt(nk) + " kg." };
  }
  if (r.every(x => x >= hi)) {
    if (bw) {
      const add = ex.t ? 5 : 1;
      return { kg, reps: r.map(x => x + add), sets: n, tag: "up", reason: lastTxt + " Top of the range. Add " + add + (ex.t ? " seconds" : " rep") + " to every set." };
    }
    const jump = step / kg;
    const cap = ex.kind === "c" ? hi + 3 : Math.min(25, Math.max(hi + 5, 20));
    if (jump > 0.10 && !r.every(x => x >= cap)) {
      return { kg, reps: r.map(x => Math.min(cap, x + 1)), sets: n, tag: "reps", reason: lastTxt + " The next weight is a " + Math.round(jump * 100) + "% jump, too big. Add reps first, up to " + cap + ", then go up." };
    }
    return { kg: kg + step, reps: fill(n, lo), sets: n, tag: "up", reason: lastTxt + " Every set hit the top. Add " + kgTxt(step) + " kg." };
  }
  if (r[0] >= hi) {
    return { kg, reps: r.map(x => x >= hi ? hi : x + 1), sets: n, tag: "reps", reason: lastTxt + " First set hit the top. Same weight. Bring the other sets up." };
  }
  return { kg, reps: r.map(x => Math.min(hi, Math.max(lo, x + 1))), sets: n, tag: "reps", reason: lastTxt + " Same weight. Beat it by 1 rep per set." };
}

function warmupSets(ex, kg) {
  if (!kg || ex.kind !== "c" || ex.eq === "bw") return [];
  const s = ex.step || 2.5;
  const out = [[0.5, 8], [0.7, 4], [0.85, 2]].map(([p, reps]) => [snap(kg * p, s, 0), reps]).filter(w => w[0] < kg);
  return out.filter((w, i) => i === 0 || w[0] !== out[i - 1][0]);
}

// best strength score per session for an exercise, and whether it has stalled
function stalled(hist) {
  if (hist.length < 4) return false;
  const best = h => Math.max(...h.sets.map(s => e1rm(s.kg || 0, s.reps)));
  const b = hist.map(best), before = Math.max(...b.slice(0, -3)), recent = Math.max(...b.slice(-3));
  return recent <= before * 1.005;
}

// smooth weight trend: each day moves 10% toward the new weight. Missing days are filled in a straight line.
function trendSeries(weights) {            // weights: [{d, kg}] sorted by day
  const out = []; let t = null, prev = null;
  const dayNum = d => Math.round(Date.parse(d + "T00:00:00Z") / 864e5);
  for (const w of weights) {
    if (t === null) { t = w.kg; }
    else {
      const gap = dayNum(w.d) - dayNum(prev.d);
      for (let i = 1; i <= gap; i++) { const v = prev.kg + (w.kg - prev.kg) * i / gap; t = t + 0.1 * (v - t); }
    }
    out.push({ d: w.d, kg: w.kg, trend: t }); prev = w;
  }
  return out;
}

// weekly food check-in. days: last 14 days oldest first [{d, kcal, meals, weighed, trend}]
function foodCheckin(days, s) {              // s: {tdee, kcalTarget, goalRate, exclude}
  const last7 = days.slice(-7);
  const isLogged = x => x.meals >= 2 && x.kcal >= 0.6 * s.kcalTarget;
  const logged7 = last7.filter(isLogged).length, weigh7 = last7.filter(x => x.weighed).length;
  const hold = why => ({ status: "hold", tdee: s.tdee, kcalTarget: s.kcalTarget, reason: why });
  if (s.exclude) return hold("This week is not counted (" + s.exclude + "). Target stays at " + s.kcalTarget + ".");
  if (logged7 < 4) return hold("Only " + logged7 + " of 7 days logged. Target stays at " + s.kcalTarget + ". Log at least 4 days.");
  if (weigh7 < 3) return hold("Only " + weigh7 + " weigh-ins this week. Target stays at " + s.kcalTarget + ". Weigh in every morning.");
  const lg = days.filter(isLogged), tr = days.filter(x => x.trend != null);
  if (tr.length < 2) return hold("Not enough weight data yet. Target stays at " + s.kcalTarget + ".");
  const meanKcal = lg.reduce((a, x) => a + x.kcal, 0) / lg.length;
  const span = Math.max(1, (Date.parse(tr[tr.length - 1].d) - Date.parse(tr[0].d)) / 864e5);
  const perDay = (tr[tr.length - 1].trend - tr[0].trend) / span;
  const raw = meanKcal - perDay * 5800;
  const tdee = Math.round(s.tdee + 0.5 * (raw - s.tdee));
  const surplus = Math.min(400, Math.max(150, s.goalRate * 5800 / 7));
  let target = tdee + surplus;
  target = Math.max(s.kcalTarget - 150, Math.min(s.kcalTarget + 150, target));
  target = Math.round(target / 25) * 25;
  const wk = perDay * 7, dir = target > s.kcalTarget ? "up" : target < s.kcalTarget ? "down" : "same";
  const reason = "Weight trend " + (wk >= 0 ? "+" : "") + wk.toFixed(2) + " kg a week, eating about " + Math.round(meanKcal / 10) * 10 + ". " +
    (dir === "same" ? "Target stays at " + target + "." : "Target goes " + dir + " to " + target + ".");
  return { status: "updated", tdee, raw: Math.round(raw), kcalTarget: target, weekly: wk, reason };
}

// future you
const FUTURE_KNOTS = [[0, 0, 0, 0], [3, 1, 1.6, 2.3], [6, 2, 3.3, 4.5], [9, 3, 4.9, 6.8], [12, 4, 6.5, 9], [18, 5, 8.3, 11.5], [24, 6, 10, 14], [60, 8, 14, 20]];
function leanGain(months, which) {           // which: 1 low, 2 mid, 3 high
  const k = FUTURE_KNOTS; if (months >= 60) return k[k.length - 1][which];
  for (let i = 1; i < k.length; i++) if (months <= k[i][0]) { const a = k[i - 1], b = k[i]; return a[which] + (b[which] - a[which]) * (months - a[0]) / (b[0] - a[0]); }
  return 0;
}
const ffmi = (leanKg, hM) => leanKg / (hM * hM) + 6.1 * (1.8 - hM);
const leanCap = hM => (25 - 6.1 * (1.8 - hM)) * hM * hM;
function navyBf(waistCm, neckCm, heightCm) { // men, returns %
  const inch = c => c / 2.54; if (!(waistCm > neckCm)) return null;
  return 86.010 * Math.log10(inch(waistCm) - inch(neckCm)) - 70.041 * Math.log10(inch(heightCm)) + 36.76;
}

let IDB = null; const KV = {};
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("nitfit", 1);
    r.onupgradeneeded = () => { const db = r.result; db.createObjectStore("events", { keyPath: "id" }); db.createObjectStore("kv"); db.createObjectStore("media"); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function idbDo(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = IDB.transaction(store, mode), rq = fn(t.objectStore(store));
    t.oncomplete = () => res(rq ? rq.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error("Storage stopped"));

ACT.targets = () => { const st = S.settings, f = (id, label, v, hint) => '<div class="row"><div class="grow"><div class="t">' + label + '</div><div class="s">' + hint + '</div></div><input class="inp num" id="' + id + '" inputmode="decimal" value="' + v + '" style="width:110px"></div>';
  openSheet('<h3>My targets</h3><p>The Saturday check moves calories for you. Change these only if you know why.</p><div class="card tight">' + f("tK", "Calories", st.kcal, "per day") + f("tP", "Protein", st.protein, "grams per day") + f("tH", "Height", st.heightCm, "cm") + f("tB", "Body fat guess", st.bfGuess, "percent") + f("tS", "Bad sleep is under", st.sleepBadH, "hours") + f("tG", "Gain goal", st.goalRate, "kg per week") + '</div><button class="btn" data-a="targetsSave">Save</button>'); };
ACT.targetsSave = () => { const g = id => numIn($("#" + id).value), p = { kcal: Math.round(g("tK")), protein: Math.round(g("tP")), heightCm: g("tH"), bfGuess: g("tB"), sleepBadH: g("tS"), goalRate: g("tG") }; if (!(p.kcal > 1200 && p.kcal < 6000 && p.protein > 30 && p.protein < 300 && p.heightCm > 120 && p.heightCm < 230 && p.bfGuess > 3 && p.bfGuess < 50 && p.sleepBadH > 3 && p.sleepBadH < 10 && p.goalRate >= 0 && p.goalRate < 1)) return toast("One of those numbers looks wrong."); addEvent("settings.upserted", p); closeSheet(); render(); };
// plan editor
ACT.planDay = el => { UI.planDraft = clone(S.plan); UI.planK = el.dataset.day; planSheet(); };
function planSheet() {
  const k = UI.planK, items = UI.planDraft[k] || (UI.planDraft[k] = []), sc = $("#sheet .pn").scrollTop;
  openSheet("<h3>" + DAY_NAMES[k] + '</h3><p>Change it, then tap Save. Keep the first big lift the same for a whole 6 weeks.</p><div class="card tight">' + items.map((it, i) => { const ex = getEx(it.ex); return '<div class="row"><div class="grow"><div class="t">' + esc(ex ? ex.n : it.ex) + '</div><div class="s"><button class="acc" data-a="planMove" data-i="' + i + '" data-v="-1">Up</button> · <button class="acc" data-a="planMove" data-i="' + i + '" data-v="1">Down</button> · <button class="red" data-a="planDel" data-i="' + i + '">Remove</button></div></div><div class="stepper"><button data-a="planSets" data-i="' + i + '" data-v="-1">-</button><span class="num">' + it.sets + '</span><button data-a="planSets" data-i="' + i + '" data-v="1">+</button></div></div>'; }).join("") + '</div><button class="btn ghost" data-a="planAddPick">Add an exercise</button><div style="height:10px"></div><button class="btn" data-a="planSave">Save</button>');
  $("#sheet .pn").scrollTop = sc;
}
ACT.planSets = el => { const it = UI.planDraft[UI.planK][+el.dataset.i]; it.sets = Math.max(1, Math.min(8, it.sets + +el.dataset.v)); planSheet(); };
ACT.planMove = el => { const a = UI.planDraft[UI.planK], i = +el.dataset.i, j = i + +el.dataset.v; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; planSheet(); };
ACT.planDel = el => { UI.planDraft[UI.planK].splice(+el.dataset.i, 1); planSheet(); };
ACT.planAddPick = () => exPicker("planAdd", "Add to " + DAY_NAMES[UI.planK]);
ACT.planAdd = el => { const a = UI.planDraft[UI.planK]; if (!a.some(x => x.ex === el.dataset.ex)) a.push({ ex: el.dataset.ex, sets: 3 }); planSheet(); };
ACT.planSave = () => { addEvent("plan.upserted", { plan: UI.planDraft }); closeSheet(); toast("Plan saved"); render(); };
ACT.newEx = () => openSheet('<h3>Add my own exercise</h3><input class="inp" id="nxN" placeholder="Name" style="margin-bottom:10px;font-size:16px;font-weight:600"><h2>Muscle</h2><select class="inp" id="nxM" style="font-size:16px">' + MUSCLES.concat(["Adductors", "Neck"]).map(m => "<option>" + m + "</option>").join("") + '</select><h2>What you lift</h2><select class="inp" id="nxE" style="font-size:16px"><option value="machine">Machine</option><option value="cable">Cable</option><option value="db">Dumbbells</option><option value="bb">Barbell</option><option value="smith">Smith machine</option><option value="bw">Bodyweight</option></select><div style="height:14px"></div><button class="btn" data-a="newExSave">Save</button>');
ACT.newExSave = () => { const n = $("#nxN").value.trim(), eq = $("#nxE").value; if (!n) return toast("Give it a name."); addEvent("exercise.upserted", { exId: "c_" + uid(), custom: true, n, m: $("#nxM").value, s: [], eq, kind: "i", r: [10, 15], rest: 90, step: STEP_BY_EQ[eq], cue: "" }); closeSheet(); toast("Saved. Add it to a day in My plan."); render(); };

// ----- router and start-up -----
const VIEWS = { today: vToday, progress: vProgress, food: vFood, body: vBody, more: vMore };
function render() {
  if (!S) return; const app = $("#app"); app.innerHTML = VIEWS[TAB](); hydratePhotos(app);
  $$("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === TAB));
}
ACT.tab = el => { TAB = el.dataset.tab; render(); window.scrollTo(0, 0); };
document.addEventListener("click", e => { const el = e.target.closest("[data-a]"); if (!el) return; const f = ACT[el.dataset.a]; if (f) f(el, e); });
async function boot() {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (ios && !standalone) {
    $("#tabs").style.display = "none";
    $("#app").innerHTML = '<div class="center"><h1>Put NitFit on your Home Screen</h1><p class="sub" style="margin:8px 0 18px">NitFit only works from its own icon. That keeps your data in one safe place.</p><div class="card"><ol class="steps" style="margin:0"><li>Tap the <b>Share</b> button (the square with the arrow).</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li><li>Close Safari. Open <b>NitFit</b> from the new icon.</li></ol></div><p class="sub" style="font-size:13px">Always open it from the icon, never from a link in Safari.</p></div>';
    return;
  }
  try { await coreBoot(); } catch (e) { $("#app").innerHTML = '<div class="center"><h1>Storage is blocked</h1><p class="sub">NitFit could not open its storage on this phone. Close it and open it again. If you are in Private Browsing, turn that off.</p></div>'; return; }
  try { if (navigator.storage && navigator.storage.persist && KV.persist == null) kvSet("persist", await navigator.storage.persist()); } catch (_) {}
  try { const r = JSON.parse(localStorage.getItem("nitfit:rest") || "null"); if (r && r.end > Date.now() - 15000) { REST = r; REST.fired = REST.end < Date.now(); restIv = setInterval(paintRest, 250); } } catch (_) {}
  render();
  if (KV.token) syncNow(); else if (!KV.skipSetup) ACT.keySetup();
  setInterval(() => { if (!document.hidden && KV.token) syncNow(); syncPaint(); }, 5 * 60e3);
  setInterval(syncPaint, 30e3);
  addEventListener("online", () => syncNow());
  let lastDay = today(); setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60e3);
}
boot();

</script>
</body>
