/* ===========================================================================
   NitFit design system
   One rule above all: the only colour in this app is Nit's body lighting up.
   Everything else is black, white and grey. That is what makes it look dear.
   =========================================================================== */

:root {
  /* type */
  --f: Jakarta, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

  /* space scale */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s7: 32px; --s8: 40px; --s9: 56px;

  /* corners */
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-full: 999px;

  /* motion */
  --ease: cubic-bezier(.4, 0, .2, 1);
  --spring: cubic-bezier(.32, .72, 0, 1);
  --fast: .18s; --mid: .28s; --slow: .42s;

  /* heat. muscles only. never used on anything else. */
  --m0: #191920;          /* not trained */
  --m1: #551512;          /* helper muscle */
  --m2: #FF3B30;          /* today's target */
  --m-glow: rgba(255, 59, 48, .34);
}

/* ---------- dark, the default ---------- */
:root, :root[data-theme="dark"] {
  --bg: #000000;
  --s-1: #0B0B0D;         /* recessed */
  --s0: #121216;          /* card */
  --s1c: #1A1A20;         /* raised */
  --s2c: #23232B;         /* pressed / input */
  --line: rgba(255, 255, 255, .09);
  --line-strong: rgba(255, 255, 255, .16);
  --t0: rgba(255, 255, 255, .97);
  --t1: rgba(255, 255, 255, .58);
  --t2: rgba(255, 255, 255, .34);
  --t3: rgba(255, 255, 255, .18);
  --inv-bg: #FFFFFF;      /* primary button */
  --inv-t: #000000;
  --body-fill: #1C1C22;   /* the figure's skin */
  --body-line: rgba(255, 255, 255, .13);
  --shadow: 0 1px 0 rgba(255, 255, 255, .04) inset;
  --sheet-dim: rgba(0, 0, 0, .64);
  --blur-bg: rgba(10, 10, 12, .72);
}

/* ---------- light ---------- */
:root[data-theme="light"] {
  --bg: #F2F2F5;
  --s-1: #E9E9ED;
  --s0: #FFFFFF;
  --s1c: #FFFFFF;
  --s2c: #EFEFF3;
  --line: rgba(0, 0, 0, .08);
  --line-strong: rgba(0, 0, 0, .14);
  --t0: #08080A;
  --t1: rgba(0, 0, 0, .56);
  --t2: rgba(0, 0, 0, .36);
  --t3: rgba(0, 0, 0, .18);
  --inv-bg: #08080A;
  --inv-t: #FFFFFF;
  --body-fill: #DFDFE5;
  --body-line: rgba(0, 0, 0, .12);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .05);
  --sheet-dim: rgba(0, 0, 0, .34);
  --blur-bg: rgba(242, 242, 245, .76);
  --m0: #D6D6DD;
  --m1: #F3BDB6;
}

/* ===========================  reset  =========================== */

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { background: var(--bg); }

body {
  min-height: 100vh;
  font-family: var(--f);
  background: var(--bg);
  color: var(--t0);
  font-size: 15px;
  line-height: 1.45;
  font-weight: 500;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior-y: none;
  -webkit-user-select: none; user-select: none;
  transition: background-color var(--mid) var(--ease), color var(--mid) var(--ease);
}

button, input, select, textarea { font: inherit; color: inherit; background: none; border: 0; outline: 0; }
button { cursor: pointer; text-align: left; }
svg { display: block; }
a { color: inherit; }

/* numbers always line up in columns */
.num, input.num, .tnum {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
  letter-spacing: -.01em;
}

/* ===========================  layout  =========================== */

#app {
  padding: calc(env(safe-area-inset-top) + var(--s5)) var(--s5)
           calc(env(safe-area-inset-bottom) + 104px);
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
}

/* ===========================  type  =========================== */

h1 { font-size: 30px; font-weight: 800; letter-spacing: -.028em; line-height: 1.1; }

h2 {                                   /* small caps section label */
  font-size: 11.5px; font-weight: 700; letter-spacing: .085em;
  text-transform: uppercase; color: var(--t2);
  margin: var(--s7) 0 var(--s3);
}
h2:first-child { margin-top: 0; }

h3 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }

.display { font-size: 54px; font-weight: 800; letter-spacing: -.04em; line-height: .96; }
.display .u { font-size: 20px; font-weight: 700; letter-spacing: -.01em; color: var(--t1); }

.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--t2); }
.sub { color: var(--t1); font-size: 14.5px; font-weight: 500; }
.mut { color: var(--t2); }
.tiny { font-size: 12.5px; font-weight: 500; color: var(--t1); line-height: 1.5; }

/* page header */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s6); }
.top .eyebrow { margin-bottom: 3px; }

/* ===========================  cards  =========================== */

.card {
  background: var(--s0);
  border: .5px solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--s5);
  box-shadow: var(--shadow);
}
.card + .card { margin-top: var(--s3); }
.card.flush { padding: 0; overflow: hidden; }
.card.quiet { background: var(--s-1); border-color: transparent; box-shadow: none; }

/* a row inside a flush card */
.row {
  display: flex; align-items: center; gap: var(--s4);
  padding: var(--s4) var(--s5);
  width: 100%;
  position: relative;
  transition: background-color var(--fast) var(--ease);
}
.row + .row::before {
  content: ""; position: absolute; top: 0; left: var(--s5); right: 0;
  height: .5px; background: var(--line);
}
button.row:active { background: var(--s2c); }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-size: 16px; font-weight: 650; letter-spacing: -.012em; }
.row .s { font-size: 13.5px; font-weight: 500; color: var(--t1); margin-top: 1px; }
.row .r { font-size: 16px; font-weight: 700; color: var(--t1); flex: none; }
.chev { flex: none; color: var(--t3); width: 8px; }
.chev svg { width: 8px; height: 13px; }

/* ===========================  buttons  =========================== */

.btn {
  display: flex; align-items: center; justify-content: center; gap: var(--s2);
  width: 100%; min-height: 52px; padding: 0 var(--s5);
  background: var(--inv-bg); color: var(--inv-t);
  border-radius: var(--r-md);
  font-size: 16.5px; font-weight: 700; letter-spacing: -.012em;
  transition: transform var(--fast) var(--ease), opacity var(--fast) var(--ease);
}
.btn:active { transform: scale(.975); opacity: .9; }
.btn.ghost { background: var(--s1c); color: var(--t0); border: .5px solid var(--line); }
.btn.ghost:active { background: var(--s2c); }
.btn.sm { min-height: 42px; font-size: 15px; border-radius: var(--r-sm); padding: 0 var(--s4); }
.btn.danger { background: transparent; color: var(--m2); border: .5px solid var(--line); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btns { display: flex; gap: var(--s2); }
.btns > .btn { width: auto; flex: 1; }

/* pill toggle */
.chip {
  padding: 8px 15px; border-radius: var(--r-full);
  background: var(--s1c); border: .5px solid var(--line);
  font-size: 14px; font-weight: 650; color: var(--t1);
  transition: all var(--fast) var(--ease);
}
.chip:active { transform: scale(.95); }
.chip.on { background: var(--inv-bg); color: var(--inv-t); border-color: transparent; }
.chips { display: flex; gap: var(--s2); flex-wrap: wrap; }

/* segmented control */
.seg {
  display: flex; padding: 3px; gap: 2px;
  background: var(--s-1); border-radius: var(--r-md);
  margin-bottom: var(--s5);
}
.seg button {
  flex: 1; text-align: center; padding: 9px 0; border-radius: 11px;
  font-size: 14px; font-weight: 650; color: var(--t1);
  transition: all var(--fast) var(--ease);
}
.seg button.on { background: var(--s1c); color: var(--t0); box-shadow: 0 1px 3px rgba(0,0,0,.18); }

/* tag */
.tag {
  display: inline-flex; align-items: center; padding: 3px 9px;
  border-radius: var(--r-full); background: var(--s1c);
  font-size: 11.5px; font-weight: 700; letter-spacing: .03em;
  text-transform: uppercase; color: var(--t1);
}
.tag.hot { background: rgba(255, 59, 48, .14); color: var(--m2); }

/* ===========================  inputs  =========================== */

.inp {
  width: 100%; min-height: 50px; padding: 0 var(--s4);
  background: var(--s2c); border: .5px solid transparent;
  border-radius: var(--r-md);
  font-size: 16px; font-weight: 600; color: var(--t0);
  transition: border-color var(--fast) var(--ease);
}
.inp:focus { border-color: var(--line-strong); }
.inp::placeholder { color: var(--t3); font-weight: 500; }
.field { display: flex; gap: var(--s2); align-items: center; }

/* ===========================  the body figure  =========================== */

.figwrap {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  padding: var(--s2) 0;
  touch-action: pan-y;
}
.fig {
  width: 100%; max-width: 186px; height: auto;
  transition: opacity var(--mid) var(--ease);
}
.fig .skin { fill: var(--body-fill); }
.fig .edge { fill: none; stroke: var(--body-line); stroke-width: 1.1; }
.fig .mg {                              /* a muscle group */
  fill: var(--m0);
  transition: fill var(--slow) var(--ease), opacity var(--slow) var(--ease);
}
.fig .mg.lvl1 { fill: var(--m1); }
.fig .mg.lvl2 { fill: var(--m2); }
.fig .mg.tapped { opacity: .62; }

/* the soft red bloom behind lit muscles */
.fig .bloom { opacity: 0; transition: opacity var(--slow) var(--ease); }
.fig .bloom.on { opacity: 1; }

/* front / back flip */
.flipper { position: relative; width: 100%; max-width: 186px; }
.flipper .face { transition: opacity var(--mid) var(--ease), transform var(--slow) var(--spring); }
.flipper .face.hide { position: absolute; inset: 0; opacity: 0; pointer-events: none; }

.figside {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 40px; height: 40px; border-radius: var(--r-full);
  display: flex; align-items: center; justify-content: center;
  background: var(--s1c); border: .5px solid var(--line); color: var(--t1);
  transition: transform var(--fast) var(--ease);
}
.figside:active { transform: translateY(-50%) scale(.9); }
.figside.l { left: 0; } .figside.r { right: 0; }
.figside svg { width: 15px; height: 15px; }

.figlabel {
  position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
  font-size: 11.5px; font-weight: 700; letter-spacing: .085em;
  text-transform: uppercase; color: var(--t2);
}

/* ===========================  muscle volume bars  =========================== */

.mrow { display: flex; align-items: center; gap: var(--s3); padding: 7px 0; }
.mrow .nm { width: 78px; flex: none; font-size: 13.5px; font-weight: 600; }
.mbar { flex: 1; height: 7px; border-radius: var(--r-full); background: var(--s2c); position: relative; overflow: hidden; }
.mbar i { position: absolute; inset: 0 auto 0 0; background: var(--t1); border-radius: var(--r-full); transition: width var(--slow) var(--ease); }
.mbar b { position: absolute; top: 0; bottom: 0; background: var(--line-strong); }
.mrow .v { width: 30px; flex: none; text-align: right; font-size: 13.5px; font-weight: 700; color: var(--t1); }

/* ===========================  meters  =========================== */

.meter { height: 8px; border-radius: var(--r-full); background: var(--s2c); overflow: hidden; margin-top: var(--s3); }
.meter i { display: block; height: 100%; background: var(--t0); border-radius: var(--r-full); transition: width var(--slow) var(--ease); }

/* ===========================  tab bar  =========================== */

#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  background: var(--blur-bg);
  -webkit-backdrop-filter: saturate(180%) blur(22px);
  backdrop-filter: saturate(180%) blur(22px);
  border-top: .5px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
#tabs .in { display: flex; max-width: 560px; margin: 0 auto; }
#tabs button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 9px 0 7px;
  font-size: 10px; font-weight: 650; letter-spacing: .01em;
  color: var(--t2);
  transition: color var(--fast) var(--ease);
}
#tabs button svg { width: 23px; height: 23px; }
#tabs button.on { color: var(--t0); }
#tabs button:active svg { transform: scale(.88); transition: transform var(--fast) var(--ease); }

/* ===========================  workout screen  =========================== */

#wk {
  position: fixed; inset: 0; z-index: 80;
  background: var(--bg);
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform var(--slow) var(--spring);
  visibility: hidden;
}
#wk.on { transform: none; visibility: visible; }
#wk .head {
  display: flex; align-items: center; gap: var(--s3);
  padding: calc(env(safe-area-inset-top) + var(--s3)) var(--s5) var(--s3);
  border-bottom: .5px solid var(--line);
  background: var(--blur-bg);
  -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
}
#wk .head .ttl { font-size: 17px; font-weight: 750; letter-spacing: -.015em; }
#wk .head .clock { font-size: 12.5px; font-weight: 600; color: var(--t2); }
#wk .body {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: var(--s5) var(--s5) calc(env(safe-area-inset-bottom) + 160px);
  max-width: 560px; margin: 0 auto; width: 100%;
}

/* one exercise block */
.ex {
  background: var(--s0); border: .5px solid var(--line);
  border-radius: var(--r-lg); padding: var(--s4) 0 var(--s2);
  margin-bottom: var(--s3);
  transition: opacity var(--mid) var(--ease);
}
.ex.done { opacity: .5; }
.ex .hd { display: flex; align-items: flex-start; gap: var(--s2); padding: 0 var(--s5) var(--s3); }
.ex .nm { font-size: 17.5px; font-weight: 750; letter-spacing: -.018em; }
.ex .tg { font-size: 13.5px; font-weight: 600; color: var(--t1); margin-top: 2px; }
.ex .more { flex: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--t2); border-radius: var(--r-full); }
.ex .more:active { background: var(--s2c); }
.ex .why, .ex .note, .ex .wu {
  margin: 0 var(--s5) var(--s3); padding: var(--s3) var(--s4);
  background: var(--s-1); border-radius: var(--r-sm);
  font-size: 13.5px; font-weight: 500; color: var(--t1); line-height: 1.5;
}
.ex .wu b { color: var(--t0); font-weight: 700; }

/* set rows */
.sets { padding: 0 var(--s4); }
.sr {
  display: grid; grid-template-columns: 26px 1fr 62px 62px 44px;
  gap: var(--s2); align-items: center;
  padding: 5px 0; position: relative;
}
.sr.h { padding-bottom: var(--s2); }
.sr.h > div { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--t2); }
.sr.h > div:nth-child(3), .sr.h > div:nth-child(4) { text-align: center; }
.sr .i { font-size: 14px; font-weight: 700; color: var(--t2); text-align: center; }
.sr .prev { font-size: 13px; font-weight: 550; color: var(--t2); overflow: hidden; white-space: nowrap; }
.sr input {
  width: 100%; height: 42px; text-align: center;
  background: var(--s2c); border-radius: var(--r-sm);
  font-size: 16px; font-weight: 700; color: var(--t0);
  transition: background-color var(--fast) var(--ease);
}
.sr input::placeholder { color: var(--t3); font-weight: 600; }
.sr input[readonly] { background: transparent; color: var(--t1); }
.sr .tick {
  width: 42px; height: 42px; border-radius: var(--r-sm);
  background: var(--s2c); color: var(--t3);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--fast) var(--ease);
}
.sr .tick svg { width: 17px; height: 17px; }
.sr .tick:active { transform: scale(.9); }
.sr.ok .tick { background: var(--inv-bg); color: var(--inv-t); }
.sr .pr {
  position: absolute; right: 50px; top: -5px;
  font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  color: var(--m2);
}
.exf { display: flex; gap: var(--s4); padding: var(--s2) var(--s5) var(--s2); }
.exf button { font-size: 14px; font-weight: 650; color: var(--t1); }
.exf button:active { color: var(--t0); }

/* how hard was that set */
.rir { padding: var(--s3) var(--s5) var(--s2); }
.rir .q { font-size: 13.5px; font-weight: 600; color: var(--t1); margin-bottom: var(--s2); }

/* ===========================  rest timer  =========================== */

#rest {
  position: fixed; left: var(--s4); right: var(--s4); z-index: 90;
  bottom: calc(env(safe-area-inset-bottom) + var(--s4));
  background: var(--s1c);
  border: .5px solid var(--line-strong);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
  transform: translateY(160%);
  transition: transform var(--slow) var(--spring);
  max-width: 528px; margin: 0 auto;
}
#rest.on { transform: none; }
#rest .bar { height: 2.5px; background: var(--s2c); }
#rest .bar i { display: block; height: 100%; background: var(--t0); transition: width .25s linear; }
#rest .in { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4); }
#rest .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--t2); }
#rest .time { font-size: 27px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
#rest button {
  flex: none; padding: 9px 13px; border-radius: var(--r-sm);
  background: var(--s2c); font-size: 13.5px; font-weight: 700; color: var(--t0);
}
#rest button:active { transform: scale(.93); }
#rest.go { background: var(--inv-bg); border-color: transparent; }
#rest.go .lbl, #rest.go .time { color: var(--inv-t); }
#rest.go .bar { background: rgba(0, 0, 0, .12); }
#rest.go button { background: rgba(0, 0, 0, .1); color: var(--inv-t); }
:root[data-theme="light"] #rest.go button { background: rgba(255, 255, 255, .18); }

/* ===========================  bottom sheet  =========================== */

#sheet { position: fixed; inset: 0; z-index: 100; visibility: hidden; }
#sheet.on { visibility: visible; }
#sheet .bg {
  position: absolute; inset: 0; background: var(--sheet-dim);
  opacity: 0; transition: opacity var(--mid) var(--ease);
}
#sheet.on .bg { opacity: 1; }
#sheet .pn {
  position: absolute; left: 0; right: 0; bottom: 0;
  max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--s-1);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  border-top: .5px solid var(--line);
  transform: translateY(100%);
  transition: transform var(--slow) var(--spring);
  max-width: 560px; margin: 0 auto;
}
#sheet.on .pn { transform: none; }
#sheet .grab { width: 36px; height: 4.5px; border-radius: var(--r-full); background: var(--t3); margin: var(--s3) auto var(--s2); }
#sheet .in { padding: var(--s3) var(--s5) calc(env(safe-area-inset-bottom) + var(--s7)); }
#sheet .in h3 { margin-bottom: var(--s2); }
#sheet .in p { color: var(--t1); font-size: 14.5px; line-height: 1.5; margin-bottom: var(--s4); }

/* ===========================  toast  =========================== */

.toast {
  position: fixed; left: 50%; z-index: 120;
  bottom: calc(env(safe-area-inset-bottom) + 92px);
  transform: translate(-50%, 16px);
  padding: 11px var(--s5); border-radius: var(--r-full);
  background: var(--inv-bg); color: var(--inv-t);
  font-size: 14px; font-weight: 700; letter-spacing: -.01em;
  white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity var(--mid) var(--ease), transform var(--mid) var(--spring);
  box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ===========================  banner  =========================== */

.banner {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) var(--s4); margin-bottom: var(--s4);
  background: var(--s-1); border: .5px solid var(--line);
  border-radius: var(--r-md);
  font-size: 13.5px; font-weight: 550; color: var(--t1); line-height: 1.4;
}
.banner button { flex: none; font-size: 13.5px; font-weight: 700; color: var(--t0); text-decoration: underline; text-underline-offset: 3px; }

/* sync pill */
.sync { display: flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: var(--r-full); background: var(--s-1); flex: none; }
.sync span { font-size: 11.5px; font-weight: 650; color: var(--t2); }
.dot { width: 6px; height: 6px; border-radius: var(--r-full); flex: none; background: var(--t2); }
.dot.green { background: #30D158; } .dot.amber { background: #FF9F0A; } .dot.red { background: var(--m2); }

/* ===========================  coach  =========================== */

.coach {
  padding: var(--s4) var(--s5); margin-bottom: var(--s3);
  background: var(--s-1); border-radius: var(--r-lg);
  border-left: 2.5px solid var(--t0);
}
.coach p { font-size: 15px; font-weight: 650; letter-spacing: -.01em; line-height: 1.45; }
.coach p + p { margin-top: var(--s2); color: var(--t1); font-weight: 550; }

/* ===========================  plan list  =========================== */

.pli { display: flex; align-items: baseline; gap: var(--s3); padding: 9px 0; }
.pli + .pli { border-top: .5px solid var(--line); }
.pli .n { flex: 1; font-size: 15.5px; font-weight: 600; letter-spacing: -.012em; }
.pli .v { font-size: 14px; font-weight: 650; color: var(--t1); flex: none; }

/* ===========================  warmup steps  =========================== */

.step { display: flex; gap: var(--s4); padding: var(--s4) 0; }
.step + .step { border-top: .5px solid var(--line); }
.step .ix {
  flex: none; width: 26px; height: 26px; border-radius: var(--r-full);
  background: var(--s2c); color: var(--t1);
  display: flex; align-items: center; justify-content: center;
  font-size: 12.5px; font-weight: 750;
}
.step .nm { font-size: 15.5px; font-weight: 650; letter-spacing: -.012em; }
.step .de { font-size: 13.5px; font-weight: 500; color: var(--t1); margin-top: 2px; line-height: 1.45; }
.step .dur { flex: none; font-size: 13.5px; font-weight: 700; color: var(--t1); }

/* ===========================  before and after slider  =========================== */

.cmp {
  position: relative; width: 100%; aspect-ratio: 3 / 4;
  border-radius: var(--r-lg); overflow: hidden;
  background: var(--s2c);
  touch-action: none; cursor: ew-resize;
}
.cmp > img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cmp .topw { position: absolute; inset: 0 auto 0 0; overflow: hidden; }
.cmp .topw img { height: 100%; object-fit: cover; display: block; max-width: none; }
.cmp .hnd { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 10px rgba(0, 0, 0, .55); }
.cmp .hnd::after {
  content: ""; position: absolute; top: 50%; left: 50%;
  width: 34px; height: 34px; margin: -17px 0 0 -17px;
  border-radius: var(--r-full); background: #fff;
  box-shadow: 0 2px 10px rgba(0, 0, 0, .45);
}

const kgTxt = k => (Math.round(k * 100) / 100).toString();

function coachTarget(ex, hist, ctx) {

  if (!hist.length) {
    return { kg: null, reps: fill(n, null), sets: n, tag: "new", reason: ex.eq === "bw"
      ? "First time. Do as many clean ones as you can, and stop 1 or 2 before failure."
      : "First time. Pick a weight you can lift about " + Math.round((lo + hi) / 2) + " times with 2 left in the tank. Log what you really did." };
  }
  const last = hist[hist.length - 1];
  const kg = last.sets[0].kg || 0;
  let r = last.sets.map(s => s.reps);
  while (r.length < n) r.push(r[r.length - 1]);
  r = r.slice(0, n);
  const lastTxt = "Last time " + (kg ? kgTxt(kg) + " kg x " : "") + last.sets.map(s => s.reps).join(", ") + u + ".";
  const bw = !kg;
  const down = pct => { if (bw) return kg; let nk = snap(kg * (1 - pct), step, 0); if (nk >= kg) nk = kg - step; return Math.max(step || 0, nk); };

  if (ctx.deload) {
    return { kg, reps: fill(Math.ceil(n / 2), lo), sets: Math.ceil(n / 2), tag: "easy", reason: "Easy week. Half the sets, same weight. Stop 3 reps before failure. This is how you come back stronger." };
  }
  if (ctx.gap >= 14) {
    const s = Math.max(1, Math.ceil(n * 2 / 3));
    return { kg: down(0.2), reps: fill(s, bw ? Math.max(1, Math.round(r[0] * 0.8)) : lo), sets: s, tag: "back", reason: "You were away " + ctx.gap + " days. 20% lighter and fewer sets this week. Build back." };
  }
  if (ctx.gap >= 7) {
    return { kg: down(0.1), reps: fill(n, bw ? Math.max(1, r[0] - 1) : lo), sets: n, tag: "back", reason: "You were away " + ctx.gap + " days. 10% lighter today. Back to normal next time." };
  }
  if (ctx.flags >= 2) {
    const s = Math.max(1, n - 1);
    return { kg, reps: r.slice(0, s), sets: s, tag: "hold", reason: "Bad sleep and low energy. One set less, same weight, no records today. " + lastTxt };
  }
  if (ctx.flags === 1) {
    return { kg, reps: r, sets: n, tag: "hold", reason: "Rough night or low energy. Hold the weight and match last time. " + lastTxt };
  }
  // stuck 3 sessions in a row at the same weight
  if (hist.length >= 3 && !bw) {
    const h3 = hist.slice(-3), tot = h => h.sets.reduce((a, s) => a + s.reps, 0);
    if (h3.every(h => (h.sets[0].kg || 0) === kg) && tot(h3[2]) <= tot(h3[1]) && tot(h3[1]) <= tot(h3[0]) && !r.every(x => x >= hi)) {
      return { kg: down(0.1), reps: fill(n, Math.min(hi, lo + 2)), sets: n, tag: "reset", reason: "Stuck for 3 sessions at " + kgTxt(kg) + " kg. Drop 10% and build back up. Check your sleep and food." };
    }
  }
  if (!bw && r[0] <= lo - 3) {
    const nk = down(0.04 * (lo - r[0]));
    return { kg: nk, reps: fill(n, lo), sets: n, tag: "down", reason: "Too heavy. " + lastTxt + " That is " + (lo - r[0]) + " under the range. Go to " + kgTxt(nk) + " kg." };
  }
  if (!bw && last.sets[0].rir === 0 && r[0] < lo) {
    const nk = down(0);
    return { kg: nk, reps: fill(n, lo), sets: n, tag: "down", reason: "You hit failure early. " + lastTxt + " One step lighter." };
  }
  if (!bw && r[0] >= hi + 3 && !ex.t) {
    const nk = snap(Math.max(kg * (1 + 0.04 * (r[0] - hi)), kg + step), step, 0);
    return { kg: nk, reps: fill(n, lo), sets: n, tag: "up", reason: "Too light. " + lastTxt + " Go up to " + kgTxt(nk) + " kg." };
  }
  if (r.every(x => x >= hi)) {
    if (bw) {
      const add = ex.t ? 5 : 1;
      return { kg, reps: r.map(x => x + add), sets: n, tag: "up", reason: lastTxt + " Top of the range. Add " + add + (ex.t ? " seconds" : " rep") + " to every set." };
    }
    const jump = step / kg;
    const cap = ex.kind === "c" ? hi + 3 : Math.min(25, Math.max(hi + 5, 20));
    if (jump > 0.10 && !r.every(x => x >= cap)) {
      return { kg, reps: r.map(x => Math.min(cap, x + 1)), sets: n, tag: "reps", reason: lastTxt + " The next weight is a " + Math.round(jump * 100) + "% jump, too big. Add reps first, up to " + cap + ", then go up." };
    }
    return { kg: kg + step, reps: fill(n, lo), sets: n, tag: "up", reason: lastTxt + " Every set hit the top. Add " + kgTxt(step) + " kg." };
  }
  if (r[0] >= hi) {
    return { kg, reps: r.map(x => x >= hi ? hi : x + 1), sets: n, tag: "reps", reason: lastTxt + " First set hit the top. Same weight. Bring the other sets up." };
  }
  return { kg, reps: r.map(x => Math.min(hi, Math.max(lo, x + 1))), sets: n, tag: "reps", reason: lastTxt + " Same weight. Beat it by 1 rep per set." };
}

function warmupSets(ex, kg) {
  if (!kg || ex.kind !== "c" || ex.eq === "bw") return [];
  const s = ex.step || 2.5;
  const out = [[0.5, 8], [0.7, 4], [0.85, 2]].map(([p, reps]) => [snap(kg * p, s, 0), reps]).filter(w => w[0] < kg);
  return out.filter((w, i) => i === 0 || w[0] !== out[i - 1][0]);
}

// best strength score per session for an exercise, and whether it has stalled
function stalled(hist) {
  if (hist.length < 4) return false;
  const best = h => Math.max(...h.sets.map(s => e1rm(s.kg || 0, s.reps)));
  const b = hist.map(best), before = Math.max(...b.slice(0, -3)), recent = Math.max(...b.slice(-3));
  return recent <= before * 1.005;
}

// smooth weight trend: each day moves 10% toward the new weight. Missing days are filled in a straight line.
function trendSeries(weights) {            // weights: [{d, kg}] sorted by day
  const out = []; let t = null, prev = null;
  const dayNum = d => Math.round(Date.parse(d + "T00:00:00Z") / 864e5);
  for (const w of weights) {
    if (t === null) { t = w.kg; }
    else {
      const gap = dayNum(w.d) - dayNum(prev.d);
      for (let i = 1; i <= gap; i++) { const v = prev.kg + (w.kg - prev.kg) * i / gap; t = t + 0.1 * (v - t); }
    }
    out.push({ d: w.d, kg: w.kg, trend: t }); prev = w;
  }
  return out;
}

// weekly food check-in. days: last 14 days oldest first [{d, kcal, meals, weighed, trend}]
function foodCheckin(days, s) {              // s: {tdee, kcalTarget, goalRate, exclude}
  const last7 = days.slice(-7);
  const isLogged = x => x.meals >= 2 && x.kcal >= 0.6 * s.kcalTarget;
  const logged7 = last7.filter(isLogged).length, weigh7 = last7.filter(x => x.weighed).length;
  const hold = why => ({ status: "hold", tdee: s.tdee, kcalTarget: s.kcalTarget, reason: why });
  if (s.exclude) return hold("This week is not counted (" + s.exclude + "). Target stays at " + s.kcalTarget + ".");
  if (logged7 < 4) return hold("Only " + logged7 + " of 7 days logged. Target stays at " + s.kcalTarget + ". Log at least 4 days.");
  if (weigh7 < 3) return hold("Only " + weigh7 + " weigh-ins this week. Target stays at " + s.kcalTarget + ". Weigh in every morning.");
  const lg = days.filter(isLogged), tr = days.filter(x => x.trend != null);
  if (tr.length < 2) return hold("Not enough weight data yet. Target stays at " + s.kcalTarget + ".");
  const meanKcal = lg.reduce((a, x) => a + x.kcal, 0) / lg.length;
  const span = Math.max(1, (Date.parse(tr[tr.length - 1].d) - Date.parse(tr[0].d)) / 864e5);
  const perDay = (tr[tr.length - 1].trend - tr[0].trend) / span;
  const raw = meanKcal - perDay * 5800;
  const tdee = Math.round(s.tdee + 0.5 * (raw - s.tdee));
  const surplus = Math.min(400, Math.max(150, s.goalRate * 5800 / 7));
  let target = tdee + surplus;
  target = Math.max(s.kcalTarget - 150, Math.min(s.kcalTarget + 150, target));
  target = Math.round(target / 25) * 25;
  const wk = perDay * 7, dir = target > s.kcalTarget ? "up" : target < s.kcalTarget ? "down" : "same";
  const reason = "Weight trend " + (wk >= 0 ? "+" : "") + wk.toFixed(2) + " kg a week, eating about " + Math.round(meanKcal / 10) * 10 + ". " +
    (dir === "same" ? "Target stays at " + target + "." : "Target goes " + dir + " to " + target + ".");
  return { status: "updated", tdee, raw: Math.round(raw), kcalTarget: target, weekly: wk, reason };
}

function lineChart(series, o) {
  o = o || {}; const W = 340, H = o.h || 170, L = 36, R = 6, T = 10, B = 22;
  const all = series.flatMap(s => s.pts);
  if (!all.length) return '<div class="mut" style="padding:28px 0;text-align:center;font-size:14px">Nothing to show yet.</div>';
  let x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0]));
  let y0 = Math.min(...all.map(p => p[1])), y1 = Math.max(...all.map(p => p[1]));

  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R);
  const Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  const yf = o.yf || (v => Math.round(v * 10) / 10), xf = o.xf || (v => v);
  const grid = "var(--line)", lab = "var(--t2)";
  let g = "";
  for (let i = 0; i < 3; i++) {
    const v = y0 + (y1 - y0) * (0.12 + 0.38 * i), y = Y(v).toFixed(1);
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="' + grid + '" stroke-width="1"/>'
      + '<text x="' + (L - 6) + '" y="' + (+y + 4) + '" text-anchor="end" font-size="10" font-weight="600" fill="' + lab + '">' + yf(v) + "</text>";
  }
  g += '<text x="' + L + '" y="' + (H - 4) + '" font-size="10" font-weight="600" fill="' + lab + '">' + esc(xf(x0)) + "</text>"
    + '<text x="' + (W - R) + '" y="' + (H - 4) + '" text-anchor="end" font-size="10" font-weight="600" fill="' + lab + '">' + esc(xf(x1)) + "</text>";
  for (const s of series) {
    if (!s.pts.length) continue;

  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '">' + g + "</svg>";
}

    const h = new Date().getHours();
    if (h >= 10 && h < 20) out.push("It is past your slot. The gym is open until eight. Late still counts, skipping does not.");
    else if (h >= 20) out.push("Gym is shut. Tomorrow you go at seven. Set the alarm now.");
  }
  if (weekInfo(d).easy) out.push("Easy week. Half the sets, same weights. Do not skip it and do not add to it.");
  const gap = gapDays(d);
  if (gap >= 4 && anySession) out.push(gap + " days since you last trained. Everything you are about to lift will feel heavy. Go anyway.");
  return out.slice(0, 2);
}

function vToday() {
  const d = today(), dt = new Date(), dayKey = S.dayMap[dow(d)], act = activeSession(), wi = weekInfo(d);
  const doneT = sessionsSorted().filter(s => s.d === d && s.endTs);
  const w = S.weights[d], tr = trendSeries(weightList());

    + (trend ? "Trend " + trend.toFixed(1) + " kg" : "Log it before you eat") + "</div></div>"
    + (w ? '<button class="r num" data-a="editWeight" style="color:var(--t0);font-weight:800;font-size:18px">' + w.kg.toFixed(1) + " kg</button>"
        : '<div class="field" style="width:152px"><input class="inp num" id="wIn" inputmode="decimal" placeholder="kg" style="min-height:42px"><button class="btn sm" style="width:auto;padding:0 14px" data-a="saveWeight">Save</button></div>') + "</div>";
  h += '<div class="row"><div class="grow"><div class="t">Sleep</div><div class="s">'
    + (sl && sl.min ? Math.floor(sl.min / 60) + " h " + (sl.min % 60) + " min" : "How did you actually sleep?") + '</div></div><div class="chips">'
    + ["bad", "ok", "good"].map(f => '<button class="chip' + (sl && sl.flag === f ? " on" : "") + '" data-a="sleep" data-v="' + f + '">' + f[0].toUpperCase() + f.slice(1) + "</button>").join("") + "</div></div>";
  h += '<div class="row"><div class="grow"><div class="t">Energy</div></div><div class="chips">'
    + ["low", "ok", "high"].map(f => '<button class="chip' + (en === f ? " on" : "") + '" data-a="energy" data-v="' + f + '">' + f[0].toUpperCase() + f.slice(1) + "</button>").join("") + "</div></div>";

function openWk() { $("#wk").classList.add("on"); renderWk(); wakeOn(); earbudOn(); clearInterval(openWk.iv); openWk.iv = setInterval(paintClock, 20000); }
function closeWk() { $("#wk").classList.remove("on"); clearInterval(openWk.iv); wakeOff(); earbudOff(); render(); }

function paintClock() {

}

function exBlock(sess, it, first) {
  const ex = getEx(it.ex); if (!ex) return "";
  const hist = histFor(it.ex, sess.id);
  const t = coachTarget(ex, hist, { sets: it.sets, flags: sess.flags, deload: sess.deload, gap: sess.gap });
  WK.tg[it.ex] = t;
  const logged = sessionSets(sess.id).filter(s => s.exId === it.ex);
  const maxIdx = logged.length ? Math.max(...logged.map(s => s.idx)) + 1 : 0;
  const n = Math.max(maxIdx, 1, t.sets + (WK.extra[it.ex] || 0));
  const last = hist.length ? hist[hist.length - 1] : null;
  const best = hist.length ? Math.max(...hist.flatMap(hh => hh.sets.map(s => e1rm(s.kg, s.reps)))) : null;
  const lastLogged = logged.slice().sort((a, b) => b.idx - a.idx)[0], done = logged.length >= t.sets;

  let rows = '<div class="sr h"><div>Set</div><div>Last time</div><div>' + (ex.eq === "bw" ? "+kg" : "kg") + "</div><div>" + (ex.t ? "Sec" : "Reps") + "</div><div></div></div>";
  for (let i = 0; i < n; i++) {
    const lg = logged.find(s => s.idx === i), k = it.ex + "|" + i, dr = WK.drafts[k] || {};
    const pv = last && last.sets[Math.min(i, last.sets.length - 1)];
    const kgV = lg ? lg.kg : dr.kg != null ? dr.kg : lastLogged ? lastLogged.kg : t.kg != null ? t.kg : "";
    const tr = t.reps[Math.min(i, t.reps.length - 1)];
    const rV = lg ? lg.reps : dr.reps != null ? dr.reps : tr != null ? tr : "";
    const pr = lg && best != null && e1rm(lg.kg, lg.reps) > best * 1.0001;
    rows += '<div class="sr' + (lg ? " ok" : "") + '"><div class="i">' + (i + 1) + '</div>'
      + '<div class="prev num">' + (pv ? (pv.kg ? kgTxt(pv.kg) + " x " : "") + pv.reps + unit(ex) : "") + "</div>"
      + '<input class="num" inputmode="decimal" data-i="kg" data-k="' + k + '" value="' + (kgV === 0 && ex.eq === "bw" ? "" : kgV === "" ? "" : kgTxt(kgV)) + '" placeholder="' + (ex.eq === "bw" ? "0" : "kg") + '"' + (lg ? " readonly" : "") + ">"
      + '<input class="num" inputmode="numeric" data-i="reps" data-k="' + k + '" value="' + rV + '" placeholder="' + (t.kg == null && !ex.t ? ex.r[0] + "-" + ex.r[1] : "") + '"' + (lg ? " readonly" : "") + ">"
      + '<button class="tick" data-a="tick" data-ex="' + it.ex + '" data-idx="' + i + '">' + ICON.tick + "</button>"
      + (pr ? '<div class="pr">Record</div>' : "") + "</div>";
  }

  let h = '<div class="ex' + (done ? " done" : "") + '" id="ex-' + it.ex + '"><div class="hd">'
    + '<button data-a="why" data-ex="' + it.ex + '" style="flex:1;min-width:0"><div class="nm">' + esc(ex.n) + '</div>'
    + '<div class="tg num">' + esc(tgtTxt(t, ex)) + "</div></button>"
    + '<button class="more" data-a="exMenu" data-ex="' + it.ex + '">&#183;&#183;&#183;</button></div>';
  if (WK.why === it.ex) h += '<div class="why">' + esc(t.reason) + (ex.cue ? "<br><br>" + esc(ex.cue) : "") + "</div>";
  if (ex.note) h += '<div class="note">' + esc(ex.note) + "</div>";
  if (first && !logged.length) {
    const wu = warmupSets(ex, t.kg);
    if (wu.length) h += '<div class="wu">Warm-up sets first: ' + wu.map(w => "<b>" + kgTxt(w[0]) + " x " + w[1] + "</b>").join(", ") + "</div>";
  }
  h += '<div class="sets">' + rows + "</div>";
  if (done && lastLogged && lastLogged.rir == null && ex.kind !== "core") {
    h += '<div class="rir"><div class="q">Last set. How many more could you have done?</div><div class="chips">'
      + [0, 1, 2, 3].map(v => '<button class="chip" data-a="rir" data-id="' + lastLogged.id + '" data-v="' + v + '">' + (v === 3 ? "3+" : v) + "</button>").join("") + "</div></div>";
  } else {
    h += '<div class="exf"><button data-a="addSet" data-ex="' + it.ex + '">Add set</button>'
      + (n > Math.max(1, maxIdx) ? '<button data-a="delSet" data-ex="' + it.ex + '">Remove set</button>' : "") + "</div>";
  }
  return h + "</div>";
}

function renderWk() {
  const sess = activeSession(); if (!sess) return closeWk();
  const body = $("#wk .body"), sc = body.scrollTop;
  $("#wk .head").innerHTML = '<button class="btn sm ghost" style="width:auto;padding:0 14px" data-a="minWk">Back</button>'
    + '<div style="flex:1;text-align:center"><div class="ttl">' + esc(DAY_NAMES[sess.dayKey] || "Workout") + '</div><div class="clock num" id="wkClock"></div></div>'
    + '<button class="btn sm" style="width:auto;padding:0 16px" data-a="finish">Finish</button>';
  let h = "";
  if (sess.deload) h += '<div class="coach"><p>Easy week. Half the sets, same weights, stop three reps early.</p></div>';
  else if (sess.flags >= 2) h += '<div class="coach"><p>Bad sleep and low energy. One set less. No records today, just show up and keep the weights.</p></div>';
  else if (sess.flags === 1) h += '<div class="coach"><p>Not your best day. Hold the weights and match last time. That is a win today.</p></div>';
  if (!sessionSets(sess.id).length && sess.dayKey !== "reset") {
    h += '<button class="card" style="display:block;width:100%;margin-bottom:12px" data-a="warmup"><div class="top" style="margin:0">'
      + '<div><div class="eyebrow">First</div><div style="font-size:17px;font-weight:750;letter-spacing:-.015em">Warm up, eight minutes</div></div>'
      + '<span class="chev">' + ICON.chev + "</span></div></button>";
  }
  let first = true;
  sess.items.forEach(it => { h += exBlock(sess, it, first); first = false; });
  h += '<button class="btn ghost" data-a="addEx">Add an exercise</button>';
  body.innerHTML = h; body.scrollTop = sc; paintClock();
}

});

ACT.why = el => { WK.why = WK.why === el.dataset.ex ? null : el.dataset.ex; renderWk(); };

ACT.delSet = el => { WK.extra[el.dataset.ex] = (WK.extra[el.dataset.ex] || 0) - 1; renderWk(); };

function logSet(exId, i) {
  const sess = activeSession(); if (!sess) return false;
  const ex = getEx(exId), k = exId + "|" + i;
  const row = $('.sr [data-k="' + CSS.escape(k) + '"]');
  const box = row ? row.closest(".sr") : null; if (!box) return false;
  const kg = numIn($('[data-i="kg"]', box).value) || 0;
  const reps = Math.round(numIn($('[data-i="reps"]', box).value) || 0);
  if (!(reps > 0)) { toast(ex.t ? "Type the seconds first." : "Type your reps first."); return false; }
  if (ex.eq !== "bw" && !(kg > 0)) { toast("Type the weight first."); return false; }
  const t = WK.tg[exId] || { reps: [] };
  addEvent("set.logged", { sessionId: sess.id, exId, idx: i, kg, reps, tKg: t.kg, tReps: t.reps[Math.min(i, t.reps.length - 1)] });
  delete WK.drafts[k];
  const items = sess.items, lastEx = items[items.length - 1].ex === exId;
  const cnt = sessionSets(sess.id).filter(s => s.exId === exId).length;
  if (!(lastEx && cnt >= (t.sets || 1))) startRest(ex.rest, ex.n);
  haptic();
  return true;
}

ACT.tick = el => {
  ensureAudio();
  const sess = activeSession(); if (!sess) return;
  const exId = el.dataset.ex, i = +el.dataset.idx, k = exId + "|" + i;
  const lg = sessionSets(sess.id).find(s => s.exId === exId && s.idx === i);
  if (lg) { addEvent("entity.deleted", { ref: lg.id }); WK.drafts[k] = { kg: lg.kg, reps: lg.reps }; return renderWk(); }
  logSet(exId, i); renderWk();
};
ACT.rir = el => { addEvent("set.rir", { ref: el.dataset.id, rir: +el.dataset.v }); haptic(); renderWk(); };

// The next unticked set on screen, so the earbuds know what to log.
function nextOpenSet() {
  const sess = activeSession(); if (!sess) return null;
  for (const it of sess.items) {
    const t = WK.tg[it.ex] || { sets: it.sets };
    const logged = sessionSets(sess.id).filter(s => s.exId === it.ex);
    const n = Math.max(logged.length, t.sets || it.sets);
    for (let i = 0; i < n; i++) if (!logged.find(s => s.idx === i)) return { ex: it.ex, i };
  }
  return null;
}

ACT.exSave = el => {

function editSession(fn) {

        ' data-from="' + ex.id + '" data-to="' + a.id + '"')).join("") + "</div>"

ACT.swapPlan = el => { UI.swapPlan = !UI.swapPlan; ACT.swap(el); };
ACT.swapTo = el => {

ACT.addEx = () => exPicker("addExTo", "Add an exercise");

ACT.finish = () => {
  const s = activeSession(); if (!s) return closeWk();

  if (!n) return openSheet('<h3>Nothing logged</h3><p>You have not ticked a single set.</p><button class="btn danger" data-a="discardWk">Bin this workout</button><div style="height:10px"></div><button class="btn ghost" data-a="closeSheet">Keep going</button>');
  const planned = s.items.reduce((a, it) => a + ((WK.tg[it.ex] || {}).sets || it.sets), 0);
  if (n < planned) return openSheet("<h3>Finishing early?</h3><p>" + n + " of " + planned + " sets. The ones you skip do not count and the coach will see it.</p>"
    + '<button class="btn" data-a="finish2">Finish anyway</button><div style="height:10px"></div><button class="btn ghost" data-a="closeSheet">Keep going</button>');

ACT.discardWk = () => { const s = activeSession(); if (s) addEvent("entity.deleted", { ref: s.id }); closeSheet(); stopRest(); closeWk(); };
ACT.finish2 = () => { const s = activeSession(); if (!s) return; addEvent("session.finished", { sessionId: s.id }); stopRest(); closeWk(); showSummary(s.id); syncNow(); };

const volOf = sets => sets.reduce((a, s) => a + (s.kg ? s.kg * s.reps : s.reps), 0);

function showSummary(sid) {
  const s = S.sessions[sid]; if (!s) return;
  const sets = sessionSets(sid), min = Math.round((Date.parse(s.endTs || new Date().toISOString()) - Date.parse(s.startTs)) / 60000);
  const prs = [];
  new Set(sets.map(x => x.exId)).forEach(exId => {
    const hist = histFor(exId).filter(h => h.d < s.d || (h.d === s.d && h.sid < sid));
    if (!hist.length) return;
    const best = Math.max(...hist.flatMap(h => h.sets.map(x => e1rm(x.kg, x.reps))));
    const mine = sets.filter(x => x.exId === exId);
    const top = mine.reduce((a, x) => e1rm(x.kg, x.reps) > e1rm(a.kg, a.reps) ? x : a, mine[0]);
    if (e1rm(top.kg, top.reps) > best * 1.0001) prs.push(getEx(exId).n + ": " + (top.kg ? kgTxt(top.kg) + " kg x " : "") + top.reps);
  });
  const prev = sessionsSorted().filter(x => x.dayKey === s.dayKey && x.endTs && x.id !== s.id && (x.d < s.d || (x.d === s.d && x.startTs < s.startTs))).pop();
  let cmp = "";
  if (prev) {
    const a = volOf(sessionSets(prev.id)), b = volOf(sets), pc = a ? Math.round((b - a) / a * 100) : 0;
    cmp = '<div class="row"><div class="grow"><div class="t">Against last time</div><div class="s">Total work moved</div></div>'
      + '<div class="r num" style="color:var(--t0);font-weight:800">' + (pc >= 0 ? "+" : "") + pc + "%</div></div>";
  }
  const line = prs.length ? prs.length + (prs.length === 1 ? " record." : " records.") + " Eat your protein and sleep."
    : prev ? "No records today. Same day next week, you beat these numbers."
    : "First one logged. Everything from here is measured against it.";
  openSheet("<h3>" + esc(DAY_NAMES[s.dayKey] || "Workout") + ' done</h3><div class="coach"><p>' + esc(line) + "</p></div>"
    + '<div class="card flush"><div class="row"><div class="grow"><div class="t">Time</div></div><div class="r num">' + min + ' min</div></div>'
    + '<div class="row"><div class="grow"><div class="t">Sets</div></div><div class="r num">' + sets.length + "</div></div>" + cmp + "</div>"
    + (prs.length ? '<h2>New records</h2><div class="card flush">' + prs.map(p => '<div class="row"><div class="grow"><div class="t">' + esc(p) + "</div></div></div>").join("") + "</div>" : "")
    + '<h2>Now</h2><div class="card flush">' + rowBtn("cooldown", "Cool down", "Five minutes. Do not walk out without it.") + "</div>"
    + '<div style="height:14px"></div><button class="btn" data-a="closeSheet">Done</button>');
}
ACT.summary = el => showSummary(el.dataset.id);

// ----- rest timer -----

let REST = null, restIv = null, AC = null, wake = null;

function ensureAudio() {
  try {
    if ("audioSession" in navigator) navigator.audioSession.type = S.settings.mix ? "ambient" : "playback";
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state !== "running") AC.resume();
  } catch (_) {}
}
function beep() {
  if (!AC) return;
  try {
    const t = AC.currentTime + 0.02, v = Math.max(0.02, S.settings.vol);
    [[659.25, 0], [880, 0.18], [1318.5, 0.36]].forEach(([f, o]) => {
      const osc = AC.createOscillator(), g = AC.createGain();
      osc.type = "sine"; osc.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + o);
      g.gain.linearRampToValueAtTime(v * 0.55, t + o + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + o + 0.5);
      osc.connect(g); g.connect(AC.destination);
      osc.start(t + o); osc.stop(t + o + 0.55);
    });
  } catch (_) {}
}
function startRest(sec, label) {
  if (!S.settings.restOn || !(sec > 0)) return;
  REST = { end: Date.now() + sec * 1000, total: sec, label: label || "", fired: false };
  try { localStorage.setItem("nitfit:rest", JSON.stringify(REST)); } catch (_) {}
  if (!restIv) restIv = setInterval(paintRest, 250);
  paintRest();
}
function stopRest() { REST = null; try { localStorage.removeItem("nitfit:rest"); } catch (_) {} paintRest(); }
function paintRest() {
  const el = $("#rest");
  if (!REST) { el.classList.remove("on", "go"); clearInterval(restIv); restIv = null; return; }
  const left = (REST.end - Date.now()) / 1000;
  el.classList.add("on");
  if (left <= 0) {
    if (!REST.fired) { REST.fired = true; if (left > -3) { beep(); haptic(); } }
    el.classList.add("go");
    $("#rest .time").textContent = "GO";
    $("#rest .lbl").textContent = "Rest is over";
    $("#rest .bar i").style.width = "100%";
    if (left < -20) stopRest();
    return;
  }
  el.classList.remove("go");
  const s = Math.ceil(left);
  $("#rest .time").textContent = Math.floor(s / 60) + ":" + pad2(s % 60);
  $("#rest .lbl").textContent = "Rest";
  $("#rest .bar i").style.width = Math.max(0, Math.min(100, (1 - left / REST.total) * 100)) + "%";
}
ACT.restAdd = el => {
  if (!REST) return;
  const dlt = +el.dataset.v * 1000;
  REST.end = Math.max(Date.now() + 1000, REST.end + dlt);
  REST.total = Math.max(5, REST.total + dlt / 1000);
  REST.fired = false;
  try { localStorage.setItem("nitfit:rest", JSON.stringify(REST)); } catch (_) {}
  haptic(); paintRest();
};
ACT.restSkip = () => { haptic(); stopRest(); };

async function wakeOn() { try { if ("wakeLock" in navigator) wake = await navigator.wakeLock.request("screen"); } catch (_) {} }
function wakeOff() { try { if (wake) wake.release(); } catch (_) {} wake = null; }

// ----- logging from the earbuds -----
// A squeeze on the AirPods is a play or pause button. If NitFit is the thing
// holding the phone's audio, that button lands here and logs the next set.
// If music is playing, the music app owns the button instead, so this does
// nothing. That is a phone rule, not a bug.

let silent = null;
function earbudOn() {
  if (!S.settings.earbud || !("mediaSession" in navigator)) return;
  try {
    if (!silent) {
      silent = document.createElement("audio");
      silent.loop = true; silent.volume = 0.0001;
      silent.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
    }
    silent.play().catch(() => {});
    navigator.mediaSession.metadata = new MediaMetadata({ title: "NitFit", artist: "Squeeze to log a set" });
    navigator.mediaSession.playbackState = "playing";
    const fire = () => { const nx = nextOpenSet(); if (nx && logSet(nx.ex, nx.i)) renderWk(); else if (REST) stopRest(); };
    ["play", "pause", "nexttrack"].forEach(a => { try { navigator.mediaSession.setActionHandler(a, fire); } catch (_) {} });
  } catch (_) {}
}
function earbudOff() {
  try {
    if (silent) silent.pause();
    ["play", "pause", "nexttrack"].forEach(a => { try { navigator.mediaSession.setActionHandler(a, null); } catch (_) {} });
  } catch (_) {}
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    if ($("#wk").classList.contains("on")) wakeOn();
    paintRest();
    if (KV.token) syncNow();
  }
});

// swipe the figure to turn it round
(function () {
  let x0 = null, y0 = null;
  document.addEventListener("touchstart", e => {
    const w = e.target.closest && e.target.closest("#figwrap");
    if (!w) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.6) ACT.figFlip();

})();

const scoreOf = h => Math.max(...h.sets.map(s => e1rm(s.kg, s.reps)));
const bestSet = h => h.sets.reduce((a, s) => e1rm(s.kg, s.reps) > e1rm(a.kg, a.reps) ? s : a, h.sets[0]);

// Hard sets done per muscle this week. A helper muscle counts as half a set.
function weekVolume(d) {
  const ws = addDays(d, -dow(d)), we = addDays(ws, 6), cnt = {};
  Object.values(S.sets).forEach(st => {
    if (st.d < ws || st.d > we || !S.sessions[st.sessionId]) return;
    const ex = getEx(st.exId); if (!ex) return;
    cnt[ex.m] = (cnt[ex.m] || 0) + 1;
    (ex.s || []).forEach(m => (cnt[m] = (cnt[m] || 0) + 0.5));
  });
  return cnt;
}

function vProgress() {
  let h = '<div class="top"><div><div class="eyebrow">Everything you have logged</div><h1>Progress</h1></div>' + syncChip() + "</div>";
  h += '<div class="seg">' + [["lifts", "Lifts"], ["weight", "Weight"], ["muscles", "Muscles"]]
    .map(x => '<button class="' + (UI.prog === x[0] ? "on" : "") + '" data-a="prog" data-v="' + x[0] + '">' + x[1] + "</button>").join("") + "</div>";

  if (UI.prog === "lifts") h += progLifts();
  else if (UI.prog === "weight") h += progWeight();
  else h += progMuscles();
  return h;
}
ACT.prog = el => { UI.prog = el.dataset.v; render(); };

function progLifts() {
  const list = Object.keys(S.byEx).map(id => ({ ex: getEx(id), hist: histFor(id) }))
    .filter(x => x.ex && x.hist.length)
    .sort((a, b) => a.hist[a.hist.length - 1].d < b.hist[b.hist.length - 1].d ? 1 : -1);
  if (!list.length) return '<div class="card empty"><h3>No lifts yet</h3><p>Every exercise you log gets its own graph here. Go and train.</p></div>';
  return '<div class="card flush">' + list.map(x => {
    const last = x.hist[x.hist.length - 1], b = bestSet(last), st = stalled(x.hist);
    return '<button class="row" data-a="exGraph" data-ex="' + x.ex.id + '"><div class="grow"><div class="t">' + esc(x.ex.n) + '</div>'
      + '<div class="s num">' + (b.kg ? kgTxt(b.kg) + " kg x " : "") + b.reps + unit(x.ex) + ", " + niceDate(last.d)
      + (st ? ' <span class="tag hot">Stuck</span>' : "") + "</div></div>"
      + spark(x.hist.slice(-12).map(hh => scoreOf(hh))) + "</button>";
  }).join("") + "</div>";
}

ACT.exGraph = el => {
  const ex = getEx(el.dataset.ex), hist = histFor(ex.id);
  if (!hist.length) return openSheet("<h3>" + esc(ex.n) + "</h3><p>No history yet. Log it once and the graph starts.</p>");
  const bw = hist.every(h => h.sets.every(s => !s.kg));
  const pts = hist.map(h => [dayNum(h.d), scoreOf(h)]);
  const best = hist.reduce((a, h) => scoreOf(h) > scoreOf(a) ? h : a, hist[0]);
  const b = bestSet(best), st = stalled(hist);
  openSheet("<h3>" + esc(ex.n) + "</h3><p>"
    + (bw ? "Your best set each workout." : "Strength score. A fair estimate of the most you could lift once. Up means stronger, nothing else matters.")
    + (st ? ' <span class="tag hot">Stuck</span>' : "") + "</p>"
    + '<div class="card">' + lineChart([{ pts, color: "var(--t0)", dots: true, w: 2.4 }], { xf: dayLabel, h: 180, yf: v => Math.round(v) })
    + '<div class="row" style="padding:14px 0 0;border-top:.5px solid var(--line);margin-top:10px"><div class="grow"><div class="s">Best ever</div></div>'
    + '<div class="r num" style="color:var(--t0);font-weight:800">' + (b.kg ? kgTxt(b.kg) + " kg x " : "") + b.reps + unit(ex) + "</div></div></div>"
    + '<h2>Every session</h2><div class="card flush">' + hist.slice(-30).reverse().map(h =>
        '<div class="row"><div class="grow"><div class="t num" style="font-size:15px">' + esc(setsTxt(h.sets, ex)) + '</div></div>'
        + '<div class="r" style="font-size:14px">' + niceDate(h.d) + "</div></div>").join("") + "</div>");
};

function progWeight() {
  const tr = trendSeries(weightList());
  if (!tr.length) return '<div class="card empty"><h3>No weigh-ins yet</h3><p>Weigh in every morning on the Today screen. The line here shows your real direction, not the daily noise.</p></div>';
  const now = tr[tr.length - 1];
  const t7 = tr.filter(x => dayNum(x.d) <= dayNum(now.d) - 7).pop();
  const wk = t7 ? (now.trend - t7.trend) / ((dayNum(now.d) - dayNum(t7.d)) / 7) : null;
  let h = '<div class="card"><div class="top" style="margin-bottom:6px">'
    + '<div><div class="eyebrow">Trend</div><div class="display num">' + now.trend.toFixed(1) + '<span class="u"> kg</span></div></div>'
    + '<div style="text-align:right"><div class="eyebrow">Per week</div><div class="num" style="font-size:26px;font-weight:800;letter-spacing:-.03em">'
    + (wk == null ? "..." : (wk >= 0 ? "+" : "") + wk.toFixed(2)) + "</div></div></div>"
    + '<p class="tiny" style="margin:8px 0 14px">' + esc(wk == null ? "One more week of weigh-ins and this shows your real pace." : paceLine(wk)) + "</p>"
    + lineChart([
        { pts: tr.map(x => [dayNum(x.d), x.kg]), color: "var(--t3)", dotsOnly: true, r: 2 },
        { pts: tr.map(x => [dayNum(x.d), x.trend]), color: "var(--t0)", w: 2.6 },
      ], { xf: dayLabel, h: 190 }) + "</div>";
  h += '<button class="btn ghost" data-a="addPastWeight" style="margin-top:12px">Add or fix a weigh-in</button>';
  return h;
}

function paceLine(wk) {
  if (wk < -0.05) return "You are losing weight. You cannot build muscle like this. Eat more, starting today.";
  if (wk < 0.05) return "Flat. Nothing is being built at this rate. Eat more.";
  if (wk > 0.35) return "Too fast. Past 0.35 kg a week most of it is fat. Pull the food back a little.";
  return "Good pace. Slow gain is mostly muscle. Hold it here.";
}

ACT.addPastWeight = () => openSheet('<h3>Add or fix a weigh-in</h3><div class="field" style="margin-bottom:12px">'

// Where the week's work actually went, shown on the body and in numbers.
function progMuscles() {
  const d = today(), cnt = weekVolume(d);
  const heat = {};
  MUSCLES.forEach(m => {
    const band = SET_BAND[m] || [8, 16], v = cnt[m] || 0;
    const lvl = v >= band[0] ? 2 : v > 0 ? 1 : 0;
    if (lvl) (MUSCLE_TO_FIG[m] || []).forEach(k => { if ((heat[k] || 0) < lvl) heat[k] = lvl; });
  });
  const side = UI.side || "front";
  let h = '<div class="card" style="padding:10px 16px 20px"><div class="figwrap" id="figwrap">'
    + '<button class="figside l" data-a="figFlip">' + ICON.left + "</button>"
    + '<div class="flipper">' + figSvg(side, heat, { flat: true }) + "</div>"
    + '<button class="figside r" data-a="figFlip">' + ICON.right + "</button>"
    + '<div class="figlabel">' + (side === "front" ? "Front" : "Back") + "</div></div>"
    + '<p class="tiny" style="text-align:center;margin-top:16px">Red means that muscle got enough work this week. Dark red means some, but not enough. Grey means you ignored it.</p></div>';

  const under = MUSCLES.filter(m => (cnt[m] || 0) < (SET_BAND[m] || [8])[0]);
  if (Object.keys(cnt).length && under.length) {

      + "<p>Weeks like this are why people train for years and look the same.</p></div>";

  h += '<h2>Hard sets this week</h2><div class="card">'

      const band = SET_BAND[m], v = cnt[m] || 0, sc = 24;

        + '<b style="left:' + (band[0] / sc * 100) + "%;width:" + ((band[1] - band[0]) / sc * 100) + '%"></b>'
        + '<i style="width:' + Math.min(100, v / sc * 100) + '%"></i></div>'
        + '<div class="v num">' + (Math.round(v * 2) / 2) + "</div></div>";
    }).join("")
    + '<p class="tiny" style="margin-top:14px">The lighter block on each bar is the zone that actually grows the muscle. Helping out counts as half a set.</p></div>';
  return h;
}

const latestM = site => S.measures.filter(m => m.site === site).sort((a, b) => a.d < b.d ? -1 : 1);
const PH_URL = {};
function curWeight() { const tr = trendSeries(weightList()); return tr.length ? tr[tr.length - 1].trend : 60; }

function bfRange() {
  const w = latestM("waist").pop(), n = latestM("neck").pop(), g = S.settings.bfGuess;
  if (w && n) {
    const v = navyBf(w.cm, n.cm, S.settings.heightCm);
    if (v != null) { const mid = (v + 2.6 + g) / 2; return { lo: Math.max(4, Math.round(mid - 3)), hi: Math.round(mid + 3), mid, measured: true }; }
  }

function futureCard(W, bf, hM) {
  const lean = W * (1 - bf.mid / 100), cap = leanCap(hM);
  const at = (mo, k) => { const b = mo <= 12 ? 0.13 : mo <= 24 ? 0.12 : 0.11; return Math.min(cap, lean + leanGain(mo, k)) / (1 - b); };
  const rows = [[3, "3 months"], [6, "6 months"], [12, "1 year"], [24, "2 years"], [60, "5 years"]];
  const t0 = dayNum(today()), xs = [0, 3, 6, 9, 12, 18, 24];
  const line = k => xs.map(m => [t0 + m * 30.44, at(m, k)]);
  const tr = trendSeries(weightList()).map(x => [dayNum(x.d), x.trend]);
  const move = (dayNum("2027-06-25") - t0) / 30.44;

  let h = '<div class="card"><p class="tiny" style="margin:0 0 14px">No fake before and after pictures. These are honest ranges for someone training natural who eats and sleeps properly. Slow, average, fast.</p>'
    + lineChart([
        { pts: line(1), color: "var(--t3)", w: 1.8, dash: "4 4" },
        { pts: line(3), color: "var(--t3)", w: 1.8, dash: "4 4" },
        { pts: line(2), color: "var(--t1)", w: 2.4 },
      ].concat(tr.length > 1 ? [{ pts: tr, color: "var(--t0)", w: 2.6 }] : []),
      { xf: n => { const t = new Date(n * 864e5); return MONTHS[t.getUTCMonth()] + " " + String(t.getUTCFullYear()).slice(2); }, h: 180, yf: v => Math.round(v) })
    + '<div style="overflow-x:auto;margin-top:14px"><table class="num" style="width:100%;border-collapse:collapse;font-size:14px">'
    + '<tr><th style="text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--t2);padding-bottom:8px">When</th>'
    + '<th style="font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--t2)">Slow</th>'
    + '<th style="font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--t2)">Likely</th>'
    + '<th style="font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--t2)">Fast</th></tr>'
    + rows.map(r => '<tr><td style="padding:7px 0;color:var(--t1);font-weight:600">' + r[1] + '</td>'
      + '<td style="text-align:center;color:var(--t2)">' + at(r[0], 1).toFixed(0) + '</td>'
      + '<td style="text-align:center;font-weight:800">' + at(r[0], 2).toFixed(0) + ' kg</td>'
      + '<td style="text-align:center;color:var(--t2)">' + at(r[0], 3).toFixed(0) + "</td></tr>").join("") + "</table></div>";
  if (move > 0.5) {
    h += '<p class="tiny" style="margin-top:14px">When you fly out in mid 2027: about <b style="color:var(--t0)">' + at(move, 1).toFixed(0)
      + " to " + at(move, 3).toFixed(0) + " kg</b>, lean. Anything above that is fat, not muscle.</p>";
  }
  h += '<p class="tiny" style="margin-top:8px">The solid line is your real trend. Weights shown lean, around 11 to 13 percent. At your height the natural ceiling is roughly '
    + Math.round(cap / 0.89) + " kg. Almost nobody gets there.</p></div>";
  return h;
}

async function onPhoto(file, pose, d) {
  try {
    const url = URL.createObjectURL(file), img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const sc = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.82));
    const buf = await blob.arrayBuffer(), photoId = "p" + uid();
    await mediaPut(photoId, buf, "image/jpeg");
    addEvent("photo.added", { pose, photoId }, d);
    toast("Saved on this phone"); render();
  } catch (e) { toast("Could not read that photo. Try another."); }
}
async function photoUrl(id) {
  if (PH_URL[id]) return PH_URL[id];
  const m = await mediaGet(id).catch(() => null);
  if (!m) return null;
  return PH_URL[id] = URL.createObjectURL(new Blob([m.buf], { type: m.type }));
}
function hydratePhotos(root) {
  $$("img[data-ph]", root).forEach(async im => {
    const u = await photoUrl(im.dataset.ph);
    if (u) im.src = u;
    else im.replaceWith(Object.assign(document.createElement("span"), { textContent: "On another phone", className: "mut tiny" }));
  });
}

}

  const wi = weekInfo(today());
  addEvent("settings.upserted", wi.easy ? { easyOff: wi.ws, easyOn: null } : { easyOn: wi.ws, easyOff: null });
  if (!S.settings.blockStart) addEvent("settings.upserted", { blockStart: today() });
  render();
};
ACT.targets = () => {
  const st = S.settings;
  const f = (id, label, v, hint) => '<div class="row"><div class="grow"><div class="t">' + label + '</div><div class="s">' + hint + "</div></div>"
    + '<input class="inp num" id="' + id + '" inputmode="decimal" value="' + v + '" style="width:104px;min-height:42px"></div>';
  openSheet('<h3>Your numbers</h3><p>Only change these if you know why.</p><div class="card flush">'
    + f("tH", "Height", st.heightCm, "cm") + f("tB", "Body fat guess", st.bfGuess, "percent")
    + f("tS", "Bad sleep is under", st.sleepBadH, "hours") + '</div><div style="height:14px"></div>'
    + '<button class="btn" data-a="targetsSave">Save</button>');
};
ACT.targetsSave = () => {
  const g = id => numIn($("#" + id).value);
  const p = { heightCm: g("tH"), bfGuess: g("tB"), sleepBadH: g("tS") };
  if (!(p.heightCm > 120 && p.heightCm < 230 && p.bfGuess > 3 && p.bfGuess < 50 && p.sleepBadH > 3 && p.sleepBadH < 12)) return toast("One of those looks wrong.");
  addEvent("settings.upserted", p); closeSheet(); render();
};

// ----- plan editor -----

ACT.planDay = el => { UI.planDraft = clone(S.plan); UI.planK = el.dataset.day; planSheet(); };
function planSheet() {
  const k = UI.planK, items = UI.planDraft[k] || (UI.planDraft[k] = []);
  const sc = $("#sheet .pn").scrollTop;
  openSheet("<h3>" + DAY_NAMES[k] + '</h3><p>Change it, then save. Keep the first big lift the same for a whole six weeks, that is how you see progress.</p>'
    + '<div class="card flush">' + items.map((it, i) => {
      const ex = getEx(it.ex);
      return '<div class="row"><div class="grow"><div class="t">' + esc(ex ? ex.n : it.ex) + '</div><div class="s">'
        + '<button data-a="planMove" data-i="' + i + '" data-v="-1">Up</button> · '
        + '<button data-a="planMove" data-i="' + i + '" data-v="1">Down</button> · '
        + '<button style="color:var(--m2)" data-a="planDel" data-i="' + i + '">Remove</button></div></div>'
        + '<div class="chips"><button class="chip" data-a="planSets" data-i="' + i + '" data-v="-1">&#8722;</button>'
        + '<span class="num" style="min-width:20px;text-align:center;font-weight:700;align-self:center">' + it.sets + "</span>"
        + '<button class="chip" data-a="planSets" data-i="' + i + '" data-v="1">+</button></div></div>';
    }).join("") + "</div>"
    + '<div style="height:12px"></div><button class="btn ghost" data-a="planAddPick">Add an exercise</button>'
    + '<div style="height:10px"></div><button class="btn" data-a="planSave">Save</button>');
  $("#sheet .pn").scrollTop = sc;
}
ACT.planSets = el => { const it = UI.planDraft[UI.planK][+el.dataset.i]; it.sets = Math.max(1, Math.min(8, it.sets + +el.dataset.v)); planSheet(); };
ACT.planMove = el => {
  const a = UI.planDraft[UI.planK], i = +el.dataset.i, j = i + +el.dataset.v;
  if (j < 0 || j >= a.length) return;
  const t = a[i]; a[i] = a[j]; a[j] = t; planSheet();
};
ACT.planDel = el => { UI.planDraft[UI.planK].splice(+el.dataset.i, 1); planSheet(); };
ACT.planAddPick = () => exPicker("planAdd", "Add to " + DAY_NAMES[UI.planK]);
ACT.planAdd = el => { const a = UI.planDraft[UI.planK]; if (!a.some(x => x.ex === el.dataset.ex)) a.push({ ex: el.dataset.ex, sets: 3 }); planSheet(); };
ACT.planSave = () => { addEvent("plan.upserted", { plan: UI.planDraft }); closeSheet(); toast("Plan saved"); render(); };
ACT.newEx = () => openSheet('<h3>Add your own exercise</h3>'
  + '<input class="inp" id="nxN" placeholder="Name" style="margin-bottom:12px"><h2>Muscle</h2>'
  + '<select class="inp" id="nxM">' + MUSCLES.map(m => "<option>" + m + "</option>").join("") + "</select>"
  + '<h2>What you lift</h2><select class="inp" id="nxE"><option value="machine">Machine</option><option value="cable">Cable</option>'
  + '<option value="db">Dumbbells</option><option value="bb">Barbell</option><option value="smith">Smith machine</option><option value="bw">Bodyweight</option></select>'
  + '<div style="height:16px"></div><button class="btn" data-a="newExSave">Save</button>');
ACT.newExSave = () => {
  const n = $("#nxN").value.trim(), eq = $("#nxE").value;
  if (!n) return toast("Give it a name.");
  addEvent("exercise.upserted", { exId: "c_" + uid(), custom: true, n, m: $("#nxM").value, s: [], eq, kind: "i", r: [10, 15], rest: 90, step: STEP_BY_EQ[eq], cue: "" });
  closeSheet(); toast("Saved. Add it to a day in Your week."); render();
};

// ----- router and start-up -----

const VIEWS = { today: vToday, progress: vProgress, body: vBody, more: vMore };
function render() {
  if (!S) return;
  const app = $("#app");
  app.innerHTML = VIEWS[TAB]();
  hydratePhotos(app);
  $$("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === TAB));
}
ACT.tab = el => { if (TAB !== el.dataset.tab) { TAB = el.dataset.tab; UI.tapped = null; haptic(); render(); window.scrollTo(0, 0); } };

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el) return;
  const f = ACT[el.dataset.a];
  if (f) f(el, e);
});

async function boot() {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (ios && !standalone) {
    $("#tabs").style.display = "none";
    $("#app").innerHTML = '<div class="center"><h1>Put NitFit on your Home Screen</h1>'
      + '<p class="sub">NitFit only runs from its own icon. That is what keeps your data in one safe place.</p>'
      + '<div class="card" style="text-align:left"><ol class="steps" style="margin:0">'
      + "<li>Tap the <b>Share</b> button, the square with the arrow.</li>"
      + "<li>Scroll down, tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li>"
      + "<li>Close Safari and open <b>NitFit</b> from the new icon.</li></ol></div>"
      + '<p class="tiny">Always open it from the icon, never from a link.</p></div>';
    return;
  }
  try { await coreBoot(); }
  catch (e) {
    $("#app").innerHTML = '<div class="center"><h1>Storage is blocked</h1><p class="sub">NitFit could not open its storage on this phone. Close it and open it again. If you are in Private Browsing, turn that off.</p></div>';
    return;
  }
  applyTheme();
  matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (S.settings.theme === "system") applyTheme(); });
  try { if (navigator.storage && navigator.storage.persist && KV.persist == null) kvSet("persist", await navigator.storage.persist()); } catch (_) {}
  try {
    const r = JSON.parse(localStorage.getItem("nitfit:rest") || "null");
    if (r && r.end > Date.now() - 15000) { REST = r; REST.fired = REST.end < Date.now(); restIv = setInterval(paintRest, 250); }
  } catch (_) {}
  render();
  if (KV.token) syncNow();
  else if (!KV.skipSetup) ACT.keySetup();
  setInterval(() => { if (!document.hidden && KV.token) syncNow(); syncPaint(); }, 5 * 60e3);
  setInterval(syncPaint, 30e3);
  addEventListener("online", () => syncNow());
  addEventListener("resize", fitCmp);
  let lastDay = today();
  setInterval(() => { if (today() !== lastDay) { lastDay = today(); UI.side = null; render(); } }, 60e3);
}
boot();

</script>
</body>
</html>
