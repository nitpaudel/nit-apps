<!DOCTYPE html>
<html lang="en" data-card="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>NitFit</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NitFit">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/nf3-180.png">
<link rel="icon" href="icons/nf3-192.png">
<script>try{var c=localStorage.getItem("nitfit:card");if(c)document.documentElement.dataset.card=c}catch(e){}</script>
<style>
:root{
  --base:#000; --text:#f5f5f7; --text2:#8e8e93; --text3:#545458;
  --sep:rgba(255,255,255,.09); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.14);
  --green:#30d158; --red:#ff453a; --amber:#ffd60a;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --ease:cubic-bezier(.16,1,.3,1);
  /* card surfaces, Glass by default */
  --card:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));
  --card-sh:inset 0 0 0 .5px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.16);
  --ctl:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04));
  --ctl-sh:inset 0 0 0 .5px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.05);
  --ctl-on:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.16));
  --ctl-on-sh:inset 0 0 0 .5px rgba(255,255,255,.4),inset 0 1px 0 rgba(255,255,255,.55);
  --inp:rgba(255,255,255,.07);
}
html[data-card="default"]{
  --card:#1c1c1e; --card-sh:none;
  --ctl:#2c2c2e; --ctl-sh:none; --ctl-on:#48484a; --ctl-on-sh:none; --inp:#2c2c2e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--base);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg{display:block}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ===== layout ===== */
#main{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding:calc(var(--sat) + 6px) 16px calc(var(--sab) + 150px)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 4px 16px}
.eyebrow{font-size:13px;letter-spacing:.005em;color:var(--text2);font-weight:500;margin-bottom:2px}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.025em}
h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:26px 4px 10px}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--ctl);box-shadow:var(--ctl-sh)}
.round svg{width:20px;height:20px}
.card{position:relative;border-radius:22px;background:var(--card);box-shadow:var(--card-sh);margin-bottom:12px}
.pad{padding:16px 18px}
.lbl{font-size:13px;letter-spacing:.005em;color:var(--text2);font-weight:500}
.sub{font-size:15px;letter-spacing:-.005em;color:var(--text2)}
.small{font-size:13px;letter-spacing:.005em;color:var(--text2);line-height:1.4}
.link{font-size:15px;letter-spacing:-.005em;color:var(--text2);font-weight:500;padding:6px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--text3)}
.banner{display:flex;align-items:center;gap:10px;padding:12px 16px;margin-bottom:12px;border-radius:16px;font-size:15px;letter-spacing:-.005em;background:rgba(255,69,58,.12);color:#ffb3ad}
.banner button{margin-left:auto;font-weight:600;color:var(--text)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;border-radius:22px;font-size:17px;letter-spacing:-.01em;font-weight:600}
.pill.white{background:#f5f5f7;color:#000}
.pill.soft{background:var(--ctl);box-shadow:var(--ctl-sh)}
.pill.red{color:var(--red);background:rgba(255,69,58,.12)}
.pill.wide{width:100%;height:52px;border-radius:26px}
.pill:active,.chip:active,.row:active,.round:active,.tick:active,.qchip:active{transform:scale(.96);transition:transform .08s}
.pill,.chip,.row,.round,.tick,.qchip{transition:transform .25s var(--ease),background .2s,color .2s}
.empty{padding:28px 20px;text-align:center;color:var(--text2);font-size:15px;letter-spacing:-.005em}
.empty b{display:block;color:var(--text);font-size:20px;font-weight:600;margin-bottom:4px}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;position:relative;min-height:52px}
.row + .row::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-weight:500;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{display:block;font-size:13px;letter-spacing:.005em;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none;font-size:15px;letter-spacing:-.005em;color:var(--text2)}
.row .r b{display:block;color:var(--text);font-weight:500;font-size:17px;letter-spacing:-.01em}
.chev{width:8px;height:14px;color:var(--text3);flex:none}
.row.now .m b{color:var(--text)}
.row.past{opacity:.45}
.time{width:52px;flex:none;font-size:15px;letter-spacing:-.005em;color:var(--text2);font-variant-numeric:tabular-nums}

/* check-in */
.ck{display:flex;align-items:center;gap:12px;padding:14px 18px;position:relative}
.ck + .ck::before{content:"";position:absolute;left:18px;right:0;top:0;height:.5px;background:var(--sep)}
.ck .m{flex:1;min-width:0}
.ck .m b{display:block;font-weight:500}
.ck .m span{display:block;font-size:13px;letter-spacing:.005em;color:var(--text2)}
.bigval{font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bigval small{font-size:15px;font-weight:500;color:var(--text2);margin-left:3px;letter-spacing:0}
.inp{width:104px;height:44px;border-radius:12px;border:0;outline:0;padding:0 12px;text-align:right;font-size:20px;font-weight:600;letter-spacing:-.01em;background:var(--inp);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.inp::placeholder{color:var(--text3);font-weight:500}
.inp:focus{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.ok{color:var(--green)}

/* workout card on Today */
.wk-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.wk-name{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.wk-list{margin:12px 0 16px;display:flex;flex-direction:column;gap:5px}
.wk-list div{display:flex;justify-content:space-between;gap:10px;font-size:15px;letter-spacing:-.005em}
.wk-list div span{color:var(--text2);flex:none}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12px;letter-spacing:.01em;font-weight:600;background:var(--ctl);box-shadow:var(--ctl-sh);color:var(--text);white-space:nowrap}
.badge.easy{background:rgba(48,209,88,.16);box-shadow:none;color:#7ee39a}

/* ===== session ===== */
.sbar{position:sticky;top:0;z-index:15;margin:calc(-1 * var(--sat) - 6px) -16px 8px;padding:calc(var(--sat) + 8px) 16px 10px;display:flex;align-items:center;gap:12px;
  background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 .5px 0 var(--sep)}
.sbar .m{flex:1;min-width:0}
.sbar b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar span{font-size:13px;letter-spacing:.005em;color:var(--text2);font-variant-numeric:tabular-nums}
.sbar .pill{height:36px;padding:0 16px;font-size:15px}
.note{padding:12px 16px;border-radius:16px;margin-bottom:12px;font-size:15px;letter-spacing:-.005em;line-height:1.4;background:rgba(48,209,88,.1);color:#b4f0c3}

.fix{padding:6px 0}
.fix-h{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px}
.fix-h b{font-size:17px;font-weight:600}
.fi{display:flex;align-items:center;gap:12px;padding:9px 18px;width:100%;text-align:left}
.fi .m{flex:1;min-width:0}
.fi .m b{display:block;font-weight:500;font-size:16px}
.fi .m span{display:block;font-size:13px;letter-spacing:.005em;color:var(--text2)}
.fi.done .m b{color:var(--text2);text-decoration:line-through;text-decoration-color:var(--text3)}
.circ{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)}
.circ svg{width:14px;height:14px;opacity:0}
.done .circ{background:#f5f5f7;box-shadow:none;color:#000}
.done .circ svg{opacity:1}

.ex{padding:14px 0 8px}
.ex-h{display:flex;align-items:flex-start;gap:10px;padding:0 16px 0 18px}
.ex-h .m{flex:1;min-width:0}
.ex-h b{display:block;font-size:18px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.ss{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--text2);margin-bottom:3px}
.ex-h .more{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:-4px;color:var(--text2)}
.ex-h .more svg{width:20px;height:20px}
.tgt{padding:6px 18px 0;font-size:15px;letter-spacing:-.005em;font-weight:500}
.why{padding:3px 18px 0;font-size:13px;letter-spacing:.005em;color:var(--text2);line-height:1.4}
.sets{margin-top:10px}
.sh,.st{display:grid;grid-template-columns:30px 1fr 84px 70px 44px;align-items:center;gap:8px;padding:0 12px 0 18px}
.sh{font-size:11px;letter-spacing:.04em;font-weight:600;color:var(--text3);text-transform:uppercase;height:22px}
.sh span:nth-child(3),.sh span:nth-child(4){text-align:center}
.st{min-height:52px}
.st .n{font-size:15px;font-weight:600;color:var(--text2);font-variant-numeric:tabular-nums}
.st .pv{font-size:13px;letter-spacing:.005em;color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st input{width:100%;height:40px;border-radius:11px;border:0;outline:0;text-align:center;font-size:18px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;background:var(--inp);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.st input::placeholder{color:var(--text2);font-weight:500;opacity:.8}
.st input:focus{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.tick{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ctl);box-shadow:var(--ctl-sh);color:var(--text2)}
.tick svg{width:18px;height:18px}
.st.done .tick{background:#f5f5f7;box-shadow:none;color:#000}
.st.done input{background:none;box-shadow:none}
.st.done .n{color:var(--text)}
.qrow{display:flex;justify-content:flex-end;padding:0 12px 4px 18px;margin-top:-4px}
.qchip{height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;letter-spacing:.01em;background:rgba(48,209,88,.14);color:#7ee39a}
.qchip.struggled{background:rgba(255,214,10,.14);color:#ffe066}
.qchip.cheated{background:rgba(255,69,58,.14);color:#ff8a80}
.ex-f{display:flex;gap:8px;padding:8px 16px 4px 18px}
.ex-f button{height:34px;padding:0 14px;border-radius:17px;font-size:14px;font-weight:600;color:var(--text2);background:var(--ctl);box-shadow:var(--ctl-sh)}
.cool .fi{padding:9px 18px}

/* ===== rest timer ===== */
#rest{position:fixed;left:12px;right:12px;bottom:calc(var(--sab) + 84px);z-index:30;border-radius:22px;overflow:hidden;
  transform:translateY(calc(100% + var(--sab) + 120px));transition:transform .45s var(--ease);
  background:rgba(28,28,32,.78);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.25),0 16px 40px rgba(0,0,0,.5)}
#rest.on{transform:none}
#rest .bar{height:3px;background:rgba(255,255,255,.08)}
#rest .bar i{display:block;height:100%;width:0;background:#f5f5f7;transition:width .25s linear}
#rest .in{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 18px}
#rest .time{width:auto;font-size:26px;font-weight:600;color:var(--text);letter-spacing:-.01em}
#rest button{height:36px;padding:0 12px;border-radius:18px;font-size:15px;font-weight:600;background:rgba(255,255,255,.1)}
#rest.done{background:rgba(48,209,88,.35)}

/* ===== tab bar ===== */
#tabs{position:fixed;left:50%;bottom:calc(var(--sab) + 14px);z-index:25;transform:translateX(-50%);display:flex;gap:2px;padding:5px;border-radius:32px;
  background:rgba(30,30,34,.55);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.22),0 12px 30px rgba(0,0,0,.5)}
html[data-card="default"] #tabs{background:#1c1c1e;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1),0 12px 30px rgba(0,0,0,.6)}
#tabs button{width:86px;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;letter-spacing:.01em;color:var(--text2)}
#tabs button svg{width:22px;height:22px}
#tabs button.on{color:var(--text);background:rgba(255,255,255,.12)}

/* ===== charts ===== */
.chart{position:relative;height:160px;margin:10px -4px 0}
.chart svg{width:100%;height:100%;overflow:visible}
.chart text{fill:var(--text3);font-size:11px;letter-spacing:.02em;font-weight:500}
.seg{display:flex;background:var(--fill2);border-radius:10px;padding:2px;margin-top:12px}
.seg button{flex:1;height:30px;border-radius:8px;font-size:13px;letter-spacing:.005em;font-weight:600;color:var(--text2)}
.seg button.on{background:rgba(255,255,255,.14);color:var(--text)}
html[data-card="default"] .seg{background:#2c2c2e}
html[data-card="default"] .seg button.on{background:#48484a}
.spark{width:64px;height:26px;flex:none}
.goal{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
.goal i{display:block;height:100%;background:#f5f5f7;border-radius:4px}

/* ===== sheets (floating cards, like Settle) ===== */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:6px;right:6px;bottom:6px;top:calc(var(--sat) + 96px);z-index:41;border-radius:40px;display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(105%);transition:transform .5s var(--ease);will-change:transform;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),rgba(18,18,22,.62);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16),inset 0 1.5px 0 rgba(255,255,255,.32),0 30px 80px rgba(0,0,0,.55)}
html[data-card="default"] .sheet{background:#1c1c1f;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1),0 30px 80px rgba(0,0,0,.6)}
.sheet.short{top:auto;max-height:calc(100% - var(--sat) - 96px)}
.group .row .m span{white-space:normal}
.sheet.on{transform:none}
.grab{height:22px;flex:none;display:grid;place-items:center;touch-action:none}
.grab i{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
.shead{display:flex;align-items:center;justify-content:center;min-height:40px;padding:0 18px;flex:none;touch-action:none}
.shead h3{font-size:17px;font-weight:600;text-align:center}
.sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 18px max(18px, calc(var(--sab) - 6px));flex:1}
.group{border-radius:20px;background:var(--ctl);box-shadow:var(--ctl-sh);margin:10px 0;overflow:hidden}
.slbl{font-size:13px;letter-spacing:.005em;color:var(--text2);margin:22px 4px 0;font-weight:600}
.tg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill2);border-radius:12px;padding:2px;margin-top:10px}
.tg button{height:36px;border-radius:10px;font-size:15px;font-weight:600;color:var(--text2)}
.tg button.on{background:var(--ctl-on);box-shadow:var(--ctl-on-sh);color:var(--text)}
html[data-card="default"] .tg{background:#2c2c2e}
.field{width:100%;height:50px;border-radius:14px;border:0;outline:0;padding:0 16px;font-size:16px;background:var(--inp);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.field::placeholder{color:var(--text3)}
.hint{font-size:13px;letter-spacing:.005em;color:var(--text2);line-height:1.45;margin:8px 4px}
.hint.err{color:var(--red)}
.ol{padding-left:20px;font-size:15px;letter-spacing:-.005em;line-height:1.5;color:var(--text2)}
.ol li{margin:8px 0}
.ol b{color:var(--text)}
.ol a{color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.green{background:var(--green)} .dot.amber{background:var(--amber)} .dot.red{background:var(--red)}
.search{position:sticky;top:-8px;z-index:2;padding:4px 0 8px;margin-top:-4px}
.hist-d{font-size:13px;letter-spacing:.005em;color:var(--text2);font-weight:600;margin:16px 4px 6px}
.hist-s{display:flex;gap:8px;flex-wrap:wrap;margin:0 4px}
.hist-s span{font-size:15px;font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:10px;background:var(--ctl);box-shadow:var(--ctl-sh)}
.hist-s span.cheated{color:#ff8a80} .hist-s span.struggled{color:#ffe066}

/* toast */
.toast{position:fixed;left:50%;top:calc(var(--sat) + 10px);z-index:60;transform:translate(-50%,-160%);padding:12px 18px;border-radius:22px;font-size:15px;font-weight:600;
  white-space:nowrap;transition:transform .5s var(--ease);background:rgba(40,40,44,.85);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16),0 10px 30px rgba(0,0,0,.5)}
.toast.on{transform:translate(-50%,0)}
@media (min-width:600px){ #main{padding-left:calc(50% - 280px);padding-right:calc(50% - 280px)} .sheet{left:calc(50% - 300px);right:calc(50% - 300px)} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

</style>
</head>
<body>
<div id="main"></div>

<nav id="tabs">
<button data-a="tab" data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Today</button>
<button data-a="tab" data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg>Workout</button>
<button data-a="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V4.5M4 19.5h16M7.5 15.5l3.8-4.4 3.2 2.7L19.5 8"/></svg>Progress</button>
</nav>

<div id="rest"><div class="bar"><i></i></div><div class="in">
<div style="flex:1;min-width:0"><div class="lbl">Rest</div><div class="time">0:00</div></div>

// ---------- NitFit coach: pure rules, no screen code ----------
const kgTxt = k => (Math.round(k * 100) / 100).toString();
function snap(kg, step, dir) {
  if (!step) return Math.max(0, Math.round(kg * 2) / 2);
  const f = dir < 0 ? Math.floor : dir > 0 ? Math.ceil : Math.round;
  return Math.max(step, f(kg / step + (dir ? 0 : 1e-9)) * step);
}

const fill = (n, v) => Array.from({ length: n }, () => v);
const unit = ex => ex.t ? " s" : "";

// hist: past sessions for this exercise, oldest first: [{d, sets:[{kg,reps,rir}]}], working sets only
// ctx: {sets, flags (0,1,2), deload (bool), gap (days since any last workout)}
function coachTarget(ex, hist, ctx) {
  hist = hist.map(h => ({ d: h.d, sets: h.sets.map(s => Object.assign({}, s, { reps: s.q === "cheated" ? Math.max(0, s.reps - 2) : s.reps })) }));
  const t = coachCore(ex, hist, ctx);
  if (ctx.light && t.kg != null) t.reason = "Light pump. Stop 2 to 3 reps short of failure. " + t.reason;
  if (ctx.easy && t.tag !== "new") t.reason = "Easy week: keep 3 to 4 reps in the tank. " + t.reason;
  if (ctx.easy && t.tag === "new") t.reason = t.reason.replace("with 2 left in the tank", "with 3 to 4 left in the tank");
  return t;
}

    return { kg: null, reps: fill(n, null), sets: n, tag: "new", reason: ex.eq === "bw"

      : "First time. Pick a weight you can lift about " + Math.round((lo + hi) / 2) + " times with 2 left in the tank. Log what you really did." };
  }
  const last = hist[hist.length - 1];
  const kg = last.sets[0].kg || 0;
  let r = last.sets.map(s => s.reps);
  while (r.length < n) r.push(r[r.length - 1]);
  r = r.slice(0, n);
  const lastTxt = "Last time " + (kg ? kgTxt(kg) + " kg × " : "") + last.sets.map(s => s.reps).join(", ") + u + ".";
  const bw = !kg;
  const down = pct => { if (bw) return kg; let nk = snap(kg * (1 - pct), step, 0); if (nk >= kg) nk = kg - step; return Math.max(step || 0, nk); };

  if (ctx.deload) {
    return { kg, reps: fill(Math.ceil(n / 2), lo), sets: Math.ceil(n / 2), tag: "easy", reason: "Easy week. Half the sets, same weight. Stop 3 reps before failure. This is how you come back stronger." };
  }
  if (ctx.gap >= 14) {
    const s = Math.max(1, Math.ceil(n * 2 / 3));
    return { kg: down(0.2), reps: fill(s, bw ? Math.max(1, Math.round(r[0] * 0.8)) : lo), sets: s, tag: "back", reason: "You were away " + ctx.gap + " days. 20% lighter and fewer sets this week. Build back." };
  }
  if (ctx.gap >= 7) {
    return { kg: down(0.1), reps: fill(n, bw ? Math.max(1, r[0] - 1) : lo), sets: n, tag: "back", reason: "You were away " + ctx.gap + " days. 10% lighter today. Back to normal next time." };
  }
  if (ctx.flags >= 2) {
    const s = Math.max(1, n - 1);
    return { kg, reps: r.slice(0, s), sets: s, tag: "hold", reason: "Bad sleep and low energy. One set less, same weight, no records today. " + lastTxt };
  }
  if (ctx.flags === 1) {

let REST = null, restIv = null, AC = null, wake = null;
function ensureAudio() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (_) {} }
function beep() {
  try { ensureAudio(); if (!AC) return; const now = AC.currentTime, vol = S.settings.vol == null ? 0.6 : S.settings.vol;
    [0, 0.22].forEach((dt, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = "sine"; o.frequency.value = i ? 880 : 660;
      g.gain.setValueAtTime(0.0001, now + dt); g.gain.exponentialRampToValueAtTime(0.25 * vol + 0.001, now + dt + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, now + dt + 0.5);
      o.connect(g).connect(AC.destination); o.start(now + dt); o.stop(now + dt + 0.55); }); } catch (_) {}
}
function startRest(sec) {
  ensureAudio(); REST = { end: Date.now() + sec * 1000, total: sec * 1000, rang: false };
  try { localStorage.setItem("nitfit:rest", JSON.stringify(REST)); } catch (_) {}
  clearInterval(restIv); restIv = setInterval(paintRest, 250); paintRest(); wakeOn();
}
function stopRest() { REST = null; clearInterval(restIv); try { localStorage.removeItem("nitfit:rest"); } catch (_) {} paintRest(); wakeOff(); }
function paintRest() {
  const el = $("#rest"); if (!REST) { el.classList.remove("on", "done"); return; }
  const left = REST.end - Date.now();
  if (left <= 0 && !REST.rang) { REST.rang = true; beep(); haptic(); el.classList.add("done"); setTimeout(() => { if (REST && REST.rang) stopRest(); }, 4000); }
  const t = Math.max(0, Math.ceil(left / 1000));
  $(".time", el).textContent = Math.floor(t / 60) + ":" + pad2(t % 60);
  $(".bar i", el).style.width = Math.min(100, 100 * (1 - Math.max(0, left) / REST.total)) + "%";
  el.classList.add("on");
}
ACT.restAdd = el => { if (!REST) return; REST.end += +el.dataset.v * 1000; REST.total = Math.max(REST.total, REST.end - Date.now()); REST.rang = false; $("#rest").classList.remove("done"); paintRest(); };

function wakeOff() { try { if (wake) wake.release(); } catch (_) {} wake = null; }

function lineChart(pts, o) {
  const W = 340, H = 150, pl = 4, pr = 34, pt = 10, pb = 22;
  let vs = pts.map(p => p.v).concat(pts.filter(p => p.raw != null).map(p => p.raw));
  let lo = Math.min(...vs), hi = Math.max(...vs); if (hi - lo < 1) { lo -= 0.5; hi += 0.5; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
  const t0 = dayNum(pts[0].d), t1 = Math.max(t0 + 1, dayNum(pts[pts.length - 1].d));
  const X = d => pl + (dayNum(d) - t0) / (t1 - t0) * (W - pl - pr), Y = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  const P = pts.map(p => [X(p.d), Y(p.v)]);
  let d = "M" + P[0][0].toFixed(1) + " " + P[0][1].toFixed(1);
  for (let i = 1; i < P.length; i++) { const a = P[i - 2] || P[i - 1], b = P[i - 1], c = P[i], e = P[i + 1] || c;
    d += " C" + (b[0] + (c[0] - a[0]) / 6).toFixed(1) + " " + (b[1] + (c[1] - a[1]) / 6).toFixed(1) + " " + (c[0] - (e[0] - b[0]) / 6).toFixed(1) + " " + (c[1] - (e[1] - b[1]) / 6).toFixed(1) + " " + c[0].toFixed(1) + " " + c[1].toFixed(1); }
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">';
  [hi - pad, lo + pad].forEach(v => { s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="rgba(255,255,255,.08)" stroke-dasharray="2 4"/><text x="' + (W - pr + 6) + '" y="' + (Y(v) + 4).toFixed(1) + '">' + (Math.round(v * 10) / 10) + "</text>"; });
  pts.forEach(p => { if (p.raw != null) s += '<circle cx="' + X(p.d).toFixed(1) + '" cy="' + Y(p.raw).toFixed(1) + '" r="2" fill="rgba(255,255,255,.28)"/>'; });
  s += '<path d="' + d + '" fill="none" stroke="#f5f5f7" stroke-width="2.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
  s += '<text x="' + pl + '" y="' + (H - 4) + '">' + niceDate(pts[0].d) + '</text><text x="' + (W - pr) + '" y="' + (H - 4) + '" text-anchor="end">' + niceDate(pts[pts.length - 1].d) + "</text>";
  return s + "</svg>";
}
function spark(vals) {
  if (vals.length < 2) return '<span class="spark"></span>';
  const lo = Math.min(...vals), hi = Math.max(...vals) || 1, W = 64, H = 26;
  const pts = vals.map((v, i) => (i / (vals.length - 1) * (W - 4) + 2).toFixed(1) + "," + (H - 3 - (hi === lo ? 0.5 : (v - lo) / (hi - lo)) * (H - 6)).toFixed(1)).join(" ");
  return '<svg class="spark" viewBox="0 0 64 26"><polyline points="' + pts + '" fill="none" stroke="#f5f5f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function syncPaint() { if (SHEET === "settings" && !syncing) { /* refreshed on next open */ } }
ACT.exportFile = () => {
  const blob = new Blob([JSON.stringify(buildExport())], { type: "application/json" }), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "nitfit-" + today() + ".json"; document.body.appendChild(a); a.click(); a.remove();
};
ACT.importFile = () => $("#importIn").click();
document.addEventListener("DOMContentLoaded", () => {
  $("#importIn").addEventListener("change", async e => { const f = e.target.files[0]; if (!f) return; try { const n = await importExport(JSON.parse(await f.text())); toast(n + " entries loaded"); closeSheet(); render(); } catch (er) { toast(er.message || "Could not read that file"); } e.target.value = ""; });
});

// ----- tabs and taps -----
ACT.tab = el => {
  const t = el.dataset.tab; SCROLL[TAB] = $("#main").scrollTop;
  if (t === TAB) { $("#main").scrollTo({ top: 0, behavior: "smooth" }); return; }
  TAB = t; haptic(); closeSheet(); render();
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const f = ACT[el.dataset.a]; if (f) { e.preventDefault(); f(el, e); }
});

// ----- boot -----
async function boot() {
  try { await coreBoot(); } catch (e) { $("#main").innerHTML = '<div class="empty"><b>NitFit could not open its storage</b>Close it and open it again.</div>'; return; }
  applyCard(); render();
  try { const r = JSON.parse(localStorage.getItem("nitfit:rest") || "null"); if (r && r.end > Date.now()) { REST = r; restIv = setInterval(paintRest, 250); paintRest(); } } catch (_) {}
  if (KV.token) syncNow(true);
  if ("serviceWorker" in navigator && isStandalone()) navigator.serviceWorker.register("sw.js").catch(() => {});
  setInterval(() => { const s = activeSession(), el = $("#sTime"); if (s && el && el.firstChild) el.firstChild.textContent = fmtClock(Date.now() - Date.parse(s.startTs)) + " · "; }, 1000);
  let lastDay = today();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState !== "visible") return; if (today() !== lastDay) { lastDay = today(); render(); } if (KV.token) syncNow(); if (REST) paintRest(); });
}
boot();

</script>
